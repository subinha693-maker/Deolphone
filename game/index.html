<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>흰 공간 — 프롤로그</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game">
    <canvas id="stage" aria-label="흰 공간"></canvas>

    <!-- 상단 버튼 -->
    <div id="hud">
      <button type="button" id="btn-status" class="hud-btn" disabled title="상태">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 14 8 8 15 2 8Z" fill="none" stroke="currentColor"/><path d="M8 5 11 8 8 11 5 8Z" fill="currentColor"/></svg>
        <span>상태</span>
      </button>
      <button type="button" id="btn-restart" class="hud-btn" title="처음부터">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8a4.5 4.5 0 1 0 1.3-3.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3 2.5v3h3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <span>처음부터</span>
      </button>
      <button type="button" id="btn-fullscreen" class="hud-btn icon-only" title="전체 화면">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
    </div>

    <!-- 대화창: [초상화][대사창] -->
    <div id="dialogue-layer">
      <div class="choices"></div>
      <div class="dlg-row">
        <div class="dlg-portrait"><img alt=""></div>
        <div class="dlg">
          <div class="dlg-name"></div>
          <div class="dlg-body">
            <div class="dlg-text" aria-live="polite"></div>
          </div>
          <div class="dlg-next" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <!-- 맵 장면 조작: 조이스틱 + 조사 버튼 -->
    <div id="pad" aria-hidden="true">
      <div class="pad-base"><div class="pad-knob"></div></div>
      <button type="button" class="pad-act">조사</button>
    </div>

    <!-- 이름 입력 -->
    <div id="name-input" class="overlay">
      <form class="ni-panel p-frame" autocomplete="off">
        <h2 class="plate">이름</h2>
        <p class="ni-q">당신의 이름을 알려 주세요.</p>
        <input type="text" id="ni-field" maxlength="8" placeholder="이름 (1~8글자)" enterkeyhint="done" spellcheck="false">
        <p class="ni-err" role="alert"></p>
        <button type="submit" class="g-btn ni-ok">이 이름으로 한다</button>
      </form>
    </div>

    <!-- 직업 선택 -->
    <div id="job-select" class="overlay">
      <div class="js-panel p-frame">
        <header class="js-head">
          <h2 class="plate">받아들일 힘을 고르세요</h2>
          <p>선택하기 전에 각각의 힘을 자세히 살펴볼 수 있습니다.</p>
        </header>
        <div class="js-main">
          <div class="js-list"></div>
          <div class="js-detail"></div>
        </div>
        <footer class="js-foot">
          <button type="button" class="g-btn js-accept" disabled>이 힘을 받아들인다</button>
        </footer>
      </div>
    </div>

    <!-- 상태창 -->
    <div id="status" class="overlay">
      <div class="st-panel p-frame">
        <h2 class="plate">상태</h2>
        <div class="st-body"></div>
        <button type="button" class="g-btn st-close">닫기</button>
      </div>
    </div>

    <!-- 확인 창 -->
    <div id="confirm" class="overlay">
      <div class="cf-panel p-frame">
        <h2 class="plate cf-title"></h2>
        <p class="cf-body"></p>
        <div class="cf-actions">
          <button type="button" class="g-btn cf-no">취소</button>
          <button type="button" class="g-btn accent cf-yes">확인</button>
        </div>
      </div>
    </div>

    <!-- 다음 장면 (미구현 자리 표시) -->
    <div id="next-scene" class="overlay">
      <div class="ns-panel p-frame">
        <h2 class="plate ns-title">다음 장면</h2>
        <p class="muted">이 장면은 아직 구현되지 않은 임시 연결 지점입니다.<br>아래는 다음 장면으로 전달된 게임 상태입니다.</p>
        <ul class="ns-summary"></ul>
        <div class="cf-actions">
          <button type="button" class="g-btn ns-back" hidden>이전 장면으로 돌아가기</button>
          <button type="button" class="g-btn ns-restart">처음부터 다시</button>
        </div>
      </div>
    </div>

    <div id="closeup" aria-hidden="true"><img alt=""></div>
    <div id="toast" role="status"></div>
    <div id="veil"></div>

    <div id="start-gate">
      <p>화면을 눌러 시작</p>
      <div class="gate-dev">
        <span>장면 단독 테스트</span>
        <select id="gate-scene" aria-label="장면"></select>
        <select id="gate-job" aria-label="입고 있을 의상(직업)"></select>
        <button type="button" id="gate-go">시작</button>
      </div>
    </div>

    <div id="rotate-hint">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="14" y="6" width="20" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M40 30a14 14 0 0 1-10 12" fill="none" stroke="currentColor" stroke-width="2"/><path d="M30 38v5h5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <p>기기를 가로로 돌려 주세요</p>
    </div>
  </div>

  <!-- 데이터 (수정용) -->
  <script src="js/data/characters.js"></script>
  <script src="js/data/balance.js"></script>
  <script src="js/data/jobs.js"></script>
  <script src="js/data/progression.js"></script>
  <script src="js/data/items.js"></script>
  <script src="js/data/script.js"></script>
  <!-- 엔진 -->
  <script src="js/core/state.js"></script>
  <script src="js/core/scriptParser.js"></script>
  <script src="js/core/scriptRunner.js"></script>
  <script src="js/core/sceneManager.js"></script>
  <script src="js/render/sprites.js"></script>
  <script src="js/render/dots.js"></script>
  <script src="js/render/effects.js"></script>
  <script src="js/render/stage.js"></script>
  <script src="js/ui/dialogue.js"></script>
  <script src="js/ui/jobSelect.js"></script>
  <script src="js/ui/hud.js"></script>
  <!-- 맵 시스템 (쯔꾸르식 이동 장면 공통) -->
  <script src="js/map/mapView.js"></script>
  <script src="js/map/mapCommands.js"></script>
  <!-- 장면: 새 장면은 js/scenes/ 에 파일을 만들고 여기에 한 줄만 추가 (js/scenes/_template.js 참고) -->
  <script src="js/scenes/whiteSpace.js"></script>
  <script src="js/scenes/chapter1.js"></script>
  <script src="js/scenes/heroRoom/map.js"></script>
  <script src="js/scenes/heroRoom/script.js"></script>
  <script src="js/scenes/heroRoom/scene.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
