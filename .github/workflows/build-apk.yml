name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      # 실패하면 오류 기록을 build-log 브랜치에 저장 (고치기 위해)
      - name: Save build log on failure
        if: failure()
        run: |
          cp build.log /tmp/build.log || echo "no log" > /tmp/build.log
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan build-log
          git rm -rf -q . || true
          cp /tmp/build.log build.log
          git add build.log
          git commit -q -m "build log ${{ github.sha }}"
          git push -f origin build-log

      - uses: actions/upload-artifact@v4
        with:
          name: DeolPhone-apk
          path: app/build/outputs/apk/release/app-release.apk

      # 폰에서 로그인 없이 바로 받을 수 있게 '릴리스'에 APK를 올린다
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk DeolPhone.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DeolPhone.apk --title "덜폰 최신 APK" --notes "자동 빌드 ${{ github.sha }}"
