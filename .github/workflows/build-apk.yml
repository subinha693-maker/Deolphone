name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DeolPhone-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 폰에서 로그인 없이 바로 받을 수 있게 '릴리스'에 APK를 올린다
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DeolPhone.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DeolPhone.apk --title "덜폰 최신 APK" --notes "자동 빌드 ${{ github.sha }}"
