<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>심연의 계단</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* 레이아웃: 횃불에 비친 낡은 모험 일지. 폰 세로 화면 한 장에 들어가는 1열 구조 */
:root{
  --bg:#15120e; --panel:#201b15; --panel2:#2a231b; --line:#3e3429; --ink:#ecdfc6; --dim:#a8977d; --faint:#6e6252;
  --brass:#d9a54c; --brass-ink:#1b150c; --blood:#d24b3d; --mana:#5b97de; --heal:#7cc46b; --poison:#9bc64f; --crit:#ffd54f; --shield:#a9c1d8;
  --r-common:#cfc4ae; --r-rare:#62acf2; --r-legend:#f2a92f; --r-cursed:#c65de2;
  --el-fire:#ec7440; --el-ice:#7fcbec; --el-lightning:#eed44a; --el-holy:#f5e7a6; --el-dark:#a78ddb;
  --town:#3b4a2e; --field:#2e3a4a; --late:#5a2430;
  --f-display:'Nanum Myeongjo','Batang','AppleMyungjo',serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
#top{flex:none}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:16px;display:flex;flex-direction:column;gap:12px}
.scroll>*,.title-wrap>*{flex-shrink:0}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .faint{color:var(--faint)} .small{font-size:12px}

.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:10px 12px;cursor:pointer;text-align:center;min-height:44px;transition:transform .08s,border-color .15s,background .15s}
.btn:hover{border-color:var(--brass)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.ecard:focus-visible,.wnode:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn[disabled]{opacity:.38;cursor:not-allowed;transform:none}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--blood);color:var(--blood)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}

.topbar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:6px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.tb-name{font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;min-width:0}
.tb-name .cls{font-family:var(--f-display);font-size:16px}
.cyc{font-size:11px;color:var(--brass);border:1px solid var(--brass);border-radius:3px;padding:0 4px}
.tb-right{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.gold{color:var(--brass);font-family:var(--f-mono);font-weight:700}
.bars{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 74px;gap:6px}
.bar{position:relative;height:16px;background:#0e0c09;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--blood);transition:width .35s ease}
.bar.mp>i{background:var(--mana)} .bar.xp>i{background:var(--brass)} .bar.sh>i{background:var(--shield)} .bar.pg>i{background:var(--heal)}
.bar>span{position:relative;display:block;text-align:center;font-family:var(--f-mono);font-size:11px;line-height:14px;font-weight:700;text-shadow:0 1px 2px #000}

.title-wrap{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.logo{font-family:var(--f-display);font-size:clamp(38px,11vw,54px);line-height:1;color:var(--brass);letter-spacing:-.03em}
.logo small{display:block;font-size:14px;color:var(--dim);letter-spacing:.24em;margin-top:8px;font-family:var(--f-body)}
.meta-box{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:12px;display:grid;gap:8px}
.kv{display:flex;justify-content:space-between;gap:10px}

.card{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer}
.card:hover{border-color:var(--brass)}
.card h3{font-size:18px;display:flex;gap:8px;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;text-align:center;font-size:11px}
.statgrid b{display:block;font-family:var(--f-mono);font-size:14px;color:var(--ink)}
.statgrid span{color:var(--dim)}
.skill-line{font-size:12px;color:var(--dim)} .skill-line b{color:var(--ink);font-weight:500}
.choices{display:grid;gap:10px}
.flavor{font-family:var(--f-display);color:var(--dim);font-size:15px;border-left:2px solid var(--line);padding-left:10px;margin:0}
.sec-t{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-top:4px}

/* 월드맵 */
.world{position:relative;width:100%;aspect-ratio:6/6.2;max-width:100%;background:radial-gradient(ellipse at 40% 40%,#231d15,#15120e 75%);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.world svg{position:absolute;inset:0;width:100%;height:100%}
.world line{stroke:#5a4a36;stroke-width:3;stroke-dasharray:6 5}
.world line.open{stroke:var(--brass);stroke-dasharray:none;opacity:.7}
.wnode{position:absolute;width:15.4%;transform:translate(-50%,-50%);aspect-ratio:1/1.05;border-radius:6px;border:1px solid var(--line);background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.15;padding:2px;cursor:pointer;color:var(--ink);overflow:hidden}
.wnode.town{background:var(--town)} .wnode.late{background:var(--late)} .wnode.tower{background:#3a2e4a}
.wnode .wi{font-size:16px;line-height:1.1}
.wnode.locked{filter:grayscale(.9) brightness(.55)}
.wnode.here{box-shadow:0 0 0 2px var(--crit);border-color:var(--crit)}
.wnode.sel{outline:2px solid var(--ink)}
.wnode .lvb{font-family:var(--f-mono);font-size:9px;color:var(--dim)}
.winfo{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:12px;display:grid;gap:6px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:3px}

/* 맵 / 지역 목록 */
.place-head{display:flex;flex-direction:column;gap:4px}
.place-head h2{font-size:24px}
.alist{display:grid;gap:8px}
.aitem{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 12px;text-align:left}
.aitem .ic{font-size:24px;text-align:center}
.aitem .st{font-size:11px;text-align:right}
.fac{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.fac .btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.fac .btn b{font-size:15px}

/* 탐색 장면 */
.scene{position:relative;height:150px;border-radius:8px;overflow:hidden;border:1px solid var(--line);flex-shrink:0}
.scene .sky{position:absolute;inset:0}
.scene .far,.scene .near{position:absolute;left:0;white-space:nowrap;will-change:transform}
.scene .far{bottom:44px;font-size:22px;opacity:.55;letter-spacing:34px}
.scene .near{bottom:20px;font-size:30px;letter-spacing:58px}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:30px}
.scene .ground::after{content:"";position:absolute;inset:8px 0 auto;height:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 14px,transparent 14px 34px);background-size:34px 3px;animation:none}
.scene.walking .ground::after{animation:groundmove .35s linear infinite}
.hero{position:absolute;left:22%;bottom:22px;width:36px;height:48px;image-rendering:pixelated;background-size:72px 48px;background-repeat:no-repeat}
.scene.walking .hero{animation:walk .32s steps(1) infinite,bob .32s ease-in-out infinite}
.encounter{position:absolute;right:10%;bottom:22px;display:flex;gap:4px;align-items:flex-end;animation:slidein .45s ease-out}
.encounter .mon{font-size:34px;line-height:1}
.encounter .bang{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-weight:800;color:var(--crit);font-size:22px;animation:popin .3s}
.find{position:absolute;right:16%;bottom:28px;font-size:30px;animation:popin .35s}
.spr{display:inline-block;image-rendering:pixelated;background-repeat:no-repeat;animation:idle .9s steps(3) infinite}
@keyframes walk{0%{background-position:0 0}50%{background-position:-36px 0}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes groundmove{to{background-position:-34px 0}}
@keyframes slidein{from{transform:translateX(80px);opacity:0}to{transform:none;opacity:1}}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.xlog{display:flex;flex-direction:column;gap:3px;font-size:13px;min-height:60px}
.xlog p{margin:0;animation:fadein .25s}
.xlog p:not(:last-child){color:var(--faint)}

/* 전투 */
.battle{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.enemies{display:grid;gap:6px;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.ecard{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;transition:opacity .4s,border-color .15s}
.ecard.boss{border-color:#6d2a22;background:linear-gradient(180deg,#2a1713,var(--panel))}
.ecard.elite{border-color:#5b3070}
.ecard.acting{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.ecard.tgt{border-color:var(--crit);animation:pulse 1s infinite}
.ecard.dead{opacity:.28;pointer-events:none}
.e-top{display:flex;gap:4px;align-items:center;min-width:0}
.e-icon{font-size:22px;line-height:1}
.e-spr{display:flex;justify-content:center;min-height:0}
.e-name{font-weight:700;font-size:12px;line-height:1.2;overflow-wrap:anywhere}
.e-lv{font-family:var(--f-mono);font-size:10px;color:var(--dim)}
.badges{display:flex;gap:3px;flex-wrap:wrap}
.badge{font-size:10px;padding:0 4px;border-radius:3px;border:1px solid var(--line);color:var(--dim);line-height:16px}
.intent{font-size:11px;line-height:1.3;padding:3px 5px;border-radius:4px;background:#0e0c09;border:1px dashed var(--line);color:var(--ink)}
.intent.heavy{border-color:var(--blood);color:#ffb3a8;animation:warn 1.2s infinite}
.intent .num{color:var(--crit)}
.intent.next{opacity:.6}
.chips{display:flex;gap:3px;flex-wrap:wrap}
.chip{font-size:11px;line-height:16px;padding:0 4px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip.bad{border-color:#6d3530} .chip.good{border-color:#3d5a6e}
.initbar{display:flex;gap:4px;overflow-x:auto;font-size:11px;align-items:center;scrollbar-width:none;min-height:26px}
.initbar::-webkit-scrollbar{display:none}
.ini{white-space:nowrap;padding:2px 6px;border-radius:4px;background:var(--panel);border:1px solid var(--line)}
.ini.me{border-color:var(--brass)} .ini.extra{color:var(--crit)} .ini b{font-family:var(--f-mono)}
.ini.now{background:var(--panel2);box-shadow:0 0 0 1px var(--ink)}
.blog{flex:1;min-height:80px;overflow-y:auto;background:#0f0d0a;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;line-height:1.45}
.blog p{margin:0 0 2px;animation:fadein .25s}
.blog .rd{color:var(--faint);font-size:11px;margin-top:4px;border-top:1px dashed var(--line);padding-top:2px}
.n-p{color:var(--brass)} .n-e{color:#e7b59a}
.l-dmg{color:var(--blood);font-weight:700;font-family:var(--f-mono)} .l-heal{color:var(--heal);font-weight:700;font-family:var(--f-mono)}
.l-crit{color:var(--crit);font-weight:700} .l-miss{color:var(--faint)} .l-st{color:#c9a6e8} .l-sys{color:var(--dim)} .l-warn{color:#ffb3a8}
.l-good{color:var(--heal)} .l-gold{color:var(--brass)}
.el-fire{color:var(--el-fire)} .el-ice{color:var(--el-ice)} .el-lightning{color:var(--el-lightning)} .el-holy{color:var(--el-holy)} .el-dark{color:var(--el-dark)}
.pcard{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;display:grid;gap:4px;cursor:pointer}
.pcard.acting{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.p-row{display:flex;gap:6px;align-items:center}
.p-row .bar{flex:1}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;min-height:100px;align-content:start}
.actions .btn{padding:8px 4px;font-size:14px}
.actions .wide{grid-column:1/-1}
.actions .note{grid-column:1/-1;text-align:center;color:var(--dim);font-size:12px;padding:4px}
.actlist{grid-column:1/-1;display:grid;gap:6px;max-height:34vh;overflow-y:auto}
.act-item{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;padding:8px 10px}
.act-item .d{grid-column:1/-1;font-size:11px;color:var(--dim)}
.reward{grid-column:1/-1;border:1px solid var(--brass);background:var(--panel);border-radius:6px;padding:12px;display:grid;gap:6px}
.reward h3{color:var(--brass);font-size:20px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,0);font-family:var(--f-mono);font-weight:700;font-size:20px;text-shadow:0 2px 0 #000,0 0 6px #000;animation:pop .95s ease-out forwards;white-space:nowrap}
.pop.dmg{color:#ff6b5b} .pop.crit{color:var(--crit);font-size:28px} .pop.heal{color:var(--heal)} .pop.miss{color:#bbb;font-size:15px} .pop.st{color:#d4b2f0;font-size:13px} .pop.shield{color:var(--shield);font-size:16px} .pop.mana{color:var(--mana);font-size:16px}
.shake{animation:shake .35s}
.flash::after{content:"";position:absolute;inset:0;border-radius:6px;background:#ff3b2b;opacity:0;animation:flash .35s;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}15%{opacity:1;transform:translate(-50%,-6px) scale(1.25)}35%{transform:translate(-50%,-14px) scale(1)}100%{opacity:0;transform:translate(-50%,-56px) scale(.95)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes flash{0%{opacity:.45}100%{opacity:0}}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--crit)}}
@keyframes warn{50%{background:#2a1210}}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes idle{to{background-position-x:var(--endx)}}
#main.screen-shake{animation:shake .4s}
@media (prefers-reduced-motion:reduce){.shake,#main.screen-shake,.ecard.tgt,.intent.heavy,.scene.walking .hero{animation:none}.pop{animation-duration:.6s}}

#modal{position:fixed;inset:0;z-index:40;display:none;background:rgba(8,6,4,.78);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));align-items:center;justify-content:center}
#modal.open{display:flex}
.mbox{width:100%;max-width:520px;max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--brass);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:fadein .2s}
.mbox>*{flex-shrink:0}
.mbox h2{font-size:20px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{border:1px dashed var(--line);border-radius:6px;padding:8px;min-height:52px;cursor:pointer;text-align:left;background:transparent;display:flex;flex-direction:column}
.slot .lab{font-size:10px;color:var(--faint)}
.items{display:grid;gap:6px}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 10px;text-align:left}
.it .ico{font-size:20px}
.it .d{font-size:11px;color:var(--dim)}
.rar-common{color:var(--r-common)} .rar-rare{color:var(--r-rare)} .rar-legend{color:var(--r-legend)} .rar-cursed{color:var(--r-cursed)}
.it.sel{border-color:var(--crit);background:#2f2716}
.perks{display:grid;gap:8px}
.perk{padding:14px}
.perk h3{font-size:17px}
.statline{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px}
.statline div{background:var(--panel2);border-radius:4px;padding:4px 6px}
.statline b{font-family:var(--f-mono);float:right}
.roll{display:inline-block;font-family:var(--f-mono);font-size:12px;background:#0e0c09;border:1px solid var(--line);border-radius:4px;padding:2px 6px;margin:2px 0}
.ev-text{font-size:15px;line-height:1.7}
.ev-text p{margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--brass);border-radius:6px;padding:8px 14px;z-index:60;max-width:90vw;animation:fadein .2s;font-size:13px}
</style>
</head>
<body>
<div id="app"><header id="top"></header><main id="main"></main></div>
<div id="modal"></div>
<div id="fx"></div>
<script>
'use strict';
/* =====================================================================
   데이터 영역 — 여기만 늘리면 콘텐츠가 늘어납니다.
   몬스터 스탯은 "Lv1 기준"으로 적고, 실제 레벨은 지역이 정합니다.

const SAVE_KEY='abyss_adventure_v2';
let G=null, B=null, P=null, UID=0, BUSY=false;
let SETTINGS={fast:false};
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const chance=p=>Math.random()*100<p;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const d10=()=>ri(1,10);
function wpick(arr,wf){ const tot=arr.reduce((s,x)=>s+wf(x),0); let r=Math.random()*tot; for(const x of arr){ r-=wf(x); if(r<=0) return x; } return arr[arr.length-1]; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const sleep=ms=>new Promise(r=>setTimeout(r, ms*(SETTINGS.fast?.45:1)));
function josa(w,pair){ if(!pair.includes('/')) return pair; const [a,b]=pair.split('/'); const ch=w.charCodeAt(w.length-1); if(ch<0xAC00||ch>0xD7A3) return b; const jong=(ch-0xAC00)%28; if(pair==='으로/로') return (jong&&jong!==8)?a:b; return jong?a:b; }
const nm=(c,j)=>`<b class="${c.isPlayer?'n-p':'n-e'}">${c.name}</b>${j?josa(c.name,j):''}`;
const elTag=el=>el?`<span class="el-${el}">${ELEMENTS[el].icon}${ELEMENTS[el].name}</span>`:'';
const fmt=n=>Math.round(n).toLocaleString('ko-KR');

/* ---------- 저장 ---------- */
function save(){ if(!G) return; try{ localStorage.setItem(SAVE_KEY,JSON.stringify(G)); }catch(e){} }
function loadSave(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){ return null; } }
function loadSettings(){ try{ Object.assign(SETTINGS,JSON.parse(localStorage.getItem(SAVE_KEY+'_set'))||{}); }catch(e){} }
function saveSettings(){ try{ localStorage.setItem(SAVE_KEY+'_set',JSON.stringify(SETTINGS)); }catch(e){} }
const expNeed=lv=>Math.round(20+2.6*lv*lv);

/* ---------- 맵 헬퍼 ---------- */
const areaKey=(m,a)=>m+'/'+a;
function areaDef(key){ const [m,a]=key.split('/'); return Object.assign({map:m,key},MAPS[m].areas.find(x=>x.id===a)); }
const scaleMap=m=>MAPS[m].scale!==false&&!MAPS[m].tower;
const cycleAdd=m=>scaleMap(m)?(G.cycle-1)*CYCLE_LV:0;
function areaLv(key){ const A=areaDef(key); if(MAPS[A.map].tower) return towerLv(); return [A.lv[0]+cycleAdd(A.map),A.lv[1]+cycleAdd(A.map)]; }
const towerLv=()=>{ const f=G.tower.floor; const l=16+Math.round(4*(f-1)); return [l,l+2]; };

function mapUnlockedReq(m){ const r=MAPS[m].req; if(!r) return true; if(r==='ticket') return !!G.flags.ticket; return !!G.cleared[r]; }
function mapReqText(m){ const r=MAPS[m].req; if(!r) return ''; if(r==='ticket') return '남부두 마을에서 배표 구입'; const A=areaDef(r); return `${MAPS[A.map].name} · ${A.name} 보스 처치`; }
function reachable(){ // 들바람에서 열린 맵으로 이어진 곳들

}

function areaOpen(key){ const A=areaDef(key); const M=MAPS[A.map]; const i=M.areas.findIndex(x=>x.id===A.id); if(i===0) return true; const prev=M.areas[i-1]; return !!G.cleared[areaKey(A.map,prev.id)]||!prev.boss&&(G.explore[areaKey(A.map,prev.id)]||0)>=100; }

/* ---------- 스탯 ---------- */
function baseS(){ return {atk:0,def:0,agi:0,mag:0,maxHp:0,maxMana:0,crit:5,critDmg:1.6,evade:0,lifesteal:0,manaRegen:2,manaRegenPct:.04,diceBonus:0,diceMin:1,hits:1,hitMult:1,armorPen:0,stunChance:0,poisonOnHit:0,burnOnHit:0,bleedOnHit:0,thorns:0,skillCostMul:1,skillRefund:0,goldMul:1,expMul:1,dmgTakenMul:1,dmgMul:1,selfDmg:0,startShield:0,phoenix:0,healMul:1,consSlots:5,postHeal:0,riposte:0,firstDice:0,spellblade:0,elemBonus:0,dropBonus:0,immune:{},vsTag:{},flags:{},element:null}; }
function addStats(s,add,n=1){ for(const k in add){ if(k==='immune'||k==='vsTag'||k==='flags') Object.assign(s[k],add[k]); else s[k]=(s[k]||0)+add[k]*n; } }
const SCALE_KEYS=['atk','def','mag','maxHp','maxMana'];
const gearMul=g=>(1+.14*(g.lv-1))*(1+.08*(g.plus||0));
function gearStats(g){ const it=ITEMS[g.id], st=it.stats||{}, out={}; const m=gearMul(g);
  for(const k in st){ if(SCALE_KEYS.includes(k)) out[k]=Math.round(st[k]*m); else if(k==='agi') out[k]=Math.round(st[k]*(1+.04*(g.lv-1))); else if(typeof st[k]==='object') out[k]=st[k]; else out[k]=st[k]; }
  return out; }
function statusMods(c,s){ const st=c.st;
  if(st.slow) s.agi*=.6;
  if(st.frenzy){ s.atk*=1.4; s.agi*=1.3; s.dmgTakenMul*=1.25; }
  if(st.guard) s.def*=1+(st.guard.pow||.5);
  if(st.burn) s.def*=.85;
  if(st.weak) s.dmgMul*=.7;
  if(st.defend) s.dmgTakenMul*=.5;
  if(st.enrage) s.atk*=1.5;
}
function pStats(){
  const c=CLASSES[G.cls], s=baseS(), late=[], pct={};
  addStats(s,c.base);
  for(const k in c.growth) s[k]+=c.growth[k]*(G.lv-1);
  addStats(s,G.bonus);
  if(c.passive.stats) addStats(s,c.passive.stats); if(c.passive.late) late.push(c.passive.late);
  for(const id in G.perks){ const pk=PERKS[id], n=G.perks[id]; if(pk.stats) addStats(s,pk.stats,n); if(pk.pct) for(const k in pk.pct) pct[k]=(pct[k]||0)+pk.pct[k]*n; if(pk.late) late.push(pk.late); }
  for(const sl of SLOTS){ const g=G.equip[sl]; if(!g) continue; const it=ITEMS[g.id]; addStats(s,gearStats(g)); if(it.late) late.push(it.late); if(it.element) s.element=it.element; }
  const cm=1+.05*(G.cycle-1); for(const k of ['atk','def','mag','maxHp']) pct[k]=(pct[k]||0)+(cm-1);
  for(const k in pct) s[k]*=1+pct[k];
  if(B){ if(B.giant){ s.maxHp*=1.5; s.agi*=.7; } if(B.berserk) s.atk*=1+Math.max(0,(s.maxHp-P.hp)/s.maxHp)*.8; }
  statusMods(P,s);
  for(const f of late) f(s);
  for(const k of ['atk','def','agi','mag','maxHp','maxMana']) s[k]=Math.max(0,Math.round(s[k]));
  s.maxHp=Math.max(1,s.maxHp); s.skillCostMul=Math.max(.3,s.skillCostMul); s.dmgTakenMul=Math.max(.3,s.dmgTakenMul); s.diceMin=Math.min(10,s.diceMin);
  return s;
}
function eStats(e){ const s={atk:e.atk,def:e.def,agi:e.agi,mag:e.mag,crit:5,critDmg:1.5,evade:e.evade||0,dmgMul:1,dmgTakenMul:1,maxHp:e.maxHp,armorPen:0,flags:{},immune:e.immune||{},thorns:e.thorns||0}; statusMods(e,s); return s; }
const stats=c=>c.isPlayer?pStats():eStats(c);
const lvOf=c=>c.isPlayer?G.lv:c.lv;
const maxHpOf=c=>c.isPlayer?pStats().maxHp:c.maxHp;
const alive=()=>B?B.enemies.filter(e=>e.hp>0):[];
function elementMult(a,d){ if(!a||!d) return 1; if(ELEMENT_BEATS[a]===d) return 1.5; if(a===d||ELEMENT_BEATS[d]===a) return .7; return 1; }
const mitig=(atkLv,def)=>{ const K=10+3*atkLv; return K/(K+Math.max(0,def)); };

function cardOf(c){ return document.getElementById('cb-'+c.uid); }

/* ---------- 상태이상 ---------- */
function addStatus(c,id,turns,data={}){
  if(c.hp<=0) return false;
  const def=STATUSES[id];
  const imm=c.isPlayer?pStats().immune:(c.immune||{});
  if(imm[id]){ popup(c,'면역','miss'); log(`<span class="l-sys">${nm(c,'은/는')} ${def.name}에 면역이다.</span>`); return false; }
  if(!c.isPlayer&&c.resist&&c.resist[id]&&chance(c.resist[id])){ popup(c,'저항','miss'); log(`<span class="l-sys">${nm(c,'이/가')} ${def.name}에 저항했다.</span>`); return false; }
  const cur=c.st[id];
  if(id==='bleed') c.st[id]={t:Math.max(turns,cur?cur.t:0),stack:Math.min(10,(cur?cur.stack:0)+(data.stack||1))};
  else if(id==='toxic') c.st[id]={t:Math.max(turns,cur?cur.t:0),n:cur?cur.n:1};
  else c.st[id]=Object.assign({},cur||{},data,{t:Math.max(turns,cur?cur.t:0)});
  if(B&&B.cur===c) c.st[id].fresh=true;
  if(B){ popup(c,def.icon+def.name,'st'); log(`<span class="l-st">${nm(c,'이/가')} ${def.icon}${def.name}${id==='bleed'?` (${c.st[id].stack}중첩)`:''} 상태가 되었다.</span>`); }
  return true;
}
function cleanse(c){ for(const id in c.st) if(STATUSES[id].bad) delete c.st[id]; }
function tickStart(c){
  for(const id of Object.keys(c.st)){ const st=c.st[id]; if(STATUSES[id].tick==='start'){ st.t--; if(st.t<=0) delete c.st[id]; } }
  const mx=maxHpOf(c), bm=c.boss?.4:1;
  const dot=(id,dmg,txt)=>{ if(!c.st[id]||c.hp<=0) return; dmg=Math.max(1,Math.round(dmg)); applyDamage(c,dmg,{dot:true}); log(`${nm(c,'이/가')} ${txt} <span class="l-dmg">${dmg}</span> 피해`); };
  dot('poison',Math.max(2,mx*.05*bm),'☠독으로');
  if(c.st.toxic){ dot('toxic',mx*.02*c.st.toxic.n*bm+2,'🧪맹독으로'); if(c.st.toxic) c.st.toxic.n++; }
  if(c.st.bleed) dot('bleed',mx*.01*c.st.bleed.stack*bm+c.st.bleed.stack,'🩸출혈로');
  dot('burn',Math.max(3,mx*.06*bm),'🔥화상으로');
}
function tickEnd(c){ for(const id of Object.keys(c.st)){ const st=c.st[id]; if(STATUSES[id].tick!=='end') continue; if(st.fresh){ st.fresh=false; continue; } st.t--; if(st.t<=0) delete c.st[id]; } }

/* ---------- 피해 / 회복 ---------- */
function applyDamage(t,dmg,o={}){
  let d=dmg;
  if(t.isPlayer&&B){
    if(B.shield>0){ const a=Math.min(B.shield,d); B.shield-=a; d-=a; if(a) popup(t,'🛡'+a,'shield'); }
    if(d>0&&t.st.barrier&&P.mana>0){ const ab=Math.min(d,P.mana*2); P.mana-=Math.ceil(ab/2); d-=ab; if(ab) popup(t,'🔷'+ab,'mana'); }
  }
  t.hp=Math.max(0,t.hp-d);
  if(d>0&&t.st.sleep&&!o.dot){ delete t.st.sleep; log(`<span class="l-sys">${nm(t,'이/가')} 깨어났다!</span>`); }
  if(d>0){ popup(t,(o.crit?'💥':'')+fmt(d),o.crit?'crit':'dmg'); shake(t); }
  if(t.hp<=0) onDeath(t);
  return d;
}
function heal(c,amt){
  if(c.st&&c.st.noheal){ if(B){ popup(c,'회복 불가','miss'); log(`<span class="l-sys">${nm(c,'은/는')} 광휘 때문에 회복하지 못한다.</span>`); } return 0; }
  if(c.isPlayer) amt*=pStats().healMul;
  const h=Math.max(0,Math.min(maxHpOf(c)-c.hp,Math.round(amt))); c.hp+=h; if(h>0&&B) popup(c,'+'+fmt(h),'heal'); return h;
}
function healMsg(c,amt){ const h=heal(c,amt); if(B) log(`${nm(c,'이/가')} <span class="l-heal">${fmt(h)}</span> 회복했다.`); else toast(`HP <b class="l-good">+${fmt(h)}</b>`); }
function gainMana(n,msg){ const mx=pStats().maxMana; const g=Math.max(0,Math.min(mx-P.mana,Math.round(n))); P.mana+=g; if(msg){ if(B){ popup(P,'+'+g+' MP','mana'); log(`${nm(P,'이/가')} 마나를 <span class="l-heal">${g}</span> 회복했다.`); } else toast(`마나 <b class="l-good">+${g}</b>`); } return g; }
function imbue(el){ addStatus(P,'imbue',99,{el}); log(`무기에 ${elTag(el)} 기운이 깃든다.`); }

function strike(src,tgt,raw,o={}){
  if(!B||tgt.hp<=0||src.hp<=0) return {hit:false};
  const S=stats(src), T=stats(tgt), type=o.type||'phys';
  if(!o.noEvade){
    if(tgt.st.stealth||tgt.st.smoke){ popup(tgt,'회피','miss'); log(`<span class="l-miss">${nm(tgt,'이/가')} 그림자 속에서 공격을 흘려보냈다.</span>`); return {hit:false,miss:true}; }
    let ev=clamp(4+(T.agi-S.agi)*.8+(T.evade||0),0,55);
    if(tgt.st.sleep||tgt.st.stun) ev=0;
    if(chance(ev)){ popup(tgt,'MISS','miss'); log(`<span class="l-miss">${nm(src,'의')} 공격이 빗나갔다. (회피 ${Math.round(ev)}%)</span>`); return {hit:false,miss:true}; }
  }
  let dmg=raw*rand(.9,1.1), tags=[];
  const el=o.element||null;
  if(el){
    if(tgt.isPlayer&&el==='fire'&&T.flags.fireImmune){ popup(tgt,'불 무효','miss'); log(`<span class="l-sys">용비늘이 불길을 막아냈다.</span>`); return {hit:false}; }
    let em=elementMult(el,tgt.element);
    if(!tgt.isPlayer&&tgt.weakTo===el) em=Math.max(em,1.5);
    if(em>1&&src.isPlayer&&S.elemBonus) em+=S.elemBonus;
    if(em>1) tags.push(`<span class="l-crit">상성!</span>`); else if(em<1) tags.push('<span class="l-miss">저항</span>');
    dmg*=em;
  }
  if(src.isPlayer&&S.vsTag&&tgt.tags) for(const tg of tgt.tags) if(S.vsTag[tg]){ dmg*=S.vsTag[tg]; tags.push('<span class="l-crit">특효!</span>'); }
  let crit=false;
  if(type!=='true'){ const cc=(o.forceCrit||src.st.stealth)?100:S.crit+Math.min(25,S.agi*.15); crit=chance(cc); if(crit){ dmg*=S.critDmg; tags.unshift('<span class="l-crit">치명타!</span>'); } }
  if(type!=='true'){ let def=T.def; const pen=(o.armorPen||0)+(src.isPlayer&&type==='phys'?S.armorPen:0); def*=1-Math.min(1,pen); if(type==='magic') def*=.5; dmg*=mitig(lvOf(src),def); }
  dmg*=S.dmgMul*T.dmgTakenMul;
  dmg=Math.max(1,Math.round(dmg));
  const dealt=applyDamage(tgt,dmg,{crit});
  log(`${o.label?o.label+' ':''}→ ${nm(tgt)}에게 ${el?elTag(el)+' ':''}<span class="l-dmg">${fmt(dmg)}</span> 피해 ${tags.join(' ')}`);
  const ls=(src.isPlayer?S.lifesteal:0)+(o.lifesteal||0);
  if(ls>0&&dealt>0&&src.hp>0){ const h=heal(src,dealt*ls); if(h) log(`${nm(src,'이/가')} 피를 빨아 <span class="l-heal">${fmt(h)}</span> 회복`); }
  if(src.isPlayer&&!o.noProc&&tgt.hp>0){
    if(S.poisonOnHit&&chance(S.poisonOnHit)) addStatus(tgt,'poison',3);
    if(P.st.venom) addStatus(tgt,'poison',3);
    if(S.burnOnHit&&chance(S.burnOnHit)) addStatus(tgt,'burn',2);
    if(S.bleedOnHit&&chance(S.bleedOnHit)) addStatus(tgt,'bleed',3,{stack:1});
    if(S.stunChance&&chance(S.stunChance)) addStatus(tgt,'stun',1);
  }
  if(src.hp>0&&!o.noProc&&type==='phys'&&T.thorns&&dealt>0){ const th=Math.max(1,Math.round(dmg*T.thorns)); applyDamage(src,th); log(`🌵가시가 ${nm(src)}에게 <span class="l-dmg">${fmt(th)}</span> 반사`); }
  if(tgt.isPlayer&&src.hp>0&&!o.noProc){
    if(T.flags.chillOnHit&&chance(50)) addStatus(src,'slow',2);
    if(tgt.st.defend&&T.riposte&&tgt.hp>0) strike(P,src,T.atk*T.riposte,{type:'phys',noProc:true,noEvade:true,label:'↩반격!'});
  }
  return {hit:true,dmg:dealt,crit};
}

function onDeath(c){
  if(c.isPlayer){
    const s=pStats();
    if(s.phoenix&&!B.phoenixUsed){ B.phoenixUsed=true; c.hp=Math.round(s.maxHp*.4); popup(c,'🔥부활','heal'); log(`<span class="l-crit">불사조 깃털이 타오르며 다시 일어섰다!</span>`); return; }
    const ci=G.cons.indexOf('coin');
    if(ci>=0){ G.cons.splice(ci,1); c.hp=1; popup(c,'🪙부활','heal'); log(`<span class="l-crit">망자의 동전이 바스러지며 숨이 돌아온다! (HP 1)</span>`); cleanse(c); return; }
    return;
  }
  log(`<span class="l-good">✝ ${nm(c,'을/를')} 쓰러뜨렸다!</span>`);
  // 레벨 차이가 크면 경험치 감소
  const diff=G.lv-c.lv; const em=diff>5?Math.max(.1,1-(diff-5)*.12):1;
  B.exp+=Math.round(c.exp*em); B.gold+=ri(c.gold[0],c.gold[1])+(c.stolen||0); G.kills++;
  if(c.stolen) log(`<span class="l-gold">훔쳐간 골드 ${c.stolen}을 되찾았다.</span>`);
}

    maxHp:Math.round(d.hp*(1+.16*L)*pow*(o.elite?1.7:1)*(d.boss?.55:1)),atk:Math.round(d.atk*(1+.13*L)*pow*(o.elite?1.25:1)),def:Math.round(d.def*(1+.12*L)*pow+el*2),
    agi:Math.round(d.agi+.3*L+el),mag:Math.round(d.mag*(1+.13*L)*pow*(o.elite?1.25:1)),element:d.element||null,tags:d.tags||[],immune:d.immune||{},resist:d.resist||{},

function refillIntents(e){ while(e.intents.length<2){ const prev=e.intents.length?e.intents[e.intents.length-1].id:e.last; const it=pickIntent(e,prev); if(it.once) e.flags[it.id]=true; e.intents.push(it); } }
function intentHTML(e,it,next){

function genEncounter(key){
  const A=areaDef(key), [lo,hi]=areaLv(key);
  if(MAPS[A.map].tower){ const pool=Object.keys(MONSTERS).filter(id=>!MONSTERS[id].boss&&id!=='mimic'&&id!=='slimelet'); const n=chance(50)?2:chance(50)?3:1; return Array.from({length:n},()=>({id:pick(pool),lv:ri(lo,hi)})); }
  const r=Math.random(); const n=r<.45?1:r<.85?2:3;
  const pool=Object.entries(A.pool);
  return Array.from({length:n},()=>({id:wpick(pool,x=>x[1])[0],lv:ri(lo,hi)}));
}

/* ---------- 전투 흐름 ---------- */
function startBattle(list,opt={}){
  const pow=opt.pow||1;
  const enemies=list.map((x,i)=>makeMonster(x.id,x.lv,{elite:opt.elite&&i===0,pow}));
  B={enemies,round:0,queue:[],qi:0,rolls:[],exp:0,gold:0,shield:0,mode:'busy',cur:null,over:false,result:null,
     boss:!!opt.boss,elite:!!opt.elite,giant:false,berserk:false,fleeSure:false,phoenixUsed:false,awaiting:null,pending:null,opt,pow,summonLv:Math.max(...list.map(x=>x.lv))};
  P.st={}; P.cd={};
  for(const e of enemies) refillIntents(e);
  renderBattleShell();
  runBattle().catch(err=>{ console.error(err); });
}
async function runBattle(){
  const s=pStats();
  log(`<span class="l-sys">${B.boss?'👑 보스 전투!':B.elite?'💀 정예 전투!':'⚔ 전투 시작!'} ${B.enemies.map(e=>nm(e)+` <span class="faint">Lv${e.lv}</span>`).join(', ')}</span>`);
  if(s.startShield){ B.shield=Math.round(s.maxHp*s.startShield); log(`🔮 수정 목걸이가 보호막 <b>${B.shield}</b>을 펼친다.`); }
  if(s.flags.firstStealth) addStatus(P,'stealth',2);
  for(const [id,t] of G.nextBattle) addStatus(P,id,t); G.nextBattle=[];
  renderBattle();
  if(s.flags.firstShot){ await sleep(400); const t=pick(alive()); log(`🏹 선제 사격!`); strike(P,t,s.atk*.8,{type:'phys',element:(P.st.imbue&&P.st.imbue.el)||s.element}); checkEnd(); renderBattle(); }
  while(!B.over){
    B.round++; rollInit(); renderBattle(); await sleep(550);
    B.qi=0;
    while(B.qi<B.queue.length&&!B.over){ const c=B.queue[B.qi++]; await takeTurn(c); checkEnd(); renderBattle(); }
  }
  await sleep(500);
  finishBattle();
}
function rollInit(){
  B.enemies=B.enemies.filter(e=>e.hp>0);
  for(const el of document.querySelectorAll('.ecard')) if(!B.enemies.some(e=>'cb-'+e.uid===el.id)) el.remove();
  const s=pStats();
  const rolls=[P,...B.enemies].map(c=>{
    const st=c.isPlayer?s:eStats(c); let die=d10(), die2=null, bonus=0;
    if(c.isPlayer){ if(s.flags.diceTwice) die2=d10(); let best=Math.max(die,die2||0); best=Math.max(best,s.diceMin); bonus=s.diceBonus+(B.round===1?s.firstDice:0); return {c,agi:st.agi,die,die2,best,bonus,total:st.agi+best+bonus,extra:false}; }
    return {c,agi:st.agi,die,best:die,bonus:0,total:st.agi+die,extra:false};
  });
  const me=rolls[0], others=rolls.slice(1);
  const maxE=Math.max(...others.map(r=>r.total));
  if(others.length&&me.total>=maxE*2) me.extra=true;
  for(const r of others) if(r.total>=me.total*2) r.extra=true;
  rolls.sort((a,b)=>b.total-a.total||(a.c.isPlayer?-1:b.c.isPlayer?1:b.agi-a.agi));
  B.rolls=rolls; B.queue=[];
  for(const r of rolls){ B.queue.push(r.c); if(r.extra) B.queue.push(r.c); }
  logRound(`— ${B.round}라운드 — `+rolls.map(r=>`${r.c.isPlayer?'나':r.c.name} ${r.agi}+🎲${r.die2!=null?`${r.die}/${r.die2}`:r.die}${r.bonus?'+'+r.bonus:''}=<b>${r.total}</b>${r.extra?' ⚡추가 행동':''}`).join(' · '));
}
async function takeTurn(c){
  if(c.hp<=0||B.over) return;
  B.cur=c; renderBattle();
  tickStart(c); checkEnd(); renderBattle();
  if(B.over||c.hp<=0){ B.cur=null; return; }
  if(c.isPlayer){
    const s=pStats();
    gainMana(s.manaRegen+s.maxMana*s.manaRegenPct);
    for(const k in P.cd) if(P.cd[k]>0) P.cd[k]--;
    if(s.selfDmg){ const d=Math.round(s.maxHp*s.selfDmg); applyDamage(P,d,{dot:true}); log(`<span class="l-warn">저주받은 검이 피를 빤다. HP -${d}</span>`); checkEnd(); if(B.over){ B.cur=null; return; } }
  }
  if(c.st.stun){ log(`<span class="l-st">${nm(c,'은/는')} 💫기절해 움직이지 못한다.</span>`); popup(c,'💫','st'); await sleep(450); }
  else if(c.st.sleep){ log(`<span class="l-st">${nm(c,'은/는')} 💤잠들어 있다.</span>`); popup(c,'💤','st'); await sleep(450); }
  else if(c.isPlayer) await playerTurn();
  else { await sleep(380); await enemyAct(c); await sleep(320); }
  tickEnd(c);
  B.cur=null;
}
function checkEnd(){ if(!B||B.over) return; if(P.hp<=0){ B.over=true; B.result='lose'; } else if(!alive().length){ B.over=true; B.result='win'; } }

function playerTurn(){ return new Promise(res=>{ B.awaiting=res; B.mode='main'; renderBattle(); }); }
function uiAct(kind,arg){
  if(!B||!B.awaiting) return;
  if(kind==='back'){ B.mode='main'; B.pending=null; renderBattle(); return; }
  if(kind==='skills'||kind==='items'){ B.mode=kind; renderBattle(); return; }
  let target=null;
  if(kind==='attack') target='one';
  if(kind==='skill') target=SKILLS[arg].target;
  if(kind==='item') target=ITEMS[G.cons[arg]].target||'self';
  if(target==='one'&&alive().length>1){ B.mode='target'; B.pending={kind,arg}; renderBattle(); return; }
  resolveAction({kind,arg,target:target==='one'?alive()[0]:null});
}
function uiTarget(uid){
  if(!B) return;
  const e=B.enemies.find(x=>x.uid===uid);
  if(B.mode==='target'&&B.pending&&e&&e.hp>0){ const p=B.pending; B.pending=null; resolveAction({kind:p.kind,arg:p.arg,target:e}); return; }
  if(e) showEnemyInfo(e);
}
async function resolveAction(a){
  const res=B.awaiting; B.awaiting=null; B.mode='busy'; renderBattle();
  const quick=await performAction(a);
  checkEnd();
  if(quick&&!B.over&&P.hp>0){ B.awaiting=res; B.mode='main'; renderBattle(); return; }
  res();
}
const skillCost=(id,s)=>Math.max(1,Math.round(SKILLS[id].cost*(1+.04*(G.lv-1))*(s||pStats()).skillCostMul));
async function performAction(a){
  const s=pStats();
  if(a.kind==='attack'){
    const el=(P.st.imbue&&P.st.imbue.el)||s.element; const magic=s.flags.basicMagic;
    log(`${nm(P,'의')} ${magic?'마력 화살':'공격'}!`);
    for(let i=0;i<s.hits;i++){
      let t=a.target; if(!t||t.hp<=0){ t=alive()[0]; if(!t) break; }
      const raw=(magic?s.mag*.75+s.atk*.3:s.atk)*s.hitMult+(s.spellblade?s.mag*s.spellblade:0);
      strike(P,t,raw,{type:magic?'magic':'phys',element:el});
      renderBattle(); if(i<s.hits-1) await sleep(240);
    }
    delete P.st.stealth;
  } else if(a.kind==='skill'){
    const sk=SKILLS[a.arg], cost=skillCost(a.arg,s);
    P.mana-=cost; if(sk.cd) P.cd[a.arg]=sk.cd+1;
    log(`${nm(P,'의')} <b class="l-crit">${sk.name}</b>!`);
    sk.run(a.target,s);
    if(s.skillRefund){ const r=Math.floor(cost*s.skillRefund); if(r) gainMana(r); }
    if(sk.target!=='self') delete P.st.stealth;
    if(sk.target==='all') shakeScreen();
    await sleep(200);
    return !!sk.quick;
  } else if(a.kind==='item'){
    const id=G.cons[a.arg], it=ITEMS[id];
    G.cons.splice(a.arg,1);
    log(`${nm(P,'이/가')} <b class="rar-${it.rarity}">${it.icon} ${it.name}</b>${josa(it.name,'을/를')} 사용했다.`);
    it.use(a.target);
    await sleep(200);
    return !!it.quick;
  } else if(a.kind==='defend'){
    addStatus(P,'defend',1); const g=gainMana(4+s.maxMana*.04); log(`${nm(P,'이/가')} 몸을 웅크려 방어한다. (마나 +${g})`);
  } else if(a.kind==='flee'){
    const avg=alive().reduce((t,e)=>t+eStats(e).agi,0)/Math.max(1,alive().length);
    const ch=B.fleeSure?100:clamp(50+(s.agi-avg)*3,15,90);
    if(chance(ch)){ log(`<span class="l-sys">달아나는 데 성공했다! (${Math.round(ch)}%)</span>`); B.over=true; B.result='flee'; }
    else log(`<span class="l-warn">도망치지 못했다! (${Math.round(ch)}%)</span>`);
  }
  return false;
}

async function enemyAct(e){
  const it=e.intents.shift(); e.last=it.id; refillIntents(e);
  const S=eStats(e);
  log(`<span class="l-warn">${nm(e,'의')} ${it.name}!</span>`);
  renderBattle();
  const mirrored=()=>{ if(it.skill&&P.st.mirror){ delete P.st.mirror; popup(P,'🪞반사','st'); log(`<span class="l-crit">🪞 거울 조각이 ${it.name}${josa(it.name,'을/를')} 튕겨냈다!</span>`); return true; } return false; };
  switch(it.type){
    case 'attack':{
      const hits=it.hits||1;
      if(mirrored()){ const d=Math.round((it.magic?S.mag:S.atk)*it.mult*hits*.8); applyDamage(e,d); log(`${nm(e,'이/가')} 자기 기술에 <span class="l-dmg">${fmt(d)}</span> 피해`); break; }
      for(let i=0;i<hits;i++){ if(P.hp<=0||e.hp<=0) break;
        const r=strike(e,P,(it.magic?S.mag:S.atk)*it.mult,{type:it.magic?'magic':'phys',element:it.element||null,lifesteal:it.lifesteal});
        if(it.heavy&&r.hit) shakeScreen();
        if(r.hit&&it.status&&P.hp>0&&chance(it.status[2]??100)) addStatus(P,it.status[0],it.status[1],it.status[3]||{});
        renderBattle(); if(i<hits-1) await sleep(260);
      }
      break; }
    case 'buff':{ const tg=it.target==='allies'?alive():[e]; for(const t of tg) addStatus(t,it.status[0],it.status[1],it.status[3]||{}); break; }
    case 'debuff':{ if(mirrored()){ addStatus(e,it.status[0],it.status[1]); break; } if(chance(it.status[2]??100)) addStatus(P,it.status[0],it.status[1]); else log('<span class="l-miss">하지만 통하지 않았다.</span>'); break; }
    case 'heal':{ const t=it.target==='ally'?alive().sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0]:e; const h=heal(t,t.maxHp*(it.pct||.25)); if(h) log(`${nm(t,'이/가')} <span class="l-heal">${fmt(h)}</span> 회복했다.`); break; }
    case 'summon':{ if(alive().length>=4){ log('<span class="l-sys">하지만 아무것도 나타나지 않았다.</span>'); break; }
      const m=makeMonster(it.summon,Math.max(1,e.lv-2),{pow:B.pow}); m.exp=Math.round(m.exp*.4); m.gold=[0,Math.round(m.gold[1]/2)]; refillIntents(m); B.enemies.push(m); log(`<span class="l-warn">${nm(m,'이/가')} 나타났다!</span>`); break; }
    case 'steal':{ const amt=Math.min(G.gold,ri(5,12)*Math.ceil(e.lv/3)); G.gold-=amt; e.stolen=(e.stolen||0)+amt; popup(P,'-'+amt+'G','miss'); log(`<span class="l-warn">골드 ${amt}을 도둑맞았다! (쓰러뜨리면 되찾는다)</span>`); renderTop(); break; }
  }
  checkEnd();
}

function finishBattle(){
  const result=B.result, opt=B.opt;
  P.st={};
  if(result==='lose'){ B=null; playerDeath(); return; }
  if(result==='flee'){ B=null; clampPlayer(); save(); toast('무사히 달아났다.'); backFromBattle(); return; }
  const s=pStats();
  const gold=Math.round(B.gold*s.goldMul);
  G.gold+=gold;
  const lines=[`<span class="l-good">EXP +${fmt(B.exp*s.expMul)}</span> · <span class="l-gold">골드 +${fmt(gold)}</span>`];
  const lv=B.summonLv, drops=[];
  if(B.boss){ drops.push(randomItem({gear:true,minRarity:'rare',lv:lv})); drops.push(randomItem({type:'cons',minRarity:'rare'})); }
  else { if(B.elite) drops.push(randomItem({minRarity:'rare',lv})); if(chance(16+s.dropBonus+B.enemies.length*4)) drops.push(randomItem({lv})); }
  for(const d of drops) lines.push('획득: '+gainItem(d));
  if(s.postHeal){ const h=heal(P,s.maxHp*s.postHeal); if(h) lines.push(`🩹 응급처치 <span class="l-heal">+${fmt(h)}</span>`); }
  const mg=gainMana(s.maxMana*.25); if(mg) lines.push(`<span class="dim">숨을 고르며 마나 +${mg}</span>`);
  if(opt.onWinLine){ const l=opt.onWinLine(); if(l) lines.push(l); }
  const exp=B.exp;
  B.mode='reward'; B.rewardLines=lines; B.giant=false; B.berserk=false;
  clampPlayer();
  gainExp(exp);
  save(); renderBattle(); renderTop();
}
function afterBattle(){ const opt=B.opt; B=null; clampPlayer(); save(); processLevelUps(()=>{ if(opt.after) opt.after(); else backFromBattle(); }); }
function backFromBattle(){ if(G.loc.area) showArea(G.loc.area,true); else showPlace(G.loc.map); }
function clampPlayer(){ const s=pStats(); P.hp=Math.min(P.hp,s.maxHp); P.mana=Math.min(P.mana,s.maxMana); }
function playerDeath(){
  const lost=Math.floor(G.gold*.2); G.gold-=lost; G.deaths++;
  const s=pStats(); P.hp=s.maxHp; P.mana=s.maxMana; P.st={};
  G.loc={map:G.lastTown,area:null}; save(); renderTop();
  setMain(`<div class="scroll"><span class="dim small">패배</span><h2 style="color:var(--blood);font-size:28px">정신을 잃었다...</h2>
    <div class="ev-text"><p>눈을 떠보니 ${MAPS[G.lastTown].name}의 여관이다. 누군가 여기까지 끌고 와 준 모양이다.</p>
    <p><b class="l-warn">골드 -${fmt(lost)}</b> (가진 골드의 20%)<br><span class="dim">레벨·장비·스탯은 그대로입니다.</span></p></div>
    <button class="btn primary" onclick="showPlace(G.lastTown)">일어난다</button></div>`);
}

/* ---------- 성장 ---------- */
function gainExp(n){ n=Math.round(n*pStats().expMul); G.exp+=n; while(G.exp>=expNeed(G.lv)){ G.exp-=expNeed(G.lv); G.lv++; G.pendingLv++; const s=pStats(); heal(P,s.maxHp*.3); gainMana(s.maxMana*.3); } renderTop(); }
function processLevelUps(done){ if(G.pendingLv>0){ G.pendingLv--; showPerkPick(()=>processLevelUps(done)); } else done(); }
function showPerkPick(done){
  const pool=Object.keys(PERKS).filter(id=>(!PERKS[id].cls||PERKS[id].cls.includes(G.cls))&&!(PERKS[id].max&&(G.perks[id]||0)>=PERKS[id].max));
  const opts=shuffle(pool).slice(0,3);
  openModal(`<h2>⬆ 레벨 업! Lv.${G.lv-G.pendingLv}</h2>
    <p class="dim small">모든 스탯이 올랐습니다. 강화 하나를 더 고르세요. 강화는 영구히 남습니다.</p>
    <div class="perks">${opts.map(id=>{ const pk=PERKS[id]; const n=G.perks[id]||0; return `<button class="btn card perk" onclick="pickPerk('${id}')"><h3>${pk.icon} ${pk.name}${n?` <span class="small dim">(보유 ${n}${pk.max?'/'+pk.max:''})</span>`:''}</h3><div>${pk.desc}</div></button>`; }).join('')}</div>`);
  window._perkDone=done;
}
function pickPerk(id){ const before=pStats(); G.perks[id]=(G.perks[id]||0)+1; const after=pStats(); if(after.maxHp>before.maxHp) P.hp+=after.maxHp-before.maxHp; if(after.maxMana>before.maxMana) P.mana+=after.maxMana-before.maxMana; clampPlayer(); closeModal(); renderTop(); save(); const d=window._perkDone; window._perkDone=null; if(d) d(); }
function gainBonus(k,v){ G.bonus[k]=(G.bonus[k]||0)+v; }
function gainGold(n,L){ const g=Math.round(n*pStats().goldMul*(1+.25*((L||1)-1))); G.gold+=g; return g; }
function hurtPct(p){ P.hp=Math.max(1,P.hp-Math.round(pStats().maxHp*p)); }
function check(stat,dc,L){ dc=Math.round(dc+(L-1)*(stat==='agi'?.45:stat==='mag'&&G.cls!=='mage'?.6:1.1)); const v=pStats()[stat], d=d10()+(G.bonus.diceBonus||0), tot=v+d, ok=tot>=dc;
  return {ok,text:`<span class="roll">🎲 ${d} + ${STAT_NAME[stat]} ${v} = <b>${tot}</b> ${ok?'≥':'<'} ${dc} → ${ok?'성공!':'실패'}</span>`}; }

/* ---------- 아이템 ---------- */
function randomItem(o){
  const order=['common','rare','legend'];
  let cand=Object.keys(ITEMS).filter(id=>{ const it=ITEMS[id]; if(it.recipeOnly) return false; if(o.type&&it.type!==o.type) return false; if(o.gear&&it.type==='cons') return false;
    if(o.minRarity&&(order.indexOf(it.rarity)<order.indexOf(o.minRarity))) return false; return true; });
  if(!cand.length) cand=Object.keys(ITEMS).filter(id=>!ITEMS[id].recipeOnly);
  const lv=Math.max(1,Math.round(o.lv||G.lv));
  const rar=wpick([...new Set(cand.map(id=>ITEMS[id].rarity))],r=>RARITY[r].w+(r==='legend'?Math.min(12,lv/8):0));
  const id=pick(cand.filter(id=>ITEMS[id].rarity===rar));
  return ITEMS[id].type==='cons'?id:{id,lv:Math.max(1,lv+ri(-1,1)),plus:0};
}
const isGear=x=>typeof x==='object';
const idOf=x=>isGear(x)?x.id:x;
function itName(x){ const id=idOf(x), it=ITEMS[id]; return `<b class="rar-${it.rarity}">${it.icon} ${it.name}${isGear(x)&&x.plus?' +'+x.plus:''}</b>${isGear(x)?` <span class="num faint small">Lv${x.lv}</span>`:''}`; }
function gainItem(x){
  const id=idOf(x), it=ITEMS[id];
  if(it.type==='cons'){
    if(G.cons.length>=pStats().consSlots){ const g=Math.ceil(price(x)/3); G.gold+=g; return `${itName(x)} <span class="dim">(소모품이 가득 차 ${g}골드에 팔았다)</span>`; }
    G.cons.push(id);
  } else {
    if(G.bag.length>=BAG_MAX){ const g=Math.ceil(price(x)/3); G.gold+=g; return `${itName(x)} <span class="dim">(장비 가방이 가득 차 ${g}골드에 팔았다)</span>`; }
    G.bag.push(x);
  }
  return itName(x);
}
function price(x){ const it=ITEMS[idOf(x)]; if(it.type==='cons') return Math.round(it.price*(1+.06*(G.lv-1))); return Math.round(RARITY[it.rarity].gear*(1+.15*(x.lv-1))*(1+.3*(x.plus||0))); }
function itemDesc(x){ const id=idOf(x), it=ITEMS[id]; const st=isGear(x)?gearStats(x):{}; const parts=[];
  for(const k of ['atk','def','agi','mag','maxHp','maxMana','crit','evade']) if(st[k]) parts.push(`${STAT_NAME[k]} ${st[k]>0?'+':''}${st[k]}`);
  return `${parts.length?`<b>${parts.join(' · ')}</b> — `:''}${it.desc}${it.element?' '+elTag(it.element):''}`; }

function openModal(html){ const m=$('#modal'); m.innerHTML=`<div class="mbox">${html}</div>`; m.classList.add('open'); }
function closeModal(){ const m=$('#modal'); m.classList.remove('open'); m.innerHTML=''; }
function setMain(html){ $('#main').innerHTML=html; }

function renderTop(){
  const t=$('#top');
  if(!G){ t.innerHTML=''; return; }
  const s=pStats(), c=CLASSES[G.cls], need=expNeed(G.lv);
  t.innerHTML=`<div class="topbar">
    <div class="tb-name"><span class="cls">${c.icon} ${c.name}</span><span class="num">Lv.${G.lv}</span><span class="cyc">${G.cycle}회차</span></div>
    <div class="tb-right"><span class="gold">${fmt(G.gold)}G</span>${B||BUSY?'':`<button class="btn sm" onclick="showInventory()">가방</button>`}<button class="btn sm ghost" onclick="toggleFast()" aria-label="속도">${SETTINGS.fast?'⏩':'▶'}</button></div>
    <div class="bars"><div class="bar"><i style="width:${P.hp/s.maxHp*100}%"></i><span>HP ${fmt(P.hp)}/${fmt(s.maxHp)}</span></div>
    <div class="bar mp"><i style="width:${s.maxMana?P.mana/s.maxMana*100:0}%"></i><span>MP ${fmt(P.mana)}/${fmt(s.maxMana)}</span></div>
    <div class="bar xp"><i style="width:${G.exp/need*100}%"></i><span>${Math.floor(G.exp/need*100)}%</span></div></div></div>`;
}
function toggleFast(){ SETTINGS.fast=!SETTINGS.fast; saveSettings(); renderTop(); }

/* ---------- 타이틀 ---------- */
function showTitle(){
  G=null; P=null; B=null; renderTop();
  const sv=loadSave();
  setMain(`<div class="scroll"><div class="title-wrap">
    <div class="logo">심연의 계단<small>TEXT ADVENTURE RPG</small></div>
    <p class="dim">들바람 마을에서 시작해 그림자에 먹힌 빅토리아 성까지. 왕을 쓰러뜨리면 세계는 다시 처음으로 돌아가지만 <b style="color:var(--brass)">당신의 힘은 남습니다.</b> 회차를 거듭해야만 닿을 수 있는 땅이 있습니다.</p>
    ${sv?`<div class="meta-box">
      <div class="kv"><span class="dim">저장된 모험</span><b>${CLASSES[sv.cls].icon} ${CLASSES[sv.cls].name} · Lv.${sv.lv} · ${sv.cycle}회차</b></div>
      <div class="kv"><span class="dim">현재 위치</span><b>${MAPS[sv.loc.map].name}</b></div>
      <div class="kv"><span class="dim">처치 / 쓰러짐</span><b class="num">${sv.kills} / ${sv.deaths}</b></div></div>
      <button class="btn primary" onclick="continueGame()">이어하기</button>`:''}
    <button class="btn ${sv?'':'primary'}" id="newBtn" onclick="newGameAsk(this)">새 모험</button>
  </div></div>`);
}
function newGameAsk(btn){ if(loadSave()&&!btn.dataset.ok){ btn.dataset.ok=1; btn.textContent='한 번 더 누르면 저장된 모험이 지워집니다'; btn.classList.add('danger'); return; } showClassSelect(); }
function continueGame(){ G=loadSave(); if(!G){ showTitle(); return; } migrate(); P=G.p; P.st={}; if(G.loc.area) showArea(G.loc.area); else showPlace(G.loc.map); }
function migrate(){ G.flags=G.flags||{}; G.tower=G.tower||{floor:1,best:0}; G.nextBattle=G.nextBattle||[]; G.recipes=G.recipes||[]; G.pendingLv=G.pendingLv||0; }

function showClassSelect(){
  setMain(`<div class="scroll"><h2>직업 선택</h2>
    ${Object.entries(CLASSES).map(([id,c])=>`<button class="btn card" onclick="newGame('${id}')">
      <h3><img src="${buildHero(id)}" alt="" style="width:36px;height:48px;object-fit:cover;object-position:left;image-rendering:pixelated"> ${c.name}</h3><div class="dim small">${c.blurb}</div>
      <div class="statgrid"><div><span>공격</span><b>${c.base.atk}</b></div><div><span>방어</span><b>${c.base.def}</b></div><div><span>민첩</span><b>${c.base.agi}</b></div><div><span>마력</span><b>${c.base.mag}</b></div><div><span>마나</span><b>${c.base.maxMana}</b></div><div><span>HP</span><b>${c.base.maxHp}</b></div></div>
      ${c.skills.map(k=>`<div class="skill-line"><b>${SKILLS[k].name}</b> (${SKILLS[k].cost}MP) — ${SKILLS[k].desc}</div>`).join('')}
      <div class="skill-line"><b>패시브 · ${c.passive.name}</b> — ${c.passive.desc}</div>
    </button>`).join('')}
    <button class="btn ghost" onclick="showTitle()">뒤로</button></div>`);
}
function newGame(cls){
  const c=CLASSES[cls];
  G={cls,p:{isPlayer:true,uid:'p',name:c.name,hp:0,mana:0,st:{},cd:{}},lv:1,exp:0,cycle:1,gold:40,perks:{},bonus:{},
     equip:{weapon:null,armor:null,acc1:null,acc2:null},bag:[],cons:[...c.start],loc:{map:'deulbaram',area:null},lastTown:'deulbaram',
     cleared:{},explore:{},flags:{},tower:{floor:1,best:0},recipes:[],kills:0,deaths:0,nextBattle:[],pendingLv:0,shops:{}};
  // 시작 장비
  G.equip.weapon={id:cls==='mage'?'staff':cls==='rogue'?'dagger':'greatsword',lv:1,plus:0};
  G.equip.armor={id:cls==='mage'?'robe':'leather',lv:1,plus:0};
  P=G.p; const s=pStats(); P.hp=s.maxHp; P.mana=s.maxMana;
  save();
  setMain(`<div class="scroll"><span class="dim small">프롤로그</span><h2>들바람 마을</h2>
    <div class="ev-text"><p>빅토리아 왕국의 성이 그림자에 삼켜진 지 한 달. 왕도로 가는 길은 괴물로 막혔고, 사람들은 변두리 마을로 숨어들었다.</p>
    <p>당신은 들바람 마을의 여관에서 눈을 떴다. 창밖으로 바람 언덕이 보인다. 늑대 울음소리가 들린다.</p>
    <p class="dim small">맵을 고르고 → 지역으로 들어가 → <b>탐색</b>을 누르며 앞으로 나아가세요. 지역 끝에는 보스가 기다립니다.</p></div>
    <button class="btn primary" onclick="showPlace('deulbaram')">밖으로 나간다</button></div>`);
}

/* ---------- 월드맵 ---------- */
let WSEL=null;
function showWorld(sel){
  BUSY=false; G.loc.area=null; save(); renderTop();
  const R=reachable(); WSEL=sel||G.loc.map;
  const cx=m=>(MAPS[m].pos[0]+.5)/WORLD_COLS*100, cy=m=>(MAPS[m].pos[1]+.5)/WORLD_ROWS*100;
  const lines=[]; const done=new Set();
  for(const m in MAPS) for(const n of MAPS[m].links){ const k=[m,n].sort().join(); if(done.has(k)) continue; done.add(k);
    lines.push(`<line x1="${cx(m)}%" y1="${cy(m)}%" x2="${cx(n)}%" y2="${cy(n)}%" class="${R.has(m)&&R.has(n)?'open':''}"/>`); }
  const nodes=Object.entries(MAPS).map(([id,M])=>{ const open=R.has(id); const cls=['wnode',M.town?'town':'',M.scale===false?'late':'',M.tower?'tower':'',open?'':'locked',id===G.loc.map?'here':'',id===WSEL?'sel':''].join(' ');
    return `<div class="${cls}" role="button" tabindex="0" style="left:${cx(id)}%;top:${cy(id)}%" onclick="showWorld('${id}')"><span class="wi">${open?M.icon:'🔒'}</span>${M.name.replace(' ','<br>')}</div>`; }).join('');
  setMain(`<div class="scroll">
    <div class="row"><h2 class="grow">월드맵</h2><span class="dim small">현재: ${MAPS[G.loc.map].name}</span></div>
    <div class="world"><svg aria-hidden="true">${lines.join('')}</svg>${nodes}</div>
    <div class="legend"><span><i style="background:var(--town)"></i>마을</span><span><i style="background:var(--field)"></i>사냥터</span><span><i style="background:var(--late)"></i>다회차 지역</span><span><i style="background:#3a2e4a"></i>탑</span></div>
    ${worldInfo(WSEL,R)}
  </div>`);
}
function worldInfo(id,R){
  const M=MAPS[id]; const open=R.has(id); const here=id===G.loc.map;
  const late=M.scale===false?`<div class="l-warn small">⚠ 이 땅의 적은 회차가 올라도 약해지지 않습니다. ${M.pow>=4?'4회차':M.pow>=3?'3회차':'2회차'} 이상을 권장합니다.</div>`:'';
  const why=!open?`<div class="small faint">🔒 ${mapUnlockedReq(id)?'아직 이어진 길이 없습니다':'필요: '+mapReqText(id)}</div>`:'';
  return `<div class="winfo"><div class="row"><b class="grow" style="font-size:17px">${M.icon} ${M.name}</b><span class="num dim small">${mapRangeText(id)}</span></div>
    <div class="dim small">${M.desc}</div>${late}${why}
    ${open?`<button class="btn ${here?'':'primary'}" onclick="travel('${id}')">${here?'들어간다':'이동한다'}</button>`:''}</div>`;
}
function travel(id){ G.loc={map:id,area:null}; if(MAPS[id].town) G.lastTown=id; save(); showPlace(id); }

/* ---------- 맵 (마을/사냥터) ---------- */
const FAC={
  inn:{name:'여관',icon:'🛏',d:m=>`HP·마나 전부 회복 · ${innCost(m)}G`},
  shop:{name:'상점',icon:'🛒',d:()=>'장비·소모품 사고팔기'},
  alchemist:{name:'연금술사 이브',icon:'⚗',d:()=>'아이템 2개를 합성'},
  smith:{name:'대장장이',icon:'🔨',d:()=>'장비 강화 (실패하면 파괴)'},
  port:{name:'항구',icon:'⛴',d:()=>G.flags.ticket?'배표 보유':'바다로 가는 배표'},
  elder:{name:'마을 장로',icon:'🧓',d:()=>G.cleared['castle/throne']?'시간의 석판 — 다음 회차':'모험의 조언'},
  talk:{name:'마을 사람',icon:'💬',d:()=>'소문 듣기'},
};
const innCost=m=>5+townLv(m)*2;
function showPlace(id){
  BUSY=false; B=null; G.loc={map:id,area:null}; if(MAPS[id].town) G.lastTown=id; save(); renderTop();
  const M=MAPS[id];
  const areas=M.areas.map(a=>{ const key=areaKey(id,a.id); const open=areaOpen(key); const [lo,hi]=areaLv(key); const pr=G.explore[key]||0; const cl=G.cleared[key];
    const st=M.tower?`<span class="num">${G.tower.floor}층</span><br><span class="faint">최고 ${G.tower.best}층</span>`:cl?'<span class="l-good">✓ 보스 처치</span>':a.boss?`탐색 ${pr}%`:pr>=100?'<span class="l-good">✓ 탐색 완료</span>':`탐색 ${pr}%`;
    return `<button class="btn aitem" ${open?'':'disabled'} onclick="showArea('${key}')"><span class="ic">${open?a.icon:'🔒'}</span><div><b>${M.tower?'끝없는 탑':a.name}</b><div class="small dim num">Lv ${lo}~${hi}${a.boss&&!M.tower?` · 보스 ${MONSTERS[a.boss[0]].name}`:''}</div>${open?'':`<div class="small faint">이전 지역 보스를 쓰러뜨리면 열림</div>`}</div><span class="st">${st}</span></button>`; }).join('');
  const fac=(M.facilities||[]).map(f=>`<button class="btn" onclick="facility('${f}')"><b>${FAC[f].icon} ${FAC[f].name}</b><span class="small dim">${FAC[f].d(id)}</span></button>`).join('');
  setMain(`<div class="scroll">
    <div class="place-head"><span class="dim small">${M.town?'마을':M.tower?'탑':'사냥터'} · <span class="num">${mapRangeText(id)}</span></span><h2>${M.icon} ${M.name}</h2></div>
    <p class="flavor">${M.desc}</p>
    ${fac?`<div class="sec-t">시설</div><div class="fac">${fac}</div>`:''}
    ${areas?`<div class="sec-t">지역</div><div class="alist">${areas}</div>`:''}
    <button class="btn" onclick="showWorld()">🗺 월드맵</button>
  </div>`);
}
function facility(f){
  const m=G.loc.map;
  if(f==='inn'){ const c=innCost(m); if(G.gold<c){ toast('골드가 모자란다.'); return; } G.gold-=c; const s=pStats(); P.hp=s.maxHp; P.mana=s.maxMana; save(); renderTop(); toast(`푹 잤다. HP·마나 전부 회복 (-${c}G)`); return; }
  if(f==='shop') return showShop(true);
  if(f==='alchemist') return showAlchemist(true);
  if(f==='smith') return showSmith();
  if(f==='talk'){ const M=MAPS[m]; openModal(`<h2>💬 ${M.name} 사람들</h2><p class="flavor">${pick(M.talk)}</p><button class="btn" onclick="closeModal()">고개를 끄덕인다</button>`); return; }
  if(f==='port') return showPort();
  if(f==='elder') return showElder();
}
function showPort(){
  const cost=3000;
  openModal(`<h2>⛴ 남부두 항구</h2><p class="flavor">"바다로? 미쳤군. 거긴 용이 산다고. 그래도 가겠다면 배표는 ${cost}골드야."</p>
    <p class="small l-warn">바다의 적은 Lv 70 이상입니다. 회차를 여러 번 거친 뒤에 가는 걸 권합니다.</p>
    ${G.flags.ticket?'<p class="l-good">배표를 이미 갖고 있다. 월드맵에서 바다로 갈 수 있다.</p>':`<button class="btn primary" ${G.gold>=cost?'':'disabled'} onclick="buyTicket(${cost})">배표 산다 (${cost}G)</button>`}
    <button class="btn" onclick="closeModal()">닫기</button>`);
}
function buyTicket(c){ if(G.gold<c) return; G.gold-=c; G.flags.ticket=true; save(); renderTop(); closeModal(); toast('배표를 샀다. 월드맵에서 바다가 열렸다.'); }
function showElder(){
  const done=!!G.cleared['castle/throne'];
  const hint=!G.cleared['deulbaram/hill']?'"바람 언덕의 늑대 우두머리부터 처리해다오. 그래야 동쪽 숲 길이 안전해지지."'
    :!G.cleared['deulbaram/crypt']?'"지하묘지 바닥의 해골 왕이 깨어났네. 그놈을 눕히면 장미 마을로 가는 길이 열리지."'
    :!G.cleared['wizards/lab']?'"동쪽으로 숲과 버섯 숲을 지나면 마법사들의 마을이 있네. 대현자가 미쳤다더군."'
    :!G.cleared['castle/throne']?'"기사들, 광장, 시가지... 그리고 성. 녹턴을 멈춰다오."':'"자네는 해냈어. 하지만 그림자는 시간을 되감았지. 다시 시작하겠나?"';
  openModal(`<h2>🧓 들바람 마을 장로</h2><p class="flavor">${hint}</p>
    ${done?`<div class="winfo"><b>🪨 시간의 석판</b><div class="small dim">${G.cycle+1}회차를 시작합니다. 레벨·스탯·강화·장비·소모품·골드·레시피는 그대로, 세계(지역 진행·보스·배표)는 처음으로 돌아갑니다. 일반 지역의 적은 Lv +${CYCLE_LV} 강해지고, 회차 보너스로 공격·방어·마력·HP +5%를 얻습니다.</div>
      <button class="btn primary" onclick="nextCycle()">${G.cycle+1}회차 시작</button></div>`:''}
    <button class="btn" onclick="closeModal()">닫기</button>`);
}
function nextCycle(){ G.cycle++; G.cleared={}; G.explore={}; G.flags.ticket=false; G.shops={}; G.loc={map:'deulbaram',area:null}; G.lastTown='deulbaram'; const s=pStats(); P.hp=s.maxHp; P.mana=s.maxMana; save(); closeModal();
  setMain(`<div class="scroll"><span class="dim small">${G.cycle}회차</span><h2>시간이 되감겼다</h2><div class="ev-text"><p>눈을 뜨니 들바람 마을의 여관이다. 창밖으로 바람 언덕이 보인다. 늑대 울음소리가 들린다. 모든 것이 처음 그날과 같다.</p><p>하지만 손에 쥔 검의 무게는 기억하고 있다.</p></div><button class="btn primary" onclick="showPlace('deulbaram')">밖으로 나간다</button></div>`); renderTop(); }

/* ---------- 지역 탐색 ---------- */
let SCENE_X=0, XLOG=[];
function showArea(key,keepLog){
  BUSY=false; B=null; const A=areaDef(key), M=MAPS[A.map];
  if(G.loc.area!==key||!keepLog){ XLOG=[]; }
  G.loc={map:A.map,area:key}; save(); renderTop();
  const th=THEMES[A.theme]||THEMES.meadow;
  const rep=s=>Array(14).fill(s).join('');
  setMain(`<div class="scroll">
    <div class="place-head"><span class="dim small">${M.name} · <span class="num">Lv ${areaLv(key).join('~')}</span></span><h2>${A.icon} ${M.tower?`끝없는 탑 ${G.tower.floor}층`:A.name}</h2></div>
    <div class="scene" id="scene"><div class="sky" style="background:linear-gradient(180deg,${th.sky[0]},${th.sky[1]})"></div>
      <div class="far" id="far">${rep(th.far)}</div><div class="near" id="near">${rep(th.near)}</div>
      <div class="ground" style="background:${th.ground}"></div>
      <div class="hero" id="hero" style="background-image:url(${buildHero(G.cls)})"></div><div id="sceneFx"></div></div>
    <div class="bar pg" id="pgbar"></div>
    <div class="xlog" id="xlog"></div>
    <div id="areaBtns" class="row"></div>
  </div>`);
  setSceneX(); renderAreaUI(key);
}
function setSceneX(){ const f=$('#far'), n=$('#near'); if(f) f.style.transform=`translateX(${-SCENE_X*.4%600}px)`; if(n) n.style.transform=`translateX(${-SCENE_X%700}px)`; }
function xlog(html){ XLOG.push(html); if(XLOG.length>4) XLOG.shift(); const x=$('#xlog'); if(x) x.innerHTML=XLOG.map(h=>`<p>${h}</p>`).join(''); }
function renderAreaUI(key){
  if(!$('#areaBtns')) return;
  const A=areaDef(key), M=MAPS[A.map], pr=G.explore[key]||0, tower=M.tower;
  const pg=$('#pgbar'); if(pg) pg.innerHTML=`<i style="width:${pr}%"></i><span>${tower?`${G.tower.floor}층 탐색`:'탐색도'} ${pr}%${A.boss||tower?' · 100%에서 '+(tower?'층 수호자':'보스'):''}</span>`;
  const x=$('#xlog'); if(x) x.innerHTML=XLOG.length?XLOG.map(h=>`<p>${h}</p>`).join(''):`<p class="dim">${tower?'계단이 끝없이 이어진다.':'길이 앞으로 이어진다.'} 탐색을 눌러 나아가자.</p>`;
  const canBoss=(A.boss||tower)&&pr>=100;
  const bossName=tower?'층 수호자':MONSTERS[A.boss?A.boss[0]:'rat'].name;
  $('#areaBtns').innerHTML=`<button class="btn primary grow" onclick="explore('${key}')" ${BUSY?'disabled':''}>👣 탐색</button>
    ${canBoss?`<button class="btn danger grow" onclick="fightBoss('${key}')" ${BUSY?'disabled':''}>${G.cleared[key]&&!tower?'↻ ':''}⚔ ${bossName}</button>`:''}
    <button class="btn grow" onclick="showPlace('${A.map}')" ${BUSY?'disabled':''}>↩ ${M.name}</button>`;
}
async function explore(key){
  if(BUSY) return; if(!$('#scene')) showArea(key,true); BUSY=true; renderAreaUI(key); renderTop();
  const A=areaDef(key), M=MAPS[A.map], [lo,hi]=areaLv(key), L=Math.round((lo+hi)/2);
  const sc=$('#scene'); $('#sceneFx').innerHTML='';
  sc.classList.add('walking');
  const steps=10; for(let i=0;i<steps;i++){ SCENE_X+=14; setSceneX(); await sleep(90); }
  sc.classList.remove('walking');
  G.explore[key]=Math.min(100,(G.explore[key]||0)+ri(8,14));
  const r=Math.random()*100;
  const fx=$('#sceneFx');
  if(r<52){ // 몬스터
    const list=genEncounter(key);
    fx.innerHTML=`<div class="encounter"><span class="bang">!</span>${list.map(x=>monVisual(x.id)).join('')}</div>`;
    xlog(`<span class="l-warn">⚔ ${list.map(x=>MONSTERS[x.id].name).join(', ')}${josa(MONSTERS[list[list.length-1].id].name,'이/가')} 나타났다!</span>`);
    await sleep(800); save();
    startBattle(list,{pow:M.pow||1});
    return;
  }
  if(r<64){ const it=randomItem({lv:L}); fx.innerHTML=`<div class="find">✨</div>`; xlog(`✨ 바닥에서 ${gainItem(it)}을 주웠다.`); }
  else if(r<74){ const g=gainGold(ri(8,16),L); fx.innerHTML=`<div class="find">🪙</div>`; xlog(`🪙 흩어진 동전을 주웠다. <span class="l-gold">+${fmt(g)}G</span>`); }
  else if(r<79){ fx.innerHTML=`<div class="find">📦</div>`;
    if(chance(25)){ xlog('📦 상자에 이빨이 돋아났다!'); await sleep(700); save(); startBattle([{id:'mimic',lv:hi}],{pow:M.pow||1}); return; }
    const g=gainGold(ri(20,35),L); xlog(`📦 보물상자! <span class="l-gold">+${fmt(g)}G</span>, ${gainItem(randomItem({lv:L+1,gear:chance(60)}))}`); }
  else if(r<88){ save(); BUSY=false; showEvent(pick(EVENTS),key); return; }
  else if(r<92){ const h=heal(P,pStats().maxHp*.15); fx.innerHTML=`<div class="find">🌿</div>`; xlog(`🌿 약초를 씹었다. <span class="l-good">HP +${fmt(h)}</span>`); }
  else xlog(pick(['바람 소리만 들린다.','발자국이 있다. 누군가 먼저 지나갔다.','아무것도 없다. 조금 더 나아갔다.','어디선가 시선이 느껴진다...','길가에 낡은 표지판이 쓰러져 있다.']));

function fightBoss(key){
  const A=areaDef(key), M=MAPS[A.map];
  if(M.tower){ const pool=Object.keys(MONSTERS).filter(id=>MONSTERS[id].boss&&!['nocturne','leviathan','summerlord','turtle'].includes(id)); const [lo,hi]=areaLv(key);
    const bid=pick(pool);
    startBattle([{id:bid,lv:hi+1}],{boss:true,pow:1+.02*G.tower.floor,onWinLine:()=>{ G.tower.floor++; G.tower.best=Math.max(G.tower.best,G.tower.floor-1); G.explore[key]=0; return `<span class="l-crit">🗼 ${G.tower.floor}층으로 가는 계단이 열렸다!</span>`; }});
    return; }
  const [bid,blv]=A.boss; const lv=blv+cycleAdd(A.map);
  const first=!G.cleared[key];
  startBattle([{id:bid,lv}],{boss:true,pow:M.pow||1,onWinLine:()=>{ G.cleared[key]=true; return first?unlockLine(key):''; },
    after:first&&M.final&&A.id==='throne'?()=>showCycleClear():null});
}
function unlockLine(key){
  const opened=[];
  const M=MAPS[key.split('/')[0]]; const i=M.areas.findIndex(a=>areaKey(key.split('/')[0],a.id)===key); if(M.areas[i+1]) opened.push(`지역 「${M.areas[i+1].name}」`);
  for(const m in MAPS) if(MAPS[m].req===key) opened.push(`맵 「${MAPS[m].name}」`);
  return opened.length?`<span class="l-crit">🔓 ${opened.join(', ')}이 열렸다!</span>`:'';
}

  renderTop();
  const row=(x,i,kind)=>{ const p=price(x), sold=sh.sold.includes(kind+i); return `<button class="btn it" ${sold||G.gold<p?'disabled':''} onclick="buy('${kind}',${i})"><span class="ico">${ITEMS[idOf(x)].icon}</span><div>${itName(x)} <span class="small faint">${TYPE_NAME[ITEMS[idOf(x)].type]}</span><div class="d">${itemDesc(x)}</div></div><span class="gold">${sold?'판매됨':fmt(p)+'G'}</span></button>`; };
  setMain(`<div class="scroll"><span class="dim small">${MAPS[m].name} · 상점</span><h2>🛒 잡화점</h2><p class="flavor">"어서 와. 물건은 레벨이 오를 때마다 새로 들여놓지."</p>
    <div class="sec-t">소모품 (무제한)</div><div class="items">${sh.cons.map((id,i)=>row(id,i,'c')).join('')}</div>
    <div class="sec-t">장비</div><div class="items">${sh.gear.map((g,i)=>row(g,i,'g')).join('')}</div>
    <div class="row"><button class="btn grow" onclick="showSell()">물건 팔기</button><button class="btn primary grow" onclick="showPlace('${m}')">나간다</button></div></div>`);
}
function curShop(){ return G.shops[G.loc.map+'@'+G.lv]||Object.values(G.shops)[0]; }
function buy(kind,i){ const sh=curShop(); const x=kind==='c'?sh.cons[i]:sh.gear[i]; const p=price(x); if(G.gold<p||sh.sold.includes(kind+i)) return;
  if(kind==='c'&&G.cons.length>=pStats().consSlots){ toast('소모품 슬롯이 가득 찼다.'); return; }
  if(kind==='g'&&G.bag.length>=BAG_MAX){ toast('장비 가방이 가득 찼다.'); return; }
  G.gold-=p; if(kind==='g') sh.sold.push(kind+i); gainItem(kind==='g'?Object.assign({},x):x); toast(`${itName(x)} 구입`); save(); showShop(false); }
function showSell(){
  const list=[...G.bag.map((x,i)=>({x,i,w:'bag'})),...G.cons.map((x,i)=>({x,i,w:'cons'}))];
  openModal(`<div class="row"><h2 class="grow">물건 팔기</h2><button class="btn sm" onclick="closeModal();showShop(false)">닫기</button></div>
    <div class="items">${list.length?list.map(o=>`<button class="btn it" onclick="sell('${o.w}',${o.i})"><span class="ico">${ITEMS[idOf(o.x)].icon}</span><div>${itName(o.x)}<div class="d">${itemDesc(o.x)}</div></div><span class="gold">+${fmt(Math.ceil(price(o.x)/3))}G</span></button>`).join(''):'<div class="faint">팔 물건이 없다. 장착한 장비는 먼저 해제하세요.</div>'}</div>`);
}
function sell(w,i){ const arr=w==='bag'?G.bag:G.cons; const x=arr[i]; arr.splice(i,1); G.gold+=Math.ceil(price(x)/3); renderTop(); save(); showSell(); }

/* ---------- 대장장이 ---------- */
function showSmith(){
  renderTop();
  const list=[...SLOTS.filter(s=>G.equip[s]).map(s=>({x:G.equip[s],ref:'e:'+s})),...G.bag.map((x,i)=>({x,ref:'b:'+i}))];
  setMain(`<div class="scroll"><span class="dim small">${MAPS[G.loc.map].name} · 대장장이</span><h2>🔨 대장간</h2>
    <p class="flavor">"강화할수록 단단해지지. 근데 높이 올릴수록... 가끔 부서져. 원망은 하지 마."</p>
    <div class="items">${list.length?list.map(o=>{ const c=smithCost(o.x), f=smithFail(o.x); return `<button class="btn it" ${G.gold<c?'disabled':''} onclick="enhance('${o.ref}')"><span class="ico">${ITEMS[o.x.id].icon}</span><div>${itName(o.x)} ${o.ref[0]==='e'?'<span class="small faint">장착 중</span>':''}<div class="d">+${(o.x.plus||0)+1}로 강화 · 스탯 +8% · 파괴 확률 ${f}%</div></div><span class="gold">${fmt(c)}G</span></button>`; }).join(''):'<div class="faint">강화할 장비가 없다.</div>'}</div>
    <button class="btn" onclick="showPlace('${G.loc.map}')">나간다</button></div>`);
}
const smithCost=x=>Math.round(price(Object.assign({},x,{plus:0}))*.4*((x.plus||0)+1));
const smithFail=x=>Math.min(40,(x.plus||0)*4);
function enhance(ref){
  const [w,k]=ref.split(':'); const x=w==='e'?G.equip[k]:G.bag[+k]; const c=smithCost(x); if(G.gold<c) return; G.gold-=c;
  if(chance(smithFail(x))){ if(w==='e') G.equip[k]=null; else G.bag.splice(+k,1); clampPlayer(); save(); toast(`<span class="l-warn">쨍그랑! ${itName(x)}이 부서졌다...</span>`); }
  else { x.plus=(x.plus||0)+1; save(); toast(`<span class="l-good">${itName(x)} 강화 성공!</span>`); }
  showSmith();
}

/* ---------- 연금술사 ---------- */
function showAlchemist(fresh){
  if(fresh){ G.alch={sel:[]}; const unknown=RECIPES.filter(r=>!G.recipes.includes(r.a+'+'+r.b)); G.alch.hint=unknown.length?pick(unknown).hint:'자네는 이미 내 비법을 다 알아버렸군.'; }
  renderTop();
  const A=G.alch, cost=10+G.lv*2;
  const list=[...G.cons.map((id,i)=>({x:id,key:'c'+i})),...G.bag.map((g,i)=>({x:g,key:'b'+i}))];
  setMain(`<div class="scroll"><span class="dim small">${MAPS[G.loc.map].name} · 연금술사</span><h2>⚗ 수상한 연금술사 이브</h2><p class="flavor">"아무거나 두 개. 솥에 넣어봐. 무엇이 나올지는 나도 몰라."<br>…그리고 귓속말: "${A.hint}"</p>
    <div class="sec-t">재료 2개 선택</div>
    <div class="items">${list.length?list.map(o=>`<button class="btn it ${A.sel.includes(o.key)?'sel':''}" onclick="alchSel('${o.key}')"><span class="ico">${ITEMS[idOf(o.x)].icon}</span><div>${itName(o.x)}<div class="d">${ITEMS[idOf(o.x)].desc}</div></div><span>${A.sel.includes(o.key)?'✓':''}</span></button>`).join(''):'<div class="faint">넣을 재료가 없다.</div>'}</div>
    <button class="btn primary" ${A.sel.length===2&&G.gold>=cost?'':'disabled'} onclick="alchemize()">솥에 넣는다 (${fmt(cost)}G)</button>
    <div class="row"><button class="btn grow" onclick="showRecipes()">레시피 노트 ${G.recipes.length}/${RECIPES.length}</button><button class="btn grow" onclick="showPlace('${G.loc.map}')">나간다</button></div></div>`);
}
function alchSel(k){ const A=G.alch; const i=A.sel.indexOf(k); if(i>=0) A.sel.splice(i,1); else { if(A.sel.length>=2) A.sel.shift(); A.sel.push(k); } showAlchemist(false); }
function alchemize(){
  const A=G.alch, cost=10+G.lv*2; if(A.sel.length!==2||G.gold<cost) return;
  const get=k=>k[0]==='c'?G.cons[+k.slice(1)]:G.bag[+k.slice(1)];
  const xa=get(A.sel[0]), xb=get(A.sel[1]); const a=idOf(xa), b=idOf(xb);
  const glv=Math.max(isGear(xa)?xa.lv:0,isGear(xb)?xb.lv:0)||G.lv;
  for(const k of A.sel.filter(k=>k[0]==='c').sort((x,y)=>+y.slice(1)-+x.slice(1))) G.cons.splice(+k.slice(1),1);
  for(const k of A.sel.filter(k=>k[0]==='b').sort((x,y)=>+y.slice(1)-+x.slice(1))) G.bag.splice(+k.slice(1),1);
  G.gold-=cost; A.sel=[];
  const r=RECIPES.find(r=>(r.a===a&&r.b===b)||(r.a===b&&r.b===a));
  let out, msg;
  const mk=id=>ITEMS[id].type==='cons'?id:{id,lv:glv,plus:0};
  if(r){ out=mk(r.out); const key=r.a+'+'+r.b; const isNew=!G.recipes.includes(key); if(isNew) G.recipes.push(key); msg=isNew?'<b class="l-crit">✨ 새 레시피 발견!</b>':'알고 있던 레시피다.'; }
  else { const ta=ITEMS[a].type, tb=ITEMS[b].type;
    if(ta===tb&&chance(70)){ out=randomItem(ta==='cons'?{type:'cons'}:{type:ta,lv:glv}); msg='솥이 부글거리더니 비슷한 무언가가 나왔다.'; }
    else if(chance(35)){ out=randomItem({type:'cons'}); msg='엉뚱한 것이 나왔다.'; }
    else { out='junk'; msg='솥에서 시커먼 연기가... 실패작이다.'; } }
  const got=gainItem(out); save();
  openModal(`<h2>⚗ 연금 결과</h2><div>${itName(xa)} + ${itName(xb)}</div><div style="font-size:18px">→ ${got}</div><div>${msg}</div><div class="dim small">${ITEMS[idOf(out)].desc}</div><button class="btn primary" onclick="closeModal();showAlchemist(false)">확인</button>`);
}
function showRecipes(){
  openModal(`<div class="row"><h2 class="grow">레시피 노트</h2><button class="btn sm" onclick="closeModal()">닫기</button></div>
    <div class="items">${RECIPES.map(r=>{ const k=r.a+'+'+r.b; return G.recipes.includes(k)?`<div class="small">${itName(r.a)} + ${itName(r.b)} → ${itName(r.out)}</div>`:`<div class="small faint">??? + ??? → ???</div>`; }).join('')}</div>
    <div class="small dim">레시피에 없는 조합도 같은 종류끼리 섞으면 쓸만한 것이 나오기도 합니다. 장비로 만든 결과물은 재료 중 높은 레벨을 따릅니다.</div>`);
}

/* ---------- 시작 ---------- */
loadSettings();
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('#modal').classList.contains('open')&&!window._perkDone) closeModal(); });
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal'&&!window._perkDone) closeModal(); });
showTitle();
</script>
</body>
</html>
