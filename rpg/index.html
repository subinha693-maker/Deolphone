<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>심연의 계단</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* 레이아웃: 횃불에 비친 낡은 책장. 폰 세로 화면 한 장에 전투가 다 들어가는 1열 구조 */
:root{
  --bg:#15120e; --panel:#201b15; --panel2:#2a231b; --line:#3e3429; --ink:#ecdfc6; --dim:#a8977d; --faint:#6e6252;
  --brass:#d9a54c; --brass-ink:#1b150c; --blood:#d24b3d; --mana:#5b97de; --heal:#7cc46b; --poison:#9bc64f; --crit:#ffd54f; --shield:#a9c1d8;
  --r-common:#cfc4ae; --r-rare:#62acf2; --r-legend:#f2a92f; --r-cursed:#c65de2;
  --el-fire:#ec7440; --el-ice:#7fcbec; --el-lightning:#eed44a; --el-holy:#f5e7a6; --el-dark:#a78ddb;
  --f-display:'Nanum Myeongjo','Batang','AppleMyungjo',serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
#top{flex:none}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:16px;display:flex;flex-direction:column;gap:12px}
.scroll>*,.title-wrap>*{flex-shrink:0}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.small{font-size:12px}

/* 버튼 */
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:10px 12px;cursor:pointer;text-align:center;min-height:44px;transition:transform .08s,border-color .15s,background .15s}
.btn:hover{border-color:var(--brass)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.tgt:focus-visible,.card:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn[disabled]{opacity:.38;cursor:not-allowed;transform:none}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--blood);color:var(--blood)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}

/* 상단 상태 */
.topbar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:6px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.tb-name{font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.tb-name .cls{font-family:var(--f-display);font-size:16px}
.tb-right{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.gold{color:var(--brass);font-family:var(--f-mono);font-weight:700}
.bars{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 70px;gap:6px}
.bar{position:relative;height:16px;background:#0e0c09;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--blood);transition:width .35s ease}
.bar.mp>i{background:var(--mana)} .bar.xp>i{background:var(--brass)} .bar.sh>i{background:var(--shield)}
.bar>span{position:relative;display:block;text-align:center;font-family:var(--f-mono);font-size:11px;line-height:14px;font-weight:700;text-shadow:0 1px 2px #000}

/* 제목 화면 */
.title-wrap{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.logo{font-family:var(--f-display);font-size:clamp(38px,11vw,54px);line-height:1;color:var(--brass);letter-spacing:-.03em}
.logo small{display:block;font-size:14px;color:var(--dim);letter-spacing:.24em;margin-top:8px;font-family:var(--f-body)}
.meta-box{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:12px;display:grid;gap:8px}
.kv{display:flex;justify-content:space-between;gap:10px}

/* 카드 */
.card{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer}
.card:hover{border-color:var(--brass)}
.card h3{font-size:18px;display:flex;gap:8px;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;text-align:center;font-size:11px}
.statgrid b{display:block;font-family:var(--f-mono);font-size:14px;color:var(--ink)}
.statgrid span{color:var(--dim)}
.skill-line{font-size:12px;color:var(--dim)} .skill-line b{color:var(--ink);font-weight:500}

/* 지도 */
.floor-head{display:flex;flex-direction:column;gap:6px}
.floor-head h2{font-size:22px}
.path{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.path i{width:16px;height:6px;border-radius:2px;background:var(--line)}
.path i.done{background:var(--brass)} .path i.now{background:var(--ink);box-shadow:0 0 0 2px var(--brass)}
.path em{font-style:normal;font-size:14px;margin-left:2px}
.flavor{font-family:var(--f-display);color:var(--dim);font-size:15px;border-left:2px solid var(--line);padding-left:10px}
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:14px}
.choice .ic{font-size:28px;text-align:center;width:48px;height:48px;line-height:48px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
.choice h3{font-size:17px}
.choice.boss{border-color:var(--blood)} .choice.boss .ic{border-color:var(--blood)}
.choice.n-elite .ic{border-color:var(--r-cursed)}

/* 전투 */
.battle{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.enemies{display:grid;gap:6px;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.ecard{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;transition:opacity .4s,border-color .15s}
.ecard.boss{border-color:#6d2a22;background:linear-gradient(180deg,#2a1713,var(--panel))}
.ecard.elite{border-color:#5b3070}
.ecard.acting{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.ecard.tgt{border-color:var(--crit);animation:pulse 1s infinite}
.ecard.dead{opacity:.28;pointer-events:none}
.e-top{display:flex;gap:4px;align-items:center;min-width:0}
.e-icon{font-size:22px;line-height:1}
.e-name{font-weight:700;font-size:12px;line-height:1.2;overflow-wrap:anywhere}
.badges{display:flex;gap:3px;flex-wrap:wrap}
.badge{font-size:10px;padding:0 4px;border-radius:3px;border:1px solid var(--line);color:var(--dim);line-height:16px}
.intent{font-size:11px;line-height:1.3;padding:3px 5px;border-radius:4px;background:#0e0c09;border:1px dashed var(--line);color:var(--ink)}
.intent.heavy{border-color:var(--blood);color:#ffb3a8;animation:warn 1.2s infinite}
.intent .num{color:var(--crit)}
.intent.next{opacity:.6}
.chips{display:flex;gap:3px;flex-wrap:wrap;min-height:0}
.chip{font-size:11px;line-height:16px;padding:0 4px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip.bad{border-color:#6d3530} .chip.good{border-color:#3d5a6e}
.initbar{display:flex;gap:4px;overflow-x:auto;font-size:11px;align-items:center;scrollbar-width:none;min-height:26px}
.initbar::-webkit-scrollbar{display:none}
.ini{white-space:nowrap;padding:2px 6px;border-radius:4px;background:var(--panel);border:1px solid var(--line)}
.ini.me{border-color:var(--brass)}
.ini.extra{color:var(--crit)}
.ini b{font-family:var(--f-mono)}
.ini.now{background:var(--panel2);box-shadow:0 0 0 1px var(--ink)}
.blog{flex:1;min-height:90px;overflow-y:auto;background:#0f0d0a;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;line-height:1.45}
.blog p{margin:0 0 2px;animation:fadein .25s}
.blog .rd{color:var(--faint);font-size:11px;margin-top:4px;border-top:1px dashed var(--line);padding-top:2px}
.n-p{color:var(--brass)} .n-e{color:#e7b59a}
.l-dmg{color:var(--blood);font-weight:700;font-family:var(--f-mono)} .l-heal{color:var(--heal);font-weight:700;font-family:var(--f-mono)}
.l-crit{color:var(--crit);font-weight:700} .l-miss{color:var(--faint)} .l-st{color:#c9a6e8} .l-sys{color:var(--dim)} .l-warn{color:#ffb3a8}
.l-good{color:var(--heal)} .l-gold{color:var(--brass)}
.el-fire{color:var(--el-fire)} .el-ice{color:var(--el-ice)} .el-lightning{color:var(--el-lightning)} .el-holy{color:var(--el-holy)} .el-dark{color:var(--el-dark)}
.pcard{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;display:grid;gap:4px;cursor:pointer}
.pcard.acting{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.p-row{display:flex;gap:6px;align-items:center}
.p-row .bar{flex:1}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;min-height:100px;align-content:start}
.actions .btn{padding:8px 4px;font-size:14px}
.actions .wide{grid-column:1/-1}
.actions .note{grid-column:1/-1;text-align:center;color:var(--dim);font-size:12px;padding:4px}
.actlist{grid-column:1/-1;display:grid;gap:6px;max-height:34vh;overflow-y:auto}
.act-item{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;padding:8px 10px}
.act-item .d{grid-column:1/-1;font-size:11px;color:var(--dim)}
.reward{grid-column:1/-1;border:1px solid var(--brass);background:var(--panel);border-radius:6px;padding:12px;display:grid;gap:6px}
.reward h3{color:var(--brass);font-size:20px}

/* 효과 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,0);font-family:var(--f-mono);font-weight:700;font-size:20px;text-shadow:0 2px 0 #000,0 0 6px #000;animation:pop .95s ease-out forwards;white-space:nowrap}
.pop.dmg{color:#ff6b5b} .pop.crit{color:var(--crit);font-size:28px} .pop.heal{color:var(--heal)} .pop.miss{color:#bbb;font-size:15px} .pop.st{color:#d4b2f0;font-size:13px} .pop.shield{color:var(--shield);font-size:16px} .pop.mana{color:var(--mana);font-size:16px}
.shake{animation:shake .35s}
.flash::after{content:"";position:absolute;inset:0;border-radius:6px;background:#ff3b2b;opacity:0;animation:flash .35s;pointer-events:none}
.pcard{position:relative}
@keyframes pop{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}15%{opacity:1;transform:translate(-50%,-6px) scale(1.25)}35%{transform:translate(-50%,-14px) scale(1)}100%{opacity:0;transform:translate(-50%,-56px) scale(.95)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes flash{0%{opacity:.45}100%{opacity:0}}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--crit)}}
@keyframes warn{50%{background:#2a1210}}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
#main.screen-shake{animation:shake .4s}
@media (prefers-reduced-motion:reduce){.shake,#main.screen-shake,.ecard.tgt,.intent.heavy{animation:none}.pop{animation-duration:.6s}}

/* 모달 */
#modal{position:fixed;inset:0;z-index:40;display:none;background:rgba(8,6,4,.78);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));align-items:center;justify-content:center}
#modal.open{display:flex}
.mbox{width:100%;max-width:520px;max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--brass);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:fadein .2s}
.mbox h2{font-size:20px}
.sec-t{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-top:4px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{border:1px dashed var(--line);border-radius:6px;padding:8px;min-height:52px;cursor:pointer;text-align:left;background:transparent;display:flex;flex-direction:column}
.slot .lab{font-size:10px;color:var(--faint)}
.items{display:grid;gap:6px}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 10px;text-align:left}
.it .ico{font-size:20px}
.it .d{font-size:11px;color:var(--dim)}
.rar-common{color:var(--r-common)} .rar-rare{color:var(--r-rare)} .rar-legend{color:var(--r-legend)} .rar-cursed{color:var(--r-cursed)}
.it.sel{border-color:var(--crit);background:#2f2716}
.perks{display:grid;gap:8px}
.perk{padding:14px}
.perk h3{font-size:17px}
.statline{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px}
.statline div{background:var(--panel2);border-radius:4px;padding:4px 6px}
.statline b{font-family:var(--f-mono);float:right}
.roll{display:inline-block;font-family:var(--f-mono);font-size:12px;background:#0e0c09;border:1px solid var(--line);border-radius:4px;padding:2px 6px;margin:2px 0}
.ev-text{font-size:15px;line-height:1.7}
.ev-text p{margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--brass);border-radius:6px;padding:8px 14px;z-index:60;max-width:90vw;animation:fadein .2s;font-size:13px}
</style>
</head>
<body>
<div id="app"><header id="top"></header><main id="main"></main></div>
<div id="modal"></div>
<div id="fx"></div>
<script>
'use strict';
/* =====================================================================
   데이터 영역 — 여기만 늘리면 콘텐츠가 늘어납니다.
   - stats: 숫자는 더해짐(hitMult/skillCostMul/goldMul/dmgTakenMul도 덧셈), immune/vsTag/flags는 합쳐짐
   - late(s): 모든 계산 후 조건부 보정 (예: HP 50% 이하일 때)
   ===================================================================== */
const RARITY = {
  common:{name:'일반', w:60, gear:40},
  rare:{name:'희귀', w:28, gear:90},
  legend:{name:'전설', w:5, gear:190},
  cursed:{name:'저주', w:7, gear:65},
};
const ELEMENTS = {
  fire:{name:'불', icon:'🔥'}, ice:{name:'얼음', icon:'❄'}, lightning:{name:'번개', icon:'⚡'},
  holy:{name:'신성', icon:'✦'}, dark:{name:'암흑', icon:'☾'},
};
// 공격 속성 → 유리한 대상 속성 (불→얼음→번개→불, 신성↔암흑)
const ELEMENT_BEATS = { fire:'ice', ice:'lightning', lightning:'fire', holy:'dark', dark:'holy' };
const STAT_NAME = {atk:'공격력', def:'방어력', agi:'민첩', mag:'마력', maxHp:'최대 HP', maxMana:'최대 마나', crit:'치명타%', evade:'회피%'};

const STATUSES = {
  // tick: 'end' = 걸린 쪽의 턴이 끝날 때 1 감소 / 'start' = 걸린 쪽의 턴이 시작될 때 1 감소 / 'none' = 전투 내내
  poison:{name:'중독',icon:'☠',bad:true,tick:'end',desc:'턴마다 최대 HP 5% 피해'},
  toxic:{name:'맹독',icon:'🧪',bad:true,tick:'end',desc:'턴마다 피해가 3씩 커짐'},
  bleed:{name:'출혈',icon:'🩸',bad:true,tick:'end',desc:'중첩당 턴마다 2 피해 (최대 10중첩)'},
  burn:{name:'화상',icon:'🔥',bad:true,tick:'end',desc:'턴마다 최대 HP 6% 피해, 방어력 -2'},
  stun:{name:'기절',icon:'💫',bad:true,tick:'end',desc:'다음 행동 불가'},
  sleep:{name:'수면',icon:'💤',bad:true,tick:'end',desc:'행동 불가, 피해를 받으면 깨어남'},
  slow:{name:'둔화',icon:'🐌',bad:true,tick:'end',desc:'민첩 -40%'},
  silence:{name:'침묵',icon:'🤐',bad:true,tick:'end',desc:'스킬 사용 불가'},
  weak:{name:'약화',icon:'🥀',bad:true,tick:'end',desc:'주는 피해 -30%'},
  noheal:{name:'광휘',icon:'🍄',bad:true,tick:'end',desc:'HP 회복 불가'},
  frenzy:{name:'발광',icon:'🍷',tick:'start',desc:'공격력 +40%, 민첩 +30%, 받는 피해 +25%'},
  stealth:{name:'은신',icon:'👤',tick:'start',desc:'공격을 모두 피함, 다음 공격 치명타 확정'},
  smoke:{name:'연막',icon:'🌫',tick:'start',desc:'회피 100%'},
  guard:{name:'방어 태세',icon:'🛡',tick:'start',desc:'방어력 증가'},
  defend:{name:'방어',icon:'🛡',tick:'start',desc:'받는 피해 50% 감소'},
  barrier:{name:'마나 방벽',icon:'🔷',tick:'start',desc:'받는 피해를 마나로 흡수 (마나 1 = 피해 2)'},
  venom:{name:'독 바르기',icon:'🐍',tick:'start',desc:'공격 시 3턴 중독 부여'},
  mirror:{name:'거울',icon:'🪞',tick:'none',desc:'다음에 받는 적 스킬 1회 반사'},
  imbue:{name:'속성 부여',icon:'✨',tick:'none',desc:'공격에 속성 추가'},
  enrage:{name:'분노',icon:'😡',tick:'none',desc:'공격력 +50%'},
};

const SKILLS = {
  bash:{name:'강타',cost:6,target:'one',desc:'공격력 160% 피해, 40% 확률 기절',
    run(t,s){ const r=strike(P,t,s.atk*1.6,{type:'phys'}); if(r.hit&&t.hp>0&&chance(40)) addStatus(t,'stun',1); }},
  taunt:{name:'도발',cost:5,target:'self',desc:'2턴 동안 방어력 +8, 마나 +3',
    run(){ addStatus(P,'guard',2,{pow:8}); gainMana(3); log(`${nm(P,'이/가')} 방패를 두드리며 적을 도발한다!`); }},
  rage:{name:'분노 폭발',cost:10,cd:2,target:'one',desc:'공격력 80% + 잃은 HP의 40% 피해 (쿨타임 2)',
    run(t,s){ strike(P,t,s.atk*0.8+(s.maxHp-P.hp)*0.4,{type:'phys'}); }},
  fireball:{name:'파이어볼',cost:9,target:'one',desc:'마력 200% 불 피해, 60% 확률 화상 3턴',
    run(t,s){ const r=strike(P,t,s.mag*2,{type:'magic',element:'fire'}); if(r.hit&&t.hp>0&&chance(60)) addStatus(t,'burn',3); }},

const ri=(a,b)=>Math.floor(rand(a,b+1));
const chance=p=>Math.random()*100<p;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const d10=()=>ri(1,10);
function wpick(arr,wf){ const tot=arr.reduce((s,x)=>s+wf(x),0); let r=Math.random()*tot; for(const x of arr){ r-=wf(x); if(r<=0) return x; } return arr[arr.length-1]; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const sleep=ms=>new Promise(r=>setTimeout(r, ms*(META&&META.fast?.45:1)));
function josa(w,pair){ if(!pair.includes('/')) return pair; const [a,b]=pair.split('/'); const ch=w.charCodeAt(w.length-1); if(ch<0xAC00||ch>0xD7A3) return b; const jong=(ch-0xAC00)%28; if(pair==='으로/로') return (jong&&jong!==8)?a:b; return jong?a:b; }
const nm=(c,j)=>`<b class="${c.isPlayer?'n-p':'n-e'}">${c.name}</b>${j?josa(c.name,j):''}`;
const elTag=el=>el?`<span class="el-${el}">${ELEMENTS[el].icon}${ELEMENTS[el].name}</span>`:'';
const itName=id=>{ const it=ITEMS[id]; return `<b class="rar-${it.rarity}">${it.icon} ${it.name}</b>`; };

function defaultMeta(){ return {level:1,exp:0,runs:0,best:0,kills:0,recipes:[],fast:false}; }
function loadMeta(){ try{ return Object.assign(defaultMeta(), JSON.parse(localStorage.getItem(KEY_META))||{}); }catch(e){ return defaultMeta(); } }
function saveMeta(){ try{ localStorage.setItem(KEY_META,JSON.stringify(META)); }catch(e){} }
function saveRun(){ try{ if(RUN) localStorage.setItem(KEY_RUN,JSON.stringify(RUN)); else localStorage.removeItem(KEY_RUN); }catch(e){} }
function loadRun(){ try{ return JSON.parse(localStorage.getItem(KEY_RUN)); }catch(e){ return null; } }
const expNeed=lv=>20+(lv-1)*12;
const floorDef=()=>FLOORS[Math.min(RUN.floor,FLOORS.length)-1];
const floorScale=()=>1+0.5*(RUN.floor-1);

/* ---------- 스탯 ---------- */
function baseS(){ return {atk:0,def:0,agi:0,mag:0,maxHp:0,maxMana:0,crit:5,critDmg:1.6,evade:0,lifesteal:0,manaRegen:2,diceBonus:0,diceMin:1,hits:1,hitMult:1,armorPen:0,stunChance:0,poisonOnHit:0,burnOnHit:0,bleedOnHit:0,thorns:0,skillCostMul:1,skillRefund:0,goldMul:1,expMul:1,dmgTakenMul:1,dmgMul:1,selfDmg:0,startShield:0,phoenix:0,healMul:1,consSlots:4,postHeal:0,riposte:0,firstDice:0,spellblade:0,elemBonus:0,dropBonus:0,immune:{},vsTag:{},flags:{},element:null}; }
function addStats(s,add,n=1){ for(const k in add){ if(k==='immune'||k==='vsTag'||k==='flags') Object.assign(s[k],add[k]); else s[k]=(s[k]||0)+add[k]*n; } }
function statusMods(c,s){ const st=c.st;
  if(st.slow) s.agi*=.6;
  if(st.frenzy){ s.atk*=1.4; s.agi*=1.3; s.dmgTakenMul*=1.25; }
  if(st.guard) s.def+=st.guard.pow||6;
  if(st.burn) s.def-=2;
  if(st.weak) s.dmgMul*=.7;
  if(st.defend) s.dmgTakenMul*=.5;
  if(st.enrage) s.atk*=1.5;
}
function pStats(){
  const c=CLASSES[RUN.cls], s=baseS(), late=[];
  addStats(s,c.base);
  const L=META.level-1; for(const k in c.growth) s[k]+=Math.floor(L*c.growth[k]);
  s.maxHp+=L*2; s.maxMana+=L;
  addStats(s,RUN.bonus);
  if(c.passive.stats) addStats(s,c.passive.stats); if(c.passive.late) late.push(c.passive.late);
  for(const id in RUN.perks){ const pk=PERKS[id]; if(pk.stats) addStats(s,pk.stats,RUN.perks[id]); if(pk.late) late.push(pk.late); }
  for(const sl of SLOTS){ const id=RUN.equip[sl]; if(!id) continue; const it=ITEMS[id]; if(it.stats) addStats(s,it.stats); if(it.late) late.push(it.late); if(it.element) s.element=it.element; }
  if(B){ if(B.giant){ s.maxHp*=1.5; s.agi*=.7; } if(B.berserk) s.atk+=Math.max(0,(s.maxHp-P.hp))/8; }
  statusMods(P,s);
  for(const f of late) f(s);
  for(const k of ['atk','def','agi','mag','maxHp','maxMana']) s[k]=Math.max(0,Math.round(s[k]));
  s.maxHp=Math.max(1,s.maxHp); s.skillCostMul=Math.max(.2,s.skillCostMul); s.dmgTakenMul=Math.max(.2,s.dmgTakenMul);
  return s;
}
function eStats(e){ const s={atk:e.atk,def:e.def,agi:e.agi,mag:e.mag,crit:5,critDmg:1.5,evade:e.evade||0,dmgMul:1,dmgTakenMul:1,maxHp:e.maxHp,armorPen:0,flags:{},immune:e.immune||{}}; statusMods(e,s); return s; }
const stats=c=>c.isPlayer?pStats():eStats(c);
const maxHpOf=c=>c.isPlayer?pStats().maxHp:c.maxHp;
const alive=()=>B?B.enemies.filter(e=>e.hp>0):[];
function elementMult(a,d){ if(!a||!d) return 1; if(ELEMENT_BEATS[a]===d) return 1.5; if(a===d||ELEMENT_BEATS[d]===a) return .7; return 1; }

/* ---------- 효과 표시 ---------- */
function cardOf(c){ return document.getElementById('cb-'+c.uid); }
function popup(c,text,cls){ const el=cardOf(c); if(!el) return; const r=el.getBoundingClientRect(); const d=document.createElement('div'); d.className='pop '+cls; d.textContent=text;
  d.style.left=(r.left+r.width/2+rand(-14,14))+'px'; d.style.top=(r.top+r.height*.28)+'px'; $('#fx').appendChild(d); setTimeout(()=>d.remove(),1000); }
function shake(c){ const el=cardOf(c); if(!el) return; el.classList.remove('shake','flash'); void el.offsetWidth; el.classList.add('shake','flash'); }
function shakeScreen(){ const m=$('#main'); m.classList.remove('screen-shake'); void m.offsetWidth; m.classList.add('screen-shake'); }
function log(html){ if(!B) return; B.log.push(html); const bl=$('#blog'); if(bl){ const p=document.createElement('p'); p.innerHTML=html; bl.appendChild(p); while(bl.children.length>80) bl.firstChild.remove(); bl.scrollTop=bl.scrollHeight; } }
function logRound(html){ if(!B) return; const bl=$('#blog'); if(bl){ const p=document.createElement('p'); p.className='rd'; p.innerHTML=html; bl.appendChild(p); bl.scrollTop=bl.scrollHeight; } }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function toastIfField(msg){ if(!B) toast(msg); }

/* ---------- 상태이상 ---------- */
function addStatus(c,id,turns,data={}){
  if(c.hp<=0) return false;
  const def=STATUSES[id];
  const imm=c.isPlayer?pStats().immune:(c.immune||{});
  if(imm[id]){ popup(c,'면역','miss'); log(`<span class="l-sys">${nm(c,'은/는')} ${def.name}에 면역이다.</span>`); return false; }
  if(!c.isPlayer&&c.resist&&c.resist[id]&&chance(c.resist[id])){ popup(c,'저항','miss'); log(`<span class="l-sys">${nm(c,'이/가')} ${def.name}에 저항했다.</span>`); return false; }
  const cur=c.st[id];
  if(id==='bleed') c.st[id]={t:Math.max(turns,cur?cur.t:0),stack:Math.min(10,(cur?cur.stack:0)+(data.stack||1))};
  else if(id==='toxic') c.st[id]={t:Math.max(turns,cur?cur.t:0),n:cur?cur.n:1};
  else c.st[id]=Object.assign({},cur||{},data,{t:Math.max(turns,cur?cur.t:0)});
  if(B&&B.cur===c) c.st[id].fresh=true;
  if(B){ popup(c,def.icon+def.name,'st'); log(`<span class="l-st">${nm(c,'이/가')} ${def.icon}${def.name}${id==='bleed'?` (${c.st[id].stack}중첩)`:''} 상태가 되었다.</span>`); }
  return true;
}
function cleanse(c){ for(const id in c.st) if(STATUSES[id].bad) delete c.st[id]; }
function tickStart(c){
  for(const id of Object.keys(c.st)){ const st=c.st[id]; if(STATUSES[id].tick==='start'){ st.t--; if(st.t<=0) delete c.st[id]; } }
  const mx=maxHpOf(c);
  const dot=(id,dmg,txt)=>{ if(!c.st[id]||c.hp<=0) return; dmg=Math.max(1,Math.round(dmg)); applyDamage(c,dmg,{dot:true}); log(`${nm(c,'이/가')} ${txt} <span class="l-dmg">${dmg}</span> 피해`); };
  dot('poison',Math.max(2,mx*.05),'☠독으로');
  if(c.st.toxic){ dot('toxic',3*c.st.toxic.n*Math.sqrt(floorScale()),'🧪맹독으로'); if(c.st.toxic) c.st.toxic.n++; }
  if(c.st.bleed) dot('bleed',2*c.st.bleed.stack,'🩸출혈로');
  dot('burn',Math.max(3,mx*.06),'🔥화상으로');
}
function tickEnd(c){ for(const id of Object.keys(c.st)){ const st=c.st[id]; if(STATUSES[id].tick!=='end') continue; if(st.fresh){ st.fresh=false; continue; } st.t--; if(st.t<=0) delete c.st[id]; } }

/* ---------- 피해 / 회복 ---------- */
function applyDamage(t,dmg,o={}){
  let d=dmg;
  if(t.isPlayer&&B){
    if(B.shield>0){ const a=Math.min(B.shield,d); B.shield-=a; d-=a; if(a) popup(t,'🛡'+a,'shield'); }
    if(d>0&&t.st.barrier&&P.mana>0){ const ab=Math.min(d,P.mana*2); P.mana-=Math.ceil(ab/2); d-=ab; if(ab) popup(t,'🔷'+ab,'mana'); }
  }
  t.hp=Math.max(0,t.hp-d);
  if(d>0&&t.st.sleep&&!o.dot){ delete t.st.sleep; log(`<span class="l-sys">${nm(t,'이/가')} 깨어났다!</span>`); }
  if(d>0){ popup(t,(o.crit?'💥':'')+d,o.crit?'crit':'dmg'); shake(t); }
  if(t.hp<=0) onDeath(t);
  return d;
}
function heal(c,amt){
  if(c.st&&c.st.noheal){ if(B){ popup(c,'회복 불가','miss'); log(`<span class="l-sys">${nm(c,'은/는')} 광휘 때문에 회복하지 못한다.</span>`); } return 0; }
  if(c.isPlayer) amt*=pStats().healMul;
  const h=Math.max(0,Math.min(maxHpOf(c)-c.hp,Math.round(amt))); c.hp+=h; if(h>0&&B) popup(c,'+'+h,'heal'); return h;
}
function healMsg(c,amt){ const h=heal(c,amt); if(B) log(`${nm(c,'이/가')} <span class="l-heal">${h}</span> 회복했다.`); else toast(`HP <b class="l-good">+${h}</b>`); }
function healField(n){ heal(P,n); }
function gainMana(n,msg){ const mx=pStats().maxMana; const g=Math.max(0,Math.min(mx-P.mana,Math.round(n))); P.mana+=g; if(msg){ if(B){ popup(P,'+'+g+' MP','mana'); log(`${nm(P,'이/가')} 마나를 <span class="l-heal">${g}</span> 회복했다.`); } else toast(`마나 <b class="l-good">+${g}</b>`); } return g; }
function imbue(el){ addStatus(P,'imbue',99,{el}); log(`무기에 ${elTag(el)} 기운이 깃든다.`); }

function strike(src,tgt,raw,o={}){
  if(!B||tgt.hp<=0||src.hp<=0) return {hit:false};
  const S=stats(src), T=stats(tgt), type=o.type||'phys';
  // 회피
  if(!o.noEvade){
    if(tgt.st.stealth||tgt.st.smoke){ popup(tgt,'회피','miss'); log(`<span class="l-miss">${nm(tgt,'이/가')} 그림자 속에서 공격을 흘려보냈다.</span>`); return {hit:false,miss:true}; }
    let ev=clamp(4+(T.agi-S.agi)*1.5+(T.evade||0),0,60);
    if(tgt.st.sleep||tgt.st.stun) ev=0;
    if(chance(ev)){ popup(tgt,'MISS','miss'); log(`<span class="l-miss">${nm(src,'의')} 공격이 빗나갔다. (회피 ${Math.round(ev)}%)</span>`); return {hit:false,miss:true}; }
  }
  let dmg=raw*rand(.9,1.1), tags=[];
  const el=o.element||null;
  if(el){
    if(tgt.isPlayer&&el==='fire'&&T.flags.fireImmune){ popup(tgt,'불 무효','miss'); log(`<span class="l-sys">용비늘이 불길을 막아냈다.</span>`); return {hit:false}; }
    let em=elementMult(el,tgt.element);
    if(em>1&&src.isPlayer&&S.elemBonus) em+=S.elemBonus;
    if(em>1) tags.push(`<span class="l-crit">상성!</span>`); else if(em<1) tags.push('<span class="l-miss">저항</span>');
    dmg*=em;
  }
  if(src.isPlayer&&S.vsTag&&tgt.tags) for(const tg of tgt.tags) if(S.vsTag[tg]){ dmg*=S.vsTag[tg]; tags.push('<span class="l-crit">특효!</span>'); }
  let crit=false;
  if(type!=='true'){ const cc=(o.forceCrit||src.st.stealth)?100:S.crit+S.agi*.5; crit=chance(cc); if(crit){ dmg*=S.critDmg; tags.unshift('<span class="l-crit">치명타!</span>'); } }
  if(type!=='true'){ let def=T.def; const pen=(o.armorPen||0)+(src.isPlayer&&type==='phys'?S.armorPen:0); def*=1-Math.min(1,pen); if(type==='magic') def*=.5; dmg*=20/(20+Math.max(0,def)); }
  dmg*=S.dmgMul*T.dmgTakenMul;
  dmg=Math.max(1,Math.round(dmg));
  const dealt=applyDamage(tgt,dmg,{crit});
  log(`${o.label?o.label+' ':''}→ ${nm(tgt)}에게 ${el?elTag(el)+' ':''}<span class="l-dmg">${dmg}</span> 피해 ${tags.join(' ')}`);
  // 흡혈
  const ls=(src.isPlayer?S.lifesteal:0)+(o.lifesteal||0);
  if(ls>0&&dealt>0&&src.hp>0){ const h=heal(src,dealt*ls); if(h) log(`${nm(src,'이/가')} 피를 빨아 <span class="l-heal">${h}</span> 회복`); }
  // 내 공격의 부가 효과
  if(src.isPlayer&&!o.noProc&&tgt.hp>0){
    if(S.poisonOnHit&&chance(S.poisonOnHit)) addStatus(tgt,'poison',3);
    if(P.st.venom) addStatus(tgt,'poison',3);
    if(S.burnOnHit&&chance(S.burnOnHit)) addStatus(tgt,'burn',2);
    if(S.bleedOnHit&&chance(S.bleedOnHit)) addStatus(tgt,'bleed',3,{stack:1});
    if(S.stunChance&&chance(S.stunChance)) addStatus(tgt,'stun',1);
  }
  // 맞은 쪽(나)의 반응
  if(tgt.isPlayer&&src.hp>0&&!o.noProc){
    if(type==='phys'&&T.thorns&&dealt>0){ const th=Math.max(1,Math.round(dmg*T.thorns)); applyDamage(src,th); log(`🌵가시가 ${nm(src)}에게 <span class="l-dmg">${th}</span> 반사`); }
    if(T.flags.chillOnHit&&src.hp>0&&chance(50)) addStatus(src,'slow',2);
    if(tgt.st.defend&&T.riposte&&src.hp>0&&tgt.hp>0) strike(P,src,T.atk*T.riposte,{type:'phys',noProc:true,noEvade:true,label:'↩반격!'});
  }
  return {hit:true,dmg:dealt,crit};
}

function onDeath(c){
  if(c.isPlayer){
    const s=pStats();
    if(s.phoenix&&!B.phoenixUsed){ B.phoenixUsed=true; c.hp=Math.round(s.maxHp*.4); popup(c,'🔥부활','heal'); log(`<span class="l-crit">불사조 깃털이 타오르며 다시 일어섰다!</span>`); return; }
    const ci=RUN.cons.indexOf('coin');
    if(ci>=0){ RUN.cons.splice(ci,1); c.hp=1; popup(c,'🪙부활','heal'); log(`<span class="l-crit">망자의 동전이 바스러지며 숨이 돌아온다! (HP 1)</span>`); cleanse(c); return; }
    return;
  }
  log(`<span class="l-good">✝ ${nm(c,'을/를')} 쓰러뜨렸다!</span>`);
  B.exp+=c.exp; B.gold+=ri(c.gold[0],c.gold[1])+(c.stolen||0); RUN.kills++; META.kills++;
  if(c.stolen) log(`<span class="l-gold">훔쳐간 골드 ${c.stolen}을 되찾았다.</span>`);
  B.drops+= c.boss?0:(c.elite?1:0);
}

/* ---------- 몬스터 ---------- */
function makeMonster(id,elite){
  const d=MONSTERS[id], sc=floorScale(), em=elite?1:0;
  const m={uid:'e'+(++UID),id,name:(elite?'정예 ':'')+d.name,icon:d.icon,boss:!!d.boss,elite:!!elite,
    maxHp:Math.round(d.hp*sc*(elite?1.7:1)),atk:Math.round(d.atk*sc*(elite?1.3:1)),def:Math.round(d.def*(1+.35*(RUN.floor-1))+em*2),
    agi:d.agi+(RUN.floor-1)+em,mag:Math.round(d.mag*sc*(elite?1.3:1)),element:d.element||null,tags:d.tags||[],immune:d.immune||{},resist:d.resist||{},evade:d.evade||0,
    exp:Math.round(d.exp*sc*(elite?2.2:1)),gold:d.gold.map(g=>Math.round(g*sc*(elite?2:1))),st:{},intents:[],flags:{},last:null};
  m.hp=m.maxHp; return m;
}
function pickIntent(e,prev){
  const d=MONSTERS[e.id];
  let opts=d.ai.filter(a=>(!a.cond||a.cond(e))&&!(a.once&&e.flags[a.id])&&!(a.noRepeat&&prev===a.id));
  if(!opts.length) opts=[d.ai[0]];
  return wpick(opts,a=>a.w||1);
}
function refillIntents(e){ while(e.intents.length<2){ const prev=e.intents.length?e.intents[e.intents.length-1].id:e.last; const it=pickIntent(e,prev); if(it.once) e.flags[it.id]=true; e.intents.push(it); } }
function intentHTML(e,it,next){
  let icon='⚔',cls=next?'intent next':'intent',num='';
  if(it.type==='attack'){ const S=eStats(e), ps=pStats(); const el=it.element||null;
    let d=(it.magic?S.mag:S.atk)*it.mult*S.dmgMul; d*=20/(20+Math.max(0,ps.def*(it.magic?.5:1))); d*=ps.dmgTakenMul;
    num=` <span class="num">~${Math.max(1,Math.round(d))}${it.hits>1?'×'+it.hits:''}</span>`; if(it.heavy){ icon='💥'; cls+=' heavy'; } if(el) icon=ELEMENTS[el].icon; }
  else if(it.type==='buff') icon='⬆'; else if(it.type==='debuff') icon='⬇'; else if(it.type==='summon') icon='☠'; else if(it.type==='heal') icon='✚'; else if(it.type==='steal') icon='💰';
  const st=it.status?` <span class="l-st">${STATUSES[it.status[0]].icon}</span>`:'';
  return `<div class="${cls}">${next?'다음: ':''}${icon} ${it.text||it.name}${num}${st}</div>`;
}
function genEncounter(){
  const F=floorDef(); const budget=1+RUN.step*.32+(RUN.floor-1)*.4; const ids=[]; let used=0;
  const pool=Object.entries(F.pool);
  while(ids.length<3){ const cand=pool.filter(([id])=>used+MONSTERS[id].cost<=budget+.25||ids.length===0); if(!cand.length) break; const [id]=wpick(cand,x=>x[1]); ids.push(id); used+=MONSTERS[id].cost; if(used>=budget) break; }
  return ids;
}

/* ---------- 전투 흐름 ---------- */
function startBattle(ids,opt={}){
  const enemies=ids.map((id,i)=>makeMonster(id,opt.elite&&i===0));
  B={enemies,round:0,log:[],queue:[],qi:0,rolls:[],exp:0,gold:0,drops:0,shield:0,mode:'busy',cur:null,over:false,result:null,
     boss:!!opt.boss,elite:!!opt.elite,giant:false,berserk:false,fleeSure:false,phoenixUsed:false,awaiting:null,pending:null};
  P.st={}; P.cd={};
  for(const e of enemies) refillIntents(e);
  renderBattleShell();
  runBattle().catch(err=>{ console.error(err); });
}
async function runBattle(){
  const s=pStats();
  log(`<span class="l-sys">${B.boss?'👑 보스 전투!':B.elite?'💀 정예 전투!':'⚔ 전투 시작!'} ${B.enemies.map(e=>nm(e)).join(', ')}</span>`);
  if(s.startShield){ B.shield=Math.round(s.startShield*floorScale()); log(`🔮 수정 목걸이가 보호막 <b>${B.shield}</b>을 펼친다.`); }
  if(s.flags.firstStealth) addStatus(P,'stealth',2);
  for(const [id,t] of RUN.nextBattle) addStatus(P,id,t); RUN.nextBattle=[];
  renderBattle();
  if(s.flags.firstShot){ await sleep(400); const t=pick(alive()); log(`🏹 선제 사격!`); strike(P,t,s.atk*.8,{type:'phys',element:P.st.imbue?.el||s.element}); checkEnd(); renderBattle(); }
  while(!B.over){
    B.round++; rollInit(); renderBattle(); await sleep(550);
    B.qi=0;
    while(B.qi<B.queue.length&&!B.over){ const c=B.queue[B.qi++]; await takeTurn(c); checkEnd(); renderBattle(); }
  }
  await sleep(500);
  finishBattle();
}
function rollInit(){
  B.enemies=B.enemies.filter(e=>e.hp>0);
  for(const el of document.querySelectorAll('.ecard')) if(!B.enemies.some(e=>'cb-'+e.uid===el.id)) el.remove();
  const s=pStats();
  const rolls=[P,...B.enemies].map(c=>{
    const st=c.isPlayer?s:eStats(c); let die=d10(), die2=null, bonus=0;
    if(c.isPlayer){ if(s.flags.diceTwice){ die2=d10(); } let best=Math.max(die,die2||0); best=Math.max(best,s.diceMin); bonus=s.diceBonus+(B.round===1?s.firstDice:0); return {c,agi:st.agi,die,die2,best,bonus,total:st.agi+best+bonus,extra:false}; }
    return {c,agi:st.agi,die,best:die,bonus:0,total:st.agi+die,extra:false};
  });
  const me=rolls[0], others=rolls.slice(1);
  const maxE=Math.max(...others.map(r=>r.total));
  if(others.length&&me.total>=maxE*2) me.extra=true;
  for(const r of others) if(r.total>=me.total*2) r.extra=true;
  rolls.sort((a,b)=>b.total-a.total||(a.c.isPlayer?-1:b.c.isPlayer?1:b.agi-a.agi));
  B.rolls=rolls; B.queue=[];
  for(const r of rolls){ B.queue.push(r.c); if(r.extra) B.queue.push(r.c); }
  logRound(`— ${B.round}라운드 — `+rolls.map(r=>`${r.c.isPlayer?'나':r.c.name} ${r.agi}+🎲${r.die2!=null?`${r.die}/${r.die2}`:r.die}${r.bonus?'+'+r.bonus:''}=<b>${r.total}</b>${r.extra?' ⚡추가 행동':''}`).join(' · '));
}
async function takeTurn(c){
  if(c.hp<=0||B.over) return;
  B.cur=c; renderBattle();
  tickStart(c); checkEnd(); renderBattle();
  if(B.over||c.hp<=0){ B.cur=null; return; }
  if(c.isPlayer){
    const s=pStats();
    gainMana(s.manaRegen);
    for(const k in P.cd) if(P.cd[k]>0) P.cd[k]--;
    if(s.selfDmg){ const d=Math.round(s.selfDmg*Math.sqrt(floorScale())); applyDamage(P,d,{dot:true}); log(`<span class="l-warn">저주받은 검이 피를 빤다. HP -${d}</span>`); checkEnd(); if(B.over){ B.cur=null; return; } }
  }
  if(c.st.stun){ log(`<span class="l-st">${nm(c,'은/는')} 💫기절해 움직이지 못한다.</span>`); popup(c,'💫','st'); await sleep(450); }
  else if(c.st.sleep){ log(`<span class="l-st">${nm(c,'은/는')} 💤잠들어 있다.</span>`); popup(c,'💤','st'); await sleep(450); }
  else if(c.isPlayer) await playerTurn();
  else { await sleep(380); await enemyAct(c); await sleep(320); }
  tickEnd(c);
  B.cur=null;
}
function checkEnd(){ if(!B||B.over) return; if(P.hp<=0){ B.over=true; B.result='lose'; } else if(!alive().length){ B.over=true; B.result='win'; } }

function playerTurn(){ return new Promise(res=>{ B.awaiting=res; B.mode='main'; renderBattle(); }); }
function uiAct(kind,arg){
  if(!B||!B.awaiting) return;
  if(kind==='back'){ B.mode='main'; B.pending=null; renderBattle(); return; }
  if(kind==='skills'||kind==='items'){ B.mode=kind; renderBattle(); return; }
  let target=null;
  if(kind==='attack') target='one';
  if(kind==='skill') target=SKILLS[arg].target;
  if(kind==='item') target=ITEMS[RUN.cons[arg]].target||'self';
  if(target==='one'&&alive().length>1){ B.mode='target'; B.pending={kind,arg}; renderBattle(); return; }
  resolveAction({kind,arg,target:target==='one'?alive()[0]:null});
}
function uiTarget(uid){
  if(!B) return;
  const e=B.enemies.find(x=>x.uid===uid);
  if(B.mode==='target'&&B.pending&&e&&e.hp>0){ const p=B.pending; B.pending=null; resolveAction({kind:p.kind,arg:p.arg,target:e}); return; }
  if(e) showEnemyInfo(e);
}
async function resolveAction(a){
  const res=B.awaiting; B.awaiting=null; B.mode='busy'; renderBattle();
  const quick=await performAction(a);
  checkEnd();
  if(quick&&!B.over&&P.hp>0){ B.awaiting=res; B.mode='main'; renderBattle(); return; }
  res();
}
async function performAction(a){
  const s=pStats();
  if(a.kind==='attack'){
    const el=(P.st.imbue&&P.st.imbue.el)||s.element; const magic=s.flags.basicMagic;
    log(`${nm(P,'의')} ${magic?'마력 화살':'공격'}!`);
    for(let i=0;i<s.hits;i++){
      let t=a.target; if(!t||t.hp<=0){ t=alive()[0]; if(!t) break; }
      const raw=(magic?s.mag*.75+s.atk*.3:s.atk)*s.hitMult+(s.spellblade?s.mag*s.spellblade:0);
      strike(P,t,raw,{type:magic?'magic':'phys',element:el});
      renderBattle(); if(i<s.hits-1) await sleep(240);
    }
    delete P.st.stealth;
  } else if(a.kind==='skill'){
    const sk=SKILLS[a.arg], cost=skillCost(a.arg,s);
    P.mana-=cost; if(sk.cd) P.cd[a.arg]=sk.cd+1;
    log(`${nm(P,'의')} <b class="l-crit">${sk.name}</b>!`);
    sk.run(a.target,s);
    if(s.skillRefund){ const r=Math.floor(cost*s.skillRefund); if(r) gainMana(r); }
    if(sk.target!=='self') delete P.st.stealth;
    if(sk.target==='all') shakeScreen();
    await sleep(200);
    return !!sk.quick;
  } else if(a.kind==='item'){
    const id=RUN.cons[a.arg], it=ITEMS[id];
    RUN.cons.splice(a.arg,1);
    log(`${nm(P,'이/가')} ${itName(id)}${josa(it.name,'을/를')} 사용했다.`);
    it.use(a.target);
    await sleep(200);
    return !!it.quick;
  } else if(a.kind==='defend'){
    addStatus(P,'defend',1); const g=gainMana(4); log(`${nm(P,'이/가')} 몸을 웅크려 방어한다. (마나 +${g})`);
  } else if(a.kind==='flee'){
    const avg=alive().reduce((t,e)=>t+eStats(e).agi,0)/Math.max(1,alive().length);
    const ch=B.fleeSure?100:clamp(45+(s.agi-avg)*4,15,90);
    if(chance(ch)){ log(`<span class="l-sys">달아나는 데 성공했다! (${Math.round(ch)}%)</span>`); B.over=true; B.result='flee'; }
    else log(`<span class="l-warn">도망치지 못했다! (${Math.round(ch)}%)</span>`);
  }
  return false;
}
function skillCost(id,s){ return Math.max(1,Math.round(SKILLS[id].cost*(s||pStats()).skillCostMul)); }

async function enemyAct(e){
  const it=e.intents.shift(); e.last=it.id; refillIntents(e);
  const S=eStats(e);
  log(`<span class="l-warn">${nm(e,'의')} ${it.name}!</span>`);
  renderBattle();
  const mirrored=()=>{ if(it.skill&&P.st.mirror){ delete P.st.mirror; popup(P,'🪞반사','st'); log(`<span class="l-crit">🪞 거울 조각이 ${it.name}${josa(it.name,'을/를')} 튕겨냈다!</span>`); return true; } return false; };
  switch(it.type){
    case 'attack':{
      const hits=it.hits||1;
      if(mirrored()){ const d=Math.round((it.magic?S.mag:S.atk)*it.mult*hits); applyDamage(e,d); log(`${nm(e,'이/가')} 자기 기술에 <span class="l-dmg">${d}</span> 피해`); break; }
      for(let i=0;i<hits;i++){ if(P.hp<=0||e.hp<=0) break;
        const r=strike(e,P,(it.magic?S.mag:S.atk)*it.mult,{type:it.magic?'magic':'phys',element:it.element||null,lifesteal:it.lifesteal});
        if(it.heavy&&r.hit) shakeScreen();
        if(r.hit&&it.status&&P.hp>0&&chance(it.status[2]??100)) addStatus(P,it.status[0],it.status[1],it.status[3]||{});
        renderBattle(); if(i<hits-1) await sleep(260);
      }
      break; }
    case 'buff':{ const tg=it.target==='allies'?alive():[e]; for(const t of tg) addStatus(t,it.status[0],it.status[1],it.status[3]||{}); break; }
    case 'debuff':{ if(mirrored()){ addStatus(e,it.status[0],it.status[1]); break; } if(chance(it.status[2]??100)) addStatus(P,it.status[0],it.status[1]); break; }
    case 'heal':{ const t=alive().sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0]; const h=heal(t,t.maxHp*(it.pct||.25)); if(h) log(`${nm(t,'이/가')} <span class="l-heal">${h}</span> 회복했다.`); break; }
    case 'summon':{ if(B.enemies.filter(x=>x.hp>0).length>=4){ log('<span class="l-sys">하지만 아무것도 나타나지 않았다.</span>'); break; }
      const m=makeMonster(it.summon,false); m.exp=Math.round(m.exp*.5); m.gold=[0,Math.round(m.gold[1]/2)]; refillIntents(m); B.enemies.push(m); log(`<span class="l-warn">${nm(m,'이/가')} 나타났다!</span>`); break; }
    case 'steal':{ const amt=Math.min(RUN.gold,ri(it.amount[0],it.amount[1])); RUN.gold-=amt; e.stolen=(e.stolen||0)+amt; popup(P,'-'+amt+'G','miss'); log(`<span class="l-warn">골드 ${amt}을 도둑맞았다! (쓰러뜨리면 되찾는다)</span>`); renderTop(); break; }
  }
  checkEnd();
}

function finishBattle(){
  const result=B.result;
  P.st={}; const giant=B.giant;
  if(result==='lose'){ B=null; gameOver(); return; }
  if(result==='flee'){ B=null; clampPlayer(); toast('무사히 달아났다.'); advance(); return; }
  const s=pStats();
  const gold=Math.round(B.gold*s.goldMul);
  RUN.gold+=gold;
  const lines=[`<span class="l-good">EXP +${B.exp}</span> · <span class="l-gold">골드 +${gold}</span>`];
  const drops=[];
  const killed=B.enemies.length;
  if(B.boss){ drops.push(randomItem({gear:true,minRarity:'rare'})); drops.push(randomItem({type:'cons',minRarity:'rare'})); }
  else { if(B.elite) drops.push(randomItem({minRarity:'rare'})); if(chance(22+s.dropBonus+killed*4)) drops.push(randomItem({})); }
  for(const d of drops) lines.push('획득: '+gainItem(d));
  if(s.postHeal){ const h=heal(P,s.maxHp*s.postHeal); if(h) lines.push(`🩹 응급처치 <span class="l-heal">+${h}</span>`); }
  const mg=gainMana(s.maxMana*.35); if(mg) lines.push(`<span class="dim">숨을 고르며 마나 +${mg}</span>`);
  const exp=B.exp;
  B.mode='reward'; B.rewardLines=lines; B.giant=false; B.berserk=false;
  if(giant) clampPlayer();
  gainExp(exp);
  renderBattle(); renderTop();
}
function afterBattle(){
  const boss=B&&B.boss; B=null; clampPlayer();
  processLevelUps(()=>{ if(boss) floorClear(); else advance(); });
}
function clampPlayer(){ const s=pStats(); P.hp=Math.min(P.hp,s.maxHp); P.mana=Math.min(P.mana,s.maxMana); }

function gainExp(n){ n=Math.round(n*pStats().expMul); META.exp+=n; while(META.exp>=expNeed(META.level)){ META.exp-=expNeed(META.level); META.level++; RUN.pendingLv++; const s=pStats(); heal(P,s.maxHp*.25); } saveMeta(); renderTop(); }
function processLevelUps(done){
  if(RUN.pendingLv>0){ RUN.pendingLv--; showPerkPick(()=>processLevelUps(done)); }
  else if(RUN.vetPicks>0){ RUN.vetPicks--; showPerkPick(()=>processLevelUps(done),true); }
  else done();
}
function showPerkPick(done,vet){

  const opts=shuffle(pool).slice(0,3);

    <div class="perks">${opts.map(id=>{ const pk=PERKS[id]; const n=RUN.perks[id]||0; return `<button class="btn card perk" onclick="pickPerk('${id}')"><h3>${pk.icon} ${pk.name}${n?` <span class="small dim">(보유 ${n})</span>`:''}</h3><div>${pk.desc}</div></button>`; }).join('')}</div>`);
  window._perkDone=done;
}
function pickPerk(id){ RUN.perks[id]=(RUN.perks[id]||0)+1; if(PERKS[id].onPick) PERKS[id].onPick(); clampPlayer(); closeModal(); renderTop(); saveRun(); const d=window._perkDone; window._perkDone=null; if(d) d(); }
function gainBonus(k,v){ RUN.bonus[k]=(RUN.bonus[k]||0)+v; }
function gainGold(n,noMul){ const g=Math.round(n*(noMul?1:pStats().goldMul)*(noMul?1:floorScale())); RUN.gold+=g; return g; }
function hurt(n){ P.hp=Math.max(1,P.hp-Math.round(n)); }
function check(stat,dc){ dc+=(RUN.floor-1)*3; const v=pStats()[stat], d=Math.max(d10(),1)+(RUN.bonus.diceBonus||0), tot=v+d, ok=tot>=dc;
  return {ok,text:`<span class="roll">🎲 ${d} + ${STAT_NAME[stat]} ${v} = <b>${tot}</b> ${ok?'≥':'<'} ${dc} → ${ok?'성공!':'실패'}</span>`}; }

/* ---------- 아이템 ---------- */
function randomItem(o){
  const order=['common','rare','legend'];
  let cand=Object.keys(ITEMS).filter(id=>{ const it=ITEMS[id]; if(it.recipeOnly) return false; if(o.type&&it.type!==o.type) return false; if(o.gear&&it.type==='cons') return false;
    if(o.minRarity&&(order.indexOf(it.rarity)<order.indexOf(o.minRarity))) return false; return true; });
  if(!cand.length) cand=Object.keys(ITEMS).filter(id=>!ITEMS[id].recipeOnly);
  const rar=wpick([...new Set(cand.map(id=>ITEMS[id].rarity))],r=>RARITY[r].w+(r==='legend'?RUN.floor*2:0));
  return pick(cand.filter(id=>ITEMS[id].rarity===rar));
}
function gainItem(id){
  const it=ITEMS[id];
  if(it.type==='cons'){
    if(RUN.cons.length>=pStats().consSlots){ const g=Math.ceil(price(id)/2); RUN.gold+=g; return `${itName(id)} <span class="dim">(가방이 가득 차 ${g}골드에 팔았다)</span>`; }
    RUN.cons.push(id);
  } else {
    if(RUN.bag.length>=10){ const g=Math.ceil(price(id)/2); RUN.gold+=g; return `${itName(id)} <span class="dim">(장비 가방이 가득 차 ${g}골드에 팔았다)</span>`; }
    RUN.bag.push(id);
  }
  return itName(id);
}
function price(id){ const it=ITEMS[id]; const base=it.type==='cons'?it.price:(it.price||RARITY[it.rarity].gear); return Math.round(base*(1+.2*(RUN.floor-1))); }
function itemDesc(id){ const it=ITEMS[id]; const st=it.stats||{}; const parts=[];
  for(const k of ['atk','def','agi','mag','maxHp','maxMana','crit','evade']) if(st[k]) parts.push(`${STAT_NAME[k]} ${st[k]>0?'+':''}${st[k]}`);
  return `${parts.length?`<b>${parts.join(' · ')}</b> — `:''}${it.desc}${it.element?' '+elTag(it.element):''}`; }

/* ---------- 지도 ---------- */
function genChoices(){
  const F=floorDef(), st=RUN.step;
  if(st===F.steps-1) return ['boss'];
  if(st===0) return ['battle','event'];
  const n=chance(55)?3:2, types=[];
  if(st===F.steps-2) types.push('rest');
  while(types.length<n){ const pool=Object.keys(NODE_TYPES).filter(k=>!types.includes(k)&&st>=(NODE_TYPES[k].minStep||0)); types.push(wpick(pool,k=>NODE_TYPES[k].w)); }
  if(!types.some(t=>t==='battle'||t==='elite')&&chance(60)) types[types.length-1]='battle';
  return shuffle([...new Set(types)]);
}
function showMap(){

      const n=NODE_TYPES[t]; return `<button class="btn card choice n-${t}" onclick="enterNode(${i})"><span class="ic">${n.icon}</span><div><h3>${n.name}</h3><div class="dim small">${n.desc}</div></div></button>`; }).join('')}</div>
  </div>`);

function advance(){ RUN.step++; RUN.choices=null; showMap(); }
function enterNode(i){
  const t=RUN.choices[i];
  switch(t){
    case 'boss': startBattle([floorDef().boss],{boss:true}); break;
    case 'battle': startBattle(genEncounter()); break;
    case 'elite': { const F=floorDef(); const ids=[wpick(Object.entries(F.pool).filter(([id])=>MONSTERS[id].cost>=1),x=>x[1])[0]]; if(RUN.step>=5&&chance(50)) ids.push(genEncounter()[0]); startBattle(ids,{elite:true}); break; }
    case 'event': showEvent(pick(EVENTS)); break;
    case 'shop': showShop(true); break;
    case 'alchemist': showAlchemist(true); break;
    case 'rest': showRest(); break;
    case 'treasure': showTreasure(); break;
  }
}

    <div class="sec-t">재료 2개 선택 (소모품·가방의 장비)</div>
    <div class="items">${list.length?list.map(x=>`<button class="btn it ${A.sel.includes(x.key)?'sel':''}" onclick="alchSel('${x.key}')"><span class="ico">${ITEMS[x.id].icon}</span><div><b class="rar-${ITEMS[x.id].rarity}">${ITEMS[x.id].name}</b><div class="d">${ITEMS[x.id].desc}</div></div><span>${A.sel.includes(x.key)?'✓':''}</span></button>`).join(''):'<div class="faint">넣을 재료가 없다.</div>'}</div>
    <button class="btn primary" ${A.sel.length===2&&RUN.gold>=cost?'':'disabled'} onclick="alchemize()">솥에 넣는다 (${cost?cost+'G':'첫 번째는 무료'})</button>
    <div class="row"><button class="btn grow" onclick="showRecipes()">레시피 노트 ${META.recipes.length}/${RECIPES.length}</button><button class="btn grow" onclick="advance()">떠난다</button></div></div>`);
}
function alchSel(k){ const A=RUN.alch; const i=A.sel.indexOf(k); if(i>=0) A.sel.splice(i,1); else { if(A.sel.length>=2) A.sel.shift(); A.sel.push(k); } showAlchemist(false); }
function alchemize(){
  const A=RUN.alch, cost=A.free>0?0:NPCS.alchemist.cost; if(A.sel.length!==2||RUN.gold<cost) return;
  const get=k=>k[0]==='c'?RUN.cons[+k.slice(1)]:RUN.bag[+k.slice(1)];
  const a=get(A.sel[0]), b=get(A.sel[1]);
  // 큰 인덱스부터 제거
  const rm=[...A.sel].sort((x,y)=>(x[0]===y[0]?+y.slice(1)-+x.slice(1):0));
  for(const k of rm.filter(k=>k[0]==='c').sort((x,y)=>+y.slice(1)-+x.slice(1))) RUN.cons.splice(+k.slice(1),1);
  for(const k of rm.filter(k=>k[0]==='b').sort((x,y)=>+y.slice(1)-+x.slice(1))) RUN.bag.splice(+k.slice(1),1);
  RUN.gold-=cost; if(A.free>0) A.free--; A.sel=[];
  const r=RECIPES.find(r=>(r.a===a&&r.b===b)||(r.a===b&&r.b===a));
  let out, msg;
  if(r){ out=r.out; const key=r.a+'+'+r.b; const isNew=!META.recipes.includes(key); if(isNew){ META.recipes.push(key); saveMeta(); } msg=isNew?'<b class="l-crit">✨ 새 레시피 발견!</b>':'알고 있던 레시피다.'; }
  else { const ta=ITEMS[a].type, tb=ITEMS[b].type;
    if(ta===tb&&chance(70)){ out=randomItem(ta==='cons'?{type:'cons'}:{type:ta}); msg='솥이 부글거리더니 비슷한 무언가가 나왔다.'; }
    else if(chance(35)){ out=randomItem({type:'cons'}); msg='엉뚱한 것이 나왔다.'; }
    else { out='junk'; msg='솥에서 시커먼 연기가... 실패작이다.'; } }
  const got=gainItem(out); saveRun();
  openModal(`<h2>⚗ 연금 결과</h2><div>${itName(a)} + ${itName(b)}</div><div style="font-size:18px">→ ${got}</div><div>${msg}</div><div class="dim small">${ITEMS[out].desc}</div><button class="btn primary" onclick="closeModal();showAlchemist(false)">확인</button>`);
}
function showRecipes(){
  openModal(`<div class="row"><h2 class="grow">레시피 노트</h2><button class="btn sm" onclick="closeModal()">닫기</button></div>
    <div class="items">${RECIPES.map(r=>{ const k=r.a+'+'+r.b; return META.recipes.includes(k)?`<div class="small">${itName(r.a)} + ${itName(r.b)} → ${itName(r.out)}</div>`:`<div class="small faint">??? + ??? → ???</div>`; }).join('')}</div>
    <div class="small dim">레시피에 없는 조합도 같은 종류끼리 섞으면 쓸만한 것이 나오기도 합니다. 발견한 레시피는 다음 모험에도 남습니다.</div>`);
}

/* ---------- 휴식 / 보물 ---------- */
function showRest(){
  renderTop(); const s=pStats();
  setMain(`<div class="scroll"><span class="dim small">휴식</span><h2>🔥 꺼져가는 모닥불</h2><p class="flavor">불씨를 살려 잠시 몸을 녹인다. 할 수 있는 일은 하나뿐이다.</p>
    <div class="choices">
      <button class="btn card" onclick="rest('sleep')"><b>푹 잔다</b><span class="small dim">HP ${Math.round(s.maxHp*.4)} 회복</span></button>
      <button class="btn card" onclick="rest('meditate')"><b>명상한다</b><span class="small dim">마나 전부 + HP ${Math.round(s.maxHp*.15)} 회복</span></button>
      <button class="btn card" onclick="rest('train')"><b>수련한다</b><span class="small dim">EXP +${14+RUN.floor*6}</span></button>
    </div></div>`);
}
function rest(k){ const s=pStats();
  if(k==='sleep'){ const h=heal(P,s.maxHp*.4); toast(`HP <b class="l-good">+${h}</b>`); }
  if(k==='meditate'){ P.mana=s.maxMana; const h=heal(P,s.maxHp*.15); toast(`마나 전부, HP <b class="l-good">+${h}</b>`); }
  if(k==='train'){ gainExp(14+RUN.floor*6); toast(`EXP +${14+RUN.floor*6}`); }
  renderTop(); processLevelUps(()=>advance()); }
function showTreasure(){
  renderTop();
  if(chance(18)){ setMain(`<div class="scroll"><span class="dim small">보물</span><h2>💎 반짝이는 상자</h2><div class="ev-text"><p>뚜껑을 여는 순간, 상자에 이빨이 돋아났다!</p></div><button class="btn primary" onclick="startBattle(['mimic'])">⚔ 싸운다!</button></div>`); return; }
  const s=pStats(); const g=gainGold(ri(15,30)); const lines=[`<b class="l-gold">골드 ${g}</b>`, gainItem(randomItem(chance(50)?{gear:true}:{type:'cons'}))];
  if(s.dropBonus&&chance(35)) lines.push(gainItem(randomItem({type:'cons'}))+' <span class="dim">(손버릇)</span>');
  saveRun(); renderTop();
  setMain(`<div class="scroll"><span class="dim small">보물</span><h2>💎 반짝이는 상자</h2><div class="ev-text"><p>상자 안에서 찾은 것:</p><p>${lines.join('<br>')}</p></div><button class="btn primary" onclick="advance()">계속</button></div>`);
}

/* ---------- 층 클리어 / 게임 오버 ---------- */
function floorClear(){
  META.best=Math.max(META.best,RUN.floor); saveMeta();
  const done=RUN.floor; RUN.floor++; RUN.step=0; RUN.choices=null;
  const h=heal(P,pStats().maxHp*.3); P.mana=pStats().maxMana; saveRun(); renderTop();
  const nextF=floorDef();
  setMain(`<div class="scroll"><span class="dim small">${done}층 정복</span><h2>✝ ${MONSTERS[FLOORS[Math.min(done,FLOORS.length)-1].boss].name} 격파!</h2>
    <div class="ev-text"><p>왕관이 바닥에 굴러떨어진다. 옥좌 뒤로 더 깊은 계단이 열렸다.</p>
    <p><b class="l-good">HP +${h}, 마나 전부 회복</b></p>
    <p class="dim">${RUN.floor>FLOORS.length?`다음 층은 아직 지도에 없다. ${RUN.floor}층은 ${nextF.name}의 더 깊은 곳 — 같은 몬스터가 훨씬 강해져 기다린다.`:nextF.name+'(으)로 내려간다.'}</p></div>
    <button class="btn primary" onclick="showMap()">${RUN.floor}층으로 내려간다</button></div>`);
}
function gameOver(){
  const r=RUN; META.best=Math.max(META.best,r.floor-(r.step===0?1:0)); saveMeta();
  RUN=null; saveRun(); renderTop();
  setMain(`<div class="scroll"><span class="dim small">모험 종료</span><h2 style="color:var(--blood);font-size:30px">당신은 쓰러졌다</h2>
    <div class="ev-text"><p>${CLASSES[r.cls].name}의 여정은 <b>${r.floor}층 ${r.step+1}구역</b>에서 멈췄다. 처치한 적 <b>${r.kills}</b>.</p>
    <p>그러나 영혼은 기억한다. <b style="color:var(--brass)">Lv.${META.level}</b> (${META.exp}/${expNeed(META.level)})은 다음 모험에도 이어진다.</p></div>
    <button class="btn primary" onclick="showClassSelect()">다시 도전</button><button class="btn ghost" onclick="showTitle()">타이틀로</button></div>`);
}

/* ---------- 시작 ---------- */
META=loadMeta();
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('#modal').classList.contains('open')&&!window._perkDone) closeModal(); });
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal'&&!window._perkDone) closeModal(); });
showTitle();
</script>
</body>
</html>
