<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>미드가르드 제도: 잔향</title>
<style>
:root{--bg:#0c0d0e;--p1:#151718;--p2:#1d2022;--ln:#2d3134;--tx:#cfcac0;--dim:#8a877f;--red:#b4443d;--red2:#5e2320;--brass:#b59a5f;--brass2:#4a3f26;--grn:#86a187;--grn2:#33473a;--warn:#cf8a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;font-size:15px;line-height:1.5}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:#0c0d0eee;border-bottom:1px solid var(--ln);font-size:13px}
.top b{letter-spacing:.2em;color:var(--brass);margin-right:auto;font-weight:600}
.top span{color:var(--dim)}.top span em{font-style:normal;color:var(--tx)}
.scr{flex:1;padding:14px 14px 22px;display:flex;flex-direction:column;gap:12px}
h1{font-size:22px;margin:4px 0 0;font-weight:600;letter-spacing:.04em}
h2{font-size:16px;margin:6px 0 0;font-weight:600;color:var(--brass)}
h3{font-size:14px;margin:0 0 2px;font-weight:600}
p{margin:0}
.dim{color:var(--dim)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.panel{background:var(--p1);border:1px solid var(--ln);padding:12px;border-radius:3px}
.panel.red{border-color:var(--red2)}.panel.brass{border-color:var(--brass2)}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:block;width:100%;min-height:48px;padding:10px 12px;background:var(--p2);border:1px solid var(--ln);border-radius:3px;text-align:center;line-height:1.3}
.btn:active{background:#262a2d}
.btn.primary{border-color:var(--brass);color:var(--brass)}
.btn.danger{border-color:var(--red);color:#e0a29d}
.btn.ghost{background:transparent}
.btn.sel{outline:2px solid var(--brass);outline-offset:-2px;background:#221f17}
.btn[disabled],.btn.off{opacity:.38;pointer-events:none}
.btn small{display:block;color:var(--dim);font-size:11.5px;margin-top:1px}
.btn.primary small{color:#8d7b4c}
.tag{font-size:11px;padding:0 4px;border:1px solid;border-radius:2px;white-space:nowrap;vertical-align:middle;margin-left:3px}
.tg-c{color:var(--grn);border-color:var(--grn2)}.tg-u{color:var(--warn);border-color:#5a3f1d}.tg-o{color:#c98a85;border-color:var(--red2)}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border:1px solid var(--ln);border-radius:10px;color:var(--dim);margin:0 4px 4px 0}
.chip.b{border-color:var(--brass2);color:var(--brass)}.chip.r{border-color:var(--red2);color:#d49a95}.chip.g{border-color:var(--grn2);color:var(--grn)}
.bar{height:9px;background:#0a0b0c;border:1px solid var(--ln);position:relative;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grn)}
.bar.hp i{background:#8a3a34}.bar.bu i{background:var(--brass)}.bar.bu.hot i{background:var(--red)}
.lab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:2px}
.card{display:block;width:100%;text-align:left;background:var(--p1);border:1px solid var(--ln);padding:12px;border-radius:3px}
.card:active{background:#1a1d1f}
.card .ch{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.card .cd{color:var(--dim);font-size:13px;margin-top:2px}.card .cr{font-size:12.5px;color:var(--brass);margin-top:5px}
.card.sel{border-color:var(--brass);background:#1d1b14}
.card.elite{border-color:var(--red2)}
.risk{color:var(--red);letter-spacing:2px;font-size:12px}
.warnl{color:var(--warn);font-size:12px;margin-top:4px}
.track{display:flex;gap:5px;align-items:center}
.track i{flex:1;height:5px;background:var(--p2);border:1px solid var(--ln)}
.track i.done{background:var(--brass2);border-color:var(--brass2)}.track i.now{background:var(--brass);border-color:var(--brass)}
.track i.boss{border-color:var(--red2)}.track i.boss.now{background:var(--red)}
.log{background:#0a0b0c;border:1px solid var(--ln);padding:8px 10px;min-height:120px;max-height:210px;overflow-y:auto;font-size:13px;display:flex;flex-direction:column;gap:2px}
.log .good{color:var(--grn)}.log .bad{color:#d98d87}.log .warn{color:var(--warn)}.log .sys{color:var(--dim)}
.intent{border:1px solid var(--red2);background:#1a1110;padding:8px 10px;border-radius:3px}
.intent b{color:#e0a29d}
.foot{position:sticky;bottom:0;z-index:5;background:#0c0d0efa;border-top:1px solid var(--ln);padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:6px}.tabs .btn{min-height:40px;padding:6px}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal .box{background:var(--p1);border:1px solid var(--brass2);padding:16px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
input[type=text],textarea{width:100%;background:#0a0b0c;color:var(--tx);border:1px solid var(--ln);padding:10px;border-radius:3px;font:inherit}
select{width:100%;background:#0a0b0c;color:var(--tx);border:1px solid var(--ln);padding:10px;border-radius:3px;font:inherit}
label{font-size:12.5px;color:var(--dim);display:block;margin-bottom:3px}
.portrait{width:76px;height:76px;flex:none;border:1px solid var(--ln);background:#0a0b0c}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stat div{background:var(--p2);border:1px solid var(--ln);padding:5px 2px;font-size:12px;color:var(--dim)}
.stat b{display:block;color:var(--tx);font-size:16px}
.lines p{padding:2px 0}
.hit{animation:hit .28s}
@keyframes hit{0%{transform:translateX(0);background:#3a1512}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}100%{transform:translateX(0)}}
hr{border:0;border-top:1px solid var(--ln);margin:6px 0;width:100%}
.link{background:none;border:0;color:var(--dim);text-decoration:underline;font-size:12px;padding:6px;align-self:center}
/* ---- v2 추가 스타일 ---- */
.tog{display:inline-flex;align-items:center;min-height:38px;padding:6px 11px;border:1px solid var(--ln);border-radius:18px;margin:0 6px 6px 0;background:var(--p2);font-size:13px;line-height:1.25;text-align:left}
.tog.on{border-color:var(--brass);color:var(--brass);background:#221f17}
.tog.off{opacity:.35;pointer-events:none}
.tog small{color:var(--dim);font-size:11px;margin-left:5px}
.toggrp{display:flex;flex-wrap:wrap}
.rar0{color:#b0ab9f}.rar1{color:#97b998}.rar2{color:#7fb0dc}.rar3{color:#c79ae2}.rar4{color:#e0b45c}.rarC{color:#d07a72}
.bd0{border-color:#3a3d40!important}.bd1{border-color:#3d5541!important}.bd2{border-color:#2f4d68!important}.bd3{border-color:#5a3f6b!important}.bd4{border-color:#6b5428!important}
.tabs.scroll{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}.tabs.scroll .btn{flex:none;width:auto;padding:6px 12px;white-space:nowrap}
.mapbox{background:#0a0b0c;border:1px solid var(--ln);border-radius:3px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox text{font-family:inherit}
.syn{font-size:11.5px;color:var(--grn)}
.syn b{color:var(--brass);font-weight:600}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:2px 0}
.kv span:first-child{color:var(--dim)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.badge{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:2px;background:#2a2417;color:var(--brass);margin-left:4px;vertical-align:middle}
.sect{font-size:12.5px;color:var(--brass);margin:6px 0 4px;font-weight:600}
.note{font-size:11.5px;color:var(--dim)}
.seal{color:#d98d87}
.toastbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(48px + env(safe-area-inset-top));z-index:30;width:calc(100% - 24px);max-width:536px;background:#221f17;border:1px solid var(--brass);color:var(--brass);padding:10px 12px;border-radius:3px;font-size:13px;text-align:left;box-shadow:0 4px 18px #000a}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   미드가르드 제도: 잔향 — v2.0 확장판
   구성: 데이터 / 세계(지역·이상체·보스·사건) / 상태·저장·이전 / 파생 능력치 / 지도 생성 /
         탐사 흐름 / 전투 / 정산 / 본부 / UI
   v1 저장 데이터는 자동으로 v2로 이전된다(migrateV1).
   수치·확률·비용은 아래 CFG 및 데이터 테이블에서 조정한다.
   ========================================================= */

/* ---------- 유틸 ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const rf=(a,b)=>a+Math.random()*(b-a);
const chance=p=>Math.random()<p;
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function wpick(entries){let t=0;entries.forEach(e=>t+=Math.max(0,e[1]));if(t<=0)return entries[0][0];let r=Math.random()*t;for(const e of entries){if((r-=Math.max(0,e[1]))<0)return e[0];}return entries[entries.length-1][0];}
const pc=v=>Math.round(v*100)+'%';
const TAG={c:'<span class="tag tg-c">[설정집 확정]</span>',u:'<span class="tag tg-u">[설정집 미정]</span>',o:'<span class="tag tg-o">[게임 오리지널]</span>'};

/* ---------- 밸런스 설정 (게임 오리지널 수치) ---------- */
const CFG={
  base:{hp:60,atk:8,def:0},
  reward:{withdrawYeon:.8,withdrawRec:.8,failYeon:.2,failRec:.4,failHpPct:.4,dupGearYeon:20,failMat:.3,withdrawMat:.8},
  burden:{recoilAt:60,hotAt:80,hotRecoil:3,riskAt:70,capOveruseFrom:3,capOveruseStep:6},
  carryMax:8,
  fleeBase:{'원형':.85,'야형':.7,'괴형':.5,'흉형':.3,'지형':0},
  gradeBonus:{hp:4,atk:1},
  region2Grade:1, /* 청 이상 */
  gearCap:30,maxHeat:5,maxCrit:.8
};
const GRADES=['자','청','녹','황','적','백','흑']; /* [설정집 확정]: 흑>백>적>황>녹>청>자 */
const REC_GRADE={'괴형':'청','흉형':'녹','지형':'황'}; /* [설정집 확정] 권장 엽사 등급 */
const PROMO=[ /* 승급 심사 기준 — [게임 오리지널] */
  null,
  {total:12,need:{'괴형':1}},
  {total:35,need:{'괴형':4,'흉형':1}},
  {total:70,need:{'흉형':3,'지형':1}},
  {total:130,need:{'흉형':8,'지형':4},regions:3},
  {total:220,need:{'지형':10},regions:6}
];

/* ---------- 종족 ----------
   외형·거주지·특성 설명은 [설정집 확정], 전투 효과와 고유 능력은 [게임 오리지널] */
const RACES={
  shia:{n:'시아족',trait:'이마의 세 번째 눈',tc:'에레비아에 주로 산다. 발현자 비율이 높고, 발현자가 아니어도 외모 때문에 차별받는다.',
    pas:'치명타 확률 +10%',style:'치명타·약점 공략',mod:d=>{d.crit+=.1},
    sk:{n:'약점 간파',cost:12,cd:0,d:'제3의 눈으로 약점을 꿰뚫는다. 공격력×1.7, 적 방어력 60% 무시, 2턴간 적이 받는 피해 +25%.'}},
  cornel:{n:'코넬족',trait:'왼쪽 이마의 작은 뿔',tc:'라이호가 발상지로 추정되는 고대 혈통. 이상구·캡슐 적응력이 다른 종족보다 조금 높다.',
    pas:'캡슐로 인한 발현 부담 -25%',style:'캡슐 운용·행동 끊기',mod:d=>{d.capMul*=.75},
    sk:{n:'뿔 돌진',cost:10,cd:2,d:'공격력×1.5. 적이 강한 공격(강한 일격·힘 모으기·방출)을 준비 중이면 끊어 낸다.'}},
  meren:{n:'머렌족',trait:'목 뒤 아가미, 귀의 갈퀴',tc:'에레비아에 주로 산다. 수영 능력이 뛰어나 아르고 소속 엽사 중 다수를 차지한다.',
    pas:'최대 체력 +8',style:'안정적인 회피·지구전',mod:d=>{d.maxHP+=8},
    sk:{n:'물살 가르기',cost:8,cd:3,d:'공격력×1.0. 이번 턴 적의 공격을 완전히 피한다.'}},
  varg:{n:'바르그족',trait:'강아지 귀와 꼬리',tc:'전 지역에 흔한 종족. 후각이 예민하다.',
    pas:'도주 성공률 +20%',style:'정보·확정 치명타',mod:d=>{d.flee+=.2},
    sk:{n:'후각 포착',cost:6,cd:2,d:'공격력×1.2. 이번 전투 동안 적의 다음 행동까지 확인하고, 다음 공격이 반드시 치명타.'}},
  tabi:{n:'타비족',trait:'고양잇과 귀와 꼬리',tc:'네 나라에 고르게 분포하는 고대 혈통. 소리에 예민하고 유연하다.',
    pas:'회피 +12%, 회피에 성공하면 다음 공격 피해 +30% / 최대 체력 -6',style:'회피·연속 타격',
    mod:d=>{d.evade+=.12;d.evadeCounter=Math.max(d.evadeCounter,.3);d.maxHP-=6},
    sk:{n:'그림자 도약',cost:10,cd:2,d:'공격력×0.75로 2회 타격하고, 이번 턴 회피 +45%.'}},
  lep:{n:'레프족',trait:'기다란 토끼 귀',tc:'전 지역에 흔한 종족. 소리에 예민하다.',
    pas:'적의 다음 행동까지 확인, 전투 시작 시 적의 첫 행동 지연 / 방어력 -1',style:'예고 읽기·받아치기',
    mod:d=>{d.preview=true;d.prep=true;d.def-=1},
    sk:{n:'되받아 차기',cost:8,cd:2,d:'이번 턴 방어 자세를 취한다. 적이 공격해 오면 공격력×1.3으로 반격한다.'}},
  meraki:{n:'메라키족',trait:'여우 귀와 꼬리',tc:'전 지역에 살지만 바르그족·레프족보다 수가 적다.',
    pas:'거래상 가격 -15%, 사건에서 얻는 연 +20% / 최대 체력 -4',style:'자원 운용·교란',
    mod:d=>{d.shopMul*=.85;d.evYeon+=.2;d.maxHP-=4},
    sk:{n:'여우불 교란',cost:10,cd:3,d:'공격력×0.8. 적이 준비 중인 행동을 흐트러뜨린다(일반 개체는 행동 취소, 정예·최종 위협은 위력 절반).'}},
  ibex:{n:'아이벤족',trait:'세로 동공, 흰 털, 머리의 산양뿔 두 개',tc:'에레비아 특정 지역의 집성촌에 사는 소수민족. 발현자 비율이 가장 높고, 용병·청부업 종사자가 많아 세간의 인식이 매우 나쁘다.',
    pas:'발현 부담 50 이상이면 공격력 +20%, 반동 시작 60→75 / 휴식·정화로 줄어드는 부담 -30%',style:'고부담 유지·강공',
    mod:d=>{d.ibex=true;d.recoilAt=75;d.ventMul*=.7},
    sk:{n:'산양뿔 들이받기',cost:14,cd:2,d:'공격력×(1.2 + 발현 부담÷100). 부담이 높을수록 강해진다.'}}
};
const BASE_RACES=['shia','cornel','meren','varg'];
const RACE_UNLOCK={ /* [게임 오리지널] 해금 조건 */
  tabi:{d:'탐사 1회 완수',f:h=>[h.stat.clears,1]},
  lep:{d:'이상체 12종 발견',f:h=>[Object.keys(h.codex.seen).length,12]},
  meraki:{d:'유물 12종 발견',f:h=>[h.codex.relics.length,12]},
  ibex:{d:'흉형 이상 5체 처치',f:h=>[(h.stat.kills['흉형']||0)+(h.stat.kills['지형']||0),5]}
};

/* ---------- 소모품 ---------- */
const ITEMS={
  bandage:{n:'응급 붕대',d:'체력 30 회복',price:12,out:true},
  cap_heal:{n:'회복 캡슐',d:'체력 25 회복, 발현 부담 +10',price:25,out:true,cap:true},
  cap_purify:{n:'정제 캡슐',d:'발현 부담 -25',price:18,out:true},
  cap_vigor:{n:'활력 캡슐',d:'3턴간 공격력 +40%, 발현 부담 +15',price:30,cap:true},
  cap_rage:{n:'폭주 캡슐',d:'다음 공격 피해 ×2.5, 발현 부담 +25',price:40,cap:true},
  cap_iron:{n:'경화 캡슐',d:'이번 전투 방어력 +2, 발현 부담 +12',price:28,cap:true},
  grenade:{n:'파편 투척구',d:'방어 무시 피해 20',price:20},
  oil:{n:'잔해 기름',d:'적에게 출혈 4 부여',price:18},
  flare:{n:'조명탄',d:'적의 다음 3행동 공개, 은신한 적을 드러냄',price:15},
  smoke:{n:'연막탄',d:'도주 확정 (최종 위협 제외)',price:25}

const U={ov:null,modal:null,setup:Object.assign({},DEF_SETUP),codexTab:'enemy',edit:false,itemSheet:false,skillSheet:false,fx:{},openEnemy:null,
  gearTab:'equip',gsel:null,gmode:null,gpick:null,craft:null,atTab:'craft',facTab:'fac',heatSel:0,contractSel:null,regionSel:null,showMap:true,toast:null};

function save(){try{const s=JSON.stringify(S);try{localStorage.setItem(SAVE_KEY,s);}catch(e){memSave=s;}}catch(e){}}
function mergeDef(def,src){ /* 누락된 키를 기본값으로 채운다 */
  if(Array.isArray(def)||typeof def!=='object'||def===null) return (src===undefined||src===null)?def:src;
  const out={};for(const k of Object.keys(def)){out[k]=(src&&typeof src==='object'&&k in src)?mergeDef(def[k],src[k]):def[k];}
  if(src&&typeof src==='object') for(const k of Object.keys(src)) if(!(k in out)) out[k]=src[k];
  return out;}
function load(){
  let raw=null,old=null;
  try{raw=localStorage.getItem(SAVE_KEY);}catch(e){}
  if(!raw)raw=memSave;
  if(!raw){try{old=localStorage.getItem(OLD_KEY);}catch(e){}}
  if(!raw&&!old){S=defState();return;}
  try{
    const o=JSON.parse(raw||old);
    if(!o||!o.hero||!o.home||!RACES[o.hero.race])throw 0;
    if(o.v===1)S=migrateV1(o);
    else if(o.v===2)S=mergeDef(defState(),o);
    else throw 0;
    normalizeState();
    U.setup={name:S.hero.name,race:S.hero.race,pers:S.hero.pers,past:S.hero.past};
    if(old&&!raw)save(); /* 이전 결과를 v2 키에 저장 (v1 키는 백업으로 남긴다) */
  }catch(e){console.error('load error',e);S=defState();}
}
function normalizeState(){
  const h=S.home;
  if(!GRADES.includes(S.hero.grade))S.hero.grade='자';
  if(!RACES[S.hero.race])S.hero.race='shia';
  BASE_RACES.forEach(r=>{if(!h.races.includes(r))h.races.push(r);});
  if(!h.races.includes(S.hero.race))h.races.push(S.hero.race);
  if(!Array.isArray(h.gear))h.gear=[];
  h.gear=h.gear.filter(g=>g&&FORMS[g.f]).map(normGear);
  SLOT_ORDER.forEach(s=>{const g=h.gear.find(x=>x.uid===h.equip[s]);if(!g||FORMS[g.f].s!==s)h.equip[s]=null;});
  if(!h.equip.w){const g=h.gear.find(x=>FORMS[x.f].s==='w');if(g)h.equip.w=g.uid;else{const k=mkGear(LEGACY_GEAR.w_knife,h);h.gear.push(k);h.equip.w=k.uid;}}
  ['tech','miles','board'].forEach(k=>{if(!Array.isArray(h[k]))h[k]=[];});
  if(!Array.isArray(h.train.own))h.train.own=[];if(!Array.isArray(h.train.eq))h.train.eq=[];
  h.train.eq=h.train.eq.filter(id=>TRAIN[id]&&h.train.own.includes(id));
  h.board=h.board.filter(c=>c&&CONTRACTS[c.id]);
  ['relics','bosses','syn','lore','detail'].forEach(k=>{if(!Array.isArray(h.codex[k]))h.codex[k]=[];});
  if(S.screen==='run'&&(!S.run||!S.run.sub))S.screen='hq';
  if(S.screen==='summary'&&!S.summary)S.screen='hq';

function genMap(region,heat){

    const w=role==='entry'||role==='prep'?rnd(2,3):(chance(.15)?2:rnd(3,4));

      if(role==='prep')return true;

      if(t==='cursed')return ri>=3&&ri<=n-3&&cnt.cursed<2;

      if(t==='quest')return ri>=1&&ri<=n-5&&cnt.quest<1;
      if(t==='shortcut')return ri>=1&&ri<=n-4&&cnt.shortcut<2;
      if(t==='merchant')return ri>=1&&cnt.merchant<2;
      if(t==='atelier')return ri>=2;
      if(t==='lab')return ri>=2&&cnt.lab<2;
      if(t==='special')return ri>=1;

    const W=NODE_W[role]||NODE_W.normal;

    prevRest=role!=='prep'&&types.includes('rest');

  }
  /* 보정: 중반(2 ~ 준비 구역 전)에 휴식처·보급소가 하나도 없으면 하나 넣는다 */

  }));

function genShop(){
  const r=S.run,d=D(),R=REGIONS[r.region];

  return{relics:rel.map(id=>({id,p:Math.round(RP[RELICS[id].r]*pm)})),items:items.map(id=>({id,p:Math.round(ITEMS[id].price*1.2*pm)})),
    gear:{spec:rollGearSpec('shop',r.region),p:Math.round(70*pm)},perk:pickOne(Object.keys(PERKS).filter(id=>!PERKS[id].legacy&&!r.perks.includes(id)))||null,perkP:Math.round(45*pm),
    sold:{},pm,curseP:Math.round(60*pm),healP:Math.round(30*pm),ventP:Math.round(25*pm)};}

/* =========================================================
   흐름 제어
   ========================================================= */
function evPool(kind){
  const home=S.home,r=S.run;
  const ok=id=>{const e=EV[id];const k=e.kind||'event';if(k!==kind)return false;
    if(e.reg&&!e.reg.includes(r.region))return false;if(e.ext&&!home.unlock.evExt)return false;
    if(e.need&&!home.unlock[e.need])return false;if(e.needRun&&(!r.flags[e.needRun]||r.flags[e.needRun+'_done']))return false;
    if(e.minBurden&&r.burden<e.minBurden)return false;return true;};
  let ids=Object.keys(EV).filter(ok);
  if(!ids.length&&kind!=='event')ids=Object.keys(EV).filter(id=>{const e=EV[id];return !e.kind&&(!e.reg||e.reg.includes(r.region))&&!e.need&&!e.ext;});
  const chain=ids.filter(id=>EV[id].needRun&&!r.seenEv.includes(id));
  if(chain.length&&chance(.7))return chain;
  const fresh=ids.filter(id=>!r.seenEv.includes(id));
  return fresh.length?fresh:ids;}
function advance(){
  const r=S.run;r.result=null;r.event=null;
  const c=curNode();
  if(c&&c.row>=lastRow()){finishRun('clear');return;}
  const opts=options();
  if(!opts.length){finishRun('clear');return;}
  r.stage=opts[0].row;r.sub='choose';}
function proceed(){
  const r=S.run;r.result=null;
  const nx=r.pending.shift();
  if(!nx){advance();return;}
  if(nx==='perk'||nx==='perkE'){offerPerks();return;}
  if(nx.relic){offerRelics(nx.relic);return;}
  if(nx.fight){startCombat(nx.fight,nx.opts);return;}
  advance();}
function offerPerks(){
  const r=S.run,t2=S.home.unlock.perkT2;
  const pool=Object.keys(PERKS).filter(id=>!PERKS[id].legacy&&!r.perks.includes(id)&&(PERKS[id].t===1||t2));
  if(!pool.length){proceed();return;}
  r.perkOffer=shuffle(pool.slice()).slice(0,3);r.perkSel=null;r.sub='perk';}
function envOnMove(){
  const r=S.run,d=D(),env=REGIONS[r.region].env;
  if(env==='spore'&&!d.sporeImmune){addBurden(4,'env');}
}
function enterNode(id){
  const r=S.run;if(r.sub!=='choose')return;
  const node=options().find(n=>n.id===id);if(!node)return;
  r.pos=node.id;r.skip=false;r.stage=node.row;r.visited.push(node.id);node.rev=true;
  envOnMove();
  const t=node.type;
  if(t==='combat'||t==='elite'||t==='boss'){startCombat(node.enemy,{elite:t==='elite',boss:t==='boss',cond:node.cond,nest:node.nest});return;}
  if(t==='supply'){
    const x=mkx();x.say('버려진 보급 거점을 발견했다.');x.yeon(rnd(12,24));x.item();if(chance(.5))x.item();x.mat('alloy',rnd(1,2));if(chance(.3))x.rec(1);
    r.result={title:'보급소',lines:x.out};r.pending=[];r.sub='result';return;}
  if(t==='rest'){r.event={id:'__rest'};r.sub='event';return;}
  if(t==='merchant'){if(!node.shop)node.shop=genShop();S.home.stat.shops++;r.sub='shop';return;}
  if(DYN[t]){r.event={id:'__dyn',kind:t,data:DYN_INIT[t]()};r.sub='event';return;}
  const kind=t==='research'?'research':t==='vault'?'vault':t==='special'?'special':'event';
  const pool=evPool(kind);const eid=pickOne(pool);r.seenEv.push(eid);
  r.event={id:eid};r.sub='event';}
function evData(){const r=S.run;if(!r.event)return null;if(r.event.id==='__rest')return REST_EV;if(r.event.id==='__dyn')return DYN[r.event.kind](r.event.data);return EV[r.event.id];}
function visChoices(ev){const race=S.hero.race;return ev.ch.filter(c=>(!c.rc||c.rc.includes(race))&&(!c.if||c.if()));}
function resolveEvent(i){
  const r=S.run;if(r.sub!=='event'||!r.event)return;
  const ev=evData();if(!ev)return;const ch=visChoices(ev)[i];if(!ch)return;
  const x=mkx();ch.go(x);
  r.result={title:ev.t,lines:x.out,choice:ch.l,gearNew:x.gearNew};r.pending=x.after.slice();r.event=null;r.sub='result';}
function questEvent(c,victory){
  const r=S.run,q=r.quest;if(!q||q.done||!victory)return null;const Q=QUESTS[q.id];
  let inc=0;
  if(q.id==='hunt2')inc=1;else if(q.id==='fast'&&c.round<=4)inc=1;else if(q.id==='noitem'&&!c.usedItem)inc=1;
  else if(q.id==='elite'&&(c.elite||c.boss))inc=1;else if(q.id==='hot'&&r.burden>=50)inc=1;
  if(!inc)return null;q.p+=inc;
  if(q.p>=Q.goal){q.done=true;return Q;}return null;}

function finishRun(kind,extraLines,lastLog){
  const r=S.run;if(!r)return;
  const home=S.home,Rw=CFG.reward,d=D(),lines=[],R=REGIONS[r.region];
  let y=r.loot.yeon,rec=r.loot.rec,keepGear=true,keepItems=true,matRate=1,keepRem=true,title;
  if(extraLines)lines.push(...extraLines);
  const bossKilled=kind==='clear'&&r.lastBoss;
  if(kind==='clear'){
    title='탐사 완수';
    const hm=1+heatRw(r.heat);
    const bonusY=Math.round(40*R.rw*hm),bonusR=Math.round((6+2*r.region)*hm);
    y+=bonusY;rec+=bonusR;lines.push('완수 보상: 연 +'+bonusY+', 조사 기록 +'+bonusR+(r.heat?' (위험도 '+r.heat+')':''));
    home.stat.clears++;home.stat.rclear[r.region]=(home.stat.rclear[r.region]||0)+1;
    if(r.region===1&&!home.unlock.region2){home.unlock.region2=true;}
    REGION_IDS.forEach(id=>{if(id!==r.region&&REGIONS[id].unlock&&regionOpen(id)&&!home.codex['ro'+id]){home.codex['ro'+id]=1;lines.push('새로운 탐사 지역이 열렸다: '+REGIONS[id].n+(regionGradeOk(id)?'':' (엽사 등급 '+GRADES[REGIONS[id].grade]+' 이상 필요)'));}});
    const ph=home.heat[r.region]|0;if(r.heat>=ph&&ph<CFG.maxHeat){home.heat[r.region]=r.heat+1;lines.push('위험도 '+(r.heat+1)+' 도전이 열렸다 ('+R.n+').');}
    home.stat.maxHeat=Math.max(home.stat.maxHeat|0,r.heat|0);
    if(r.contract){const C=CONTRACTS[r.contract];if(C&&C.ck(r)){const m=1+.2*(home.fac.board||0);const cy=Math.round((C.rw.yeon||0)*m),cr=Math.round((C.rw.rec||0)*m);
        y+=cy;rec+=cr;if(C.rw.mats)for(const k in C.rw.mats)r.loot.mats[k]=(r.loot.mats[k]||0)+C.rw.mats[k];
        lines.push('의뢰 달성 「'+C.n+'」: '+[cy?'연 +'+cy:'',cr?'기록 +'+cr:'',C.rw.mats?matLine(C.rw.mats):''].filter(Boolean).join(', '));}
      else if(C)lines.push('의뢰 미달성 「'+C.n+'」');}
    if(r.flags.argo){y+=40;r.loot.mats.brine=(r.loot.mats.brine||0)+3;lines.push('아르고 사례금: 연 +40, 염정 +3');}
    lines.push('');
    if(r.region===1){

  else if(k==='noitem'){const y=15;r.loot.yeon+=y;addMat('scrap',2);lines.push('조건 달성(맨손): 연 +15, 소재 +2');}
  else if(k==='hot'){addMat('marrow',1);lines.push('조건 달성(고농도): 흉형 골수 +1');}
  else if(k==='racial'){const y=15;r.loot.yeon+=y;r.loot.rec+=4;lines.push('조건 달성(능력 마무리): 조사 기록 +4, 연 +15');}}
function victory(){
  const r=S.run,c=r.combat,e=c.e,b=ENEMIES[e.id],d=D(),R=REGIONS[r.region];
  if(!c||c.over)return;c.over=true;
  const lines=['['+e.name+']을(를) 쓰러뜨렸다.'];
  const hm=1+heatRw(r.heat);
  let y=Math.round(rnd(b.y[0],b.y[1])*R.rw*d.yeonMul*hm);if(c.contain)y=Math.round(y*.6);
  if(d.syn.greed>1)y+=12;if(d.trophy&&(c.elite||c.boss)){y+=30;}
  const rc=Math.max(1,Math.round(rnd(b.rec[0],b.rec[1])*d.recMul*hm*(c.contain?.6:1)));
  r.loot.yeon+=y;r.loot.rec+=rc;lines.push('연 +'+y,'조사 기록 +'+rc);
  /* 소재 */
  const mats={};const am=(k,n)=>{const a=addMat(k,n);if(a)mats[k]=(mats[k]||0)+a;};
  const regm=R.mat;
  if(c.boss){am('scrap',6);am('marrow',2);const cr=(e.gr==='지형'?2:1)+(r.heat>=3?1:0);am('crystal',c.contain?1:cr);am(regm||'alloy',3);}
  else if(c.elite){am('scrap',rnd(3,4));am(b.mat||'fiber',2);if(e.gr==='흉형'||r.heat>=2||chance(.35))am('marrow',1);if(regm&&chance(.5))am(regm,1);}
  else{am('scrap',rnd(1,2));if(chance(.45))am(b.mat||'fiber',1);if(regm&&chance(.3))am(regm,1);}
  if(d.trophy&&(c.elite||c.boss))am('scrap',2);
  if(c.elite&&d.syn.hunt>1){am(pickOne(['alloy','shell','fiber']),2);}
  if(Object.keys(mats).length)lines.push('소재: '+matLine(mats));
  /* 잔해 */
  if(REMS[e.id]){let p=c.boss?1:c.elite?.5:.06;if(R.env==='watch')p*=2;if(chance(p)){addRem(e.id);lines.push('잔해 확보: '+REMS[e.id].n);}}
  const cx=S.home.codex;cx.kills[e.id]=(cx.kills[e.id]||0)+1;
  const st=S.home.stat;st.total++;st.kills[e.gr]=(st.kills[e.gr]||0)+1;
  if(c.elite)r.cs.elite++;if(e.gr==='흉형'||e.gr==='지형')r.cs.high++;
  if(d.killHeal){const h=healRun(d.killHeal);if(h)lines.push('처치 회복 +'+h);}
  if(d.bleedKillVent&&e.bleed>0)addBurden(-d.bleedKillVent,'raw');
  if(d.fightVent){const a=addBurden(-d.fightVent,'raw');if(a)lines.push('배기 밸브: 발현 부담 '+a);}
  if(c.elite||c.boss){const it=randItem();if(addRunItem(it))lines.push(ITEMS[it].n+' 획득');}
  else if(chance(.25)){const it=randItem();if(addRunItem(it))lines.push(ITEMS[it].n+' 획득');}
  if(d.recycle&&chance(Math.min(.9,d.recycle))){const it=randItem();if(addRunItem(it))lines.push('재활용: '+ITEMS[it].n);}
  const gearNew=[];
  const gp=c.boss?1:c.elite?.45:.05;
  if(chance(gp)){const g=dropGear(c.boss?'boss':c.elite?'elite':'normal',e.id);gearNew.push(g.uid);lines.push('장비 확보: '+RAR[g.r].n+' '+g.n+' (지금 장착 가능)');}
  if(c.cond&&CONDS[c.cond]){if(CONDS[c.cond].ck(c))condReward(c.cond,lines);else lines.push('조건 미달성: '+CONDS[c.cond].d);}
  const qd=questEvent(c,true);
  const pend=[];
  if(r.quest&&!qd&&!r.quest.done)lines.push('현장 의뢰 진행: '+QUESTS[r.quest.id].n+' '+r.quest.p+'/'+QUESTS[r.quest.id].goal);
  if(qd){lines.push('현장 의뢰 달성: '+qd.n);
    if(qd.rw==='relic')pend.push({relic:'quest'});
    else if(qd.rw==='relic+'){pend.push({relic:'quest'});addMat('marrow',1);lines.push('흉형 골수 +1');}
    else if(qd.rw==='mats'){addMat('marrow',1);addMat('scrap',4);lines.push('흉형 골수 +1, 잔해 조각 +4');}
    else{addMat('marrow',2);addMat(regm||'fiber',2);lines.push('흉형 골수 +2, '+MATS[regm||'fiber'].n+' +2');}}
  if(c.boss&&r.burden>=50)r.cs.hotBoss=1;
  if(c.boss){if(!cx.bosses.includes(e.id)){cx.bosses.push(e.id);const br='b_'+e.id;if(RELICS[br])lines.push('보스 유물 「'+RELICS[br].n+'」이(가) 이후 탐사의 유물 후보에 추가되었다.');}}
  r.combat=null;if(r.flags.escort>0)r.flags.escort--;
  if(c.boss&&!c.contain){r.lastBoss=e.id;S.home.lastBoss[r.region]=e.id;r.loot.gear=r.loot.gear;return finishRun('clear',lines);}
  if(c.contain){const br='b_'+e.id;if(RELICS[br]&&(r.relics[br]||0)<1){gainRelic(br);lines.push('보스 유물 획득: '+RELICS[br].n+' — '+RELICS[br].d(1));}else pend.push({relic:'cursed'});}
  r.result={title:'전투 승리',lines,gearNew};
  r.pending=pend.concat(c.contain?[]:c.cursed?[{relic:'cursed'}]:c.elite?[{relic:'elite'}]:['perk']);
  r.sub='result';}
function defeat(){
  const r=S.run;if(!r||r.sub==='done')return;
  if(r.combat)r.combat.over=true;
  const last=r.combat?r.combat.log.slice(-4).map(l=>l.t):[];
  finishRun('fail',null,last);}

function healFreeTarget(){return Math.ceil(D().maxHP*Math.min(1,.5+.1*S.home.upg.rest));}
function fullHealCost(){const d=D();const miss=Math.max(0,d.maxHP-S.hero.hp);return Math.ceil(miss*1.2*(1-.15*S.home.upg.rest));}
function promoStatus(){const gi=gradeIdx();const nx=PROMO[gi+1];if(!nx)return{done:true};
  const st=S.home.stat;const need=[['누적 퇴치',st.total,nx.total]];
  for(const g in nx.need)need.push([g+' 퇴치',st.kills[g]||0,nx.need[g]]);
  if(nx.regions)need.push(['완수한 지역 수',Object.keys(st.rclear).length,nx.regions]);
  return{done:false,next:GRADES[gi+1],need,ok:need.every(n=>n[1]>=n[2])};}
function clampHero(){const d=D();S.hero.hp=Math.max(1,Math.min(S.hero.hp,d.maxHP));}
function wsMul(){return 1-.08*(S.home.fac.workshop||0);}
function canPay(c){const h=S.home;if(h.yeon<(c.yeon||0)||h.rec<(c.rec||0))return false;for(const k in c.mats||{})if((h.mats[k]||0)<c.mats[k])return false;if(c.rem&&!((h.rems[c.rem]||0)>0))return false;return true;}
function doPay(c){const h=S.home;h.yeon-=c.yeon||0;h.rec-=c.rec||0;for(const k in c.mats||{})h.mats[k]-=c.mats[k];if(c.rem){h.rems[c.rem]--;if(h.rems[c.rem]<=0)delete h.rems[c.rem];}}
function costTxt(c){const p=[];if(c.yeon)p.push('연 '+c.yeon);if(c.rec)p.push('기록 '+c.rec);for(const k in c.mats||{})if(c.mats[k])p.push(MATS[k].n+' '+c.mats[k]);if(c.rem)p.push('잔해 '+REMS[c.rem].n);return p.join(' · ');}
function lackTxt(c){const h=S.home,p=[];if(h.yeon<(c.yeon||0))p.push('연');if(h.rec<(c.rec||0))p.push('기록');for(const k in c.mats||{})if((h.mats[k]||0)<c.mats[k])p.push(MATS[k].n);if(c.rem&&!(h.rems[c.rem]>0))p.push('잔해');return p.length?'부족: '+p.join(', '):'';}

function craftDefault(){return{f:'blade',m:'alloy',r:0,rem:null,main:['atk'],sub:[],flaw:null};}
function craftLimits(cf){const R=RAR[cf.r];return{main:R.main+(cf.flaw?1:0),sub:R.sub};}
function craftCost(cf){const R=RAR[cf.r];const ws=wsMul();
  const yeon=Math.round((R.yeon+15*cf.main.length+20*cf.sub.length+(cf.rem?30:0))*ws);
  const mats={};mats[cf.m]=R.mat;if(R.scrap)mats.scrap=(mats.scrap||0)+R.scrap;if(R.marrow)mats.marrow=(mats.marrow||0)+R.marrow;if(R.crystal)mats.crystal=(mats.crystal||0)+R.crystal;
  return{yeon,mats,rem:cf.rem||null};}
function craftProblems(cf){const p=[],F=FORMS[cf.f],R=RAR[cf.r],lim=craftLimits(cf);
  if(!F||!hasTech(F.tech))p.push('형태 미해금');if(!BASEMAT[cf.m]||!hasTech(BASEMAT[cf.m].tech))p.push('소재 미해금');
  if(!hasTech(R.tech))p.push('등급 미해금');if(cf.rem&&(!R.rem||!hasTech('t_rem')))p.push('잔해 결합 불가');
  if(cf.flaw&&!hasTech('t_flaw'))p.push('부작용 각인 미해금');
  if(!cf.main.length)p.push('주요 옵션을 1개 이상 고르세요');if(cf.main.length>lim.main)p.push('주요 옵션 초과');if(cf.sub.length>lim.sub)p.push('부가 옵션 초과');
  if(cf.sub.some(k=>OPT_SUB[k].adv&&!hasTech('t_subPlus')))p.push('부가 옵션 확장 필요');
  if(S.home.gear.length>=CFG.gearCap)p.push('장비 보관함이 가득 찼다');
  if(!canPay(craftCost(cf)))p.push(lackTxt(craftCost(cf)));
  return p;}
function previewGear(cf){return{uid:'preview',f:cf.f,r:cf.r,n:autoName(cf),m:cf.m,rem:cf.rem,main:cf.main.slice(),sub:cf.sub.slice(),flaw:cf.flaw?[cf.flaw]:[],lv:0};}
function fitCraft(cf){const lim=craftLimits(cf);cf.main=cf.main.slice(0,lim.main);cf.sub=cf.sub.slice(0,lim.sub);if(!RAR[cf.r].rem)cf.rem=null;}

function modMax(){return hasTech('t_mod3')?8:hasTech('t_mod2')?5:2;}
function upCost(g){const ws=wsMul();return{yeon:Math.round((40*Math.pow(g.lv+1,1.4)+20*Math.min(3,g.r))*ws),mats:{scrap:(g.lv+1)*2}};}
function swapCost(g){return{yeon:Math.round((60+20*Math.min(3,g.r))*wsMul()),mats:{fiber:2}};}
function addSubCost(){return{yeon:Math.round(150*wsMul()),mats:{marrow:1}};}
function purgeCost(){return{yeon:Math.round(200*wsMul()),mats:{crystal:1}};}
function dismantleGain(g){const w=1+.2*(S.home.fac.workshop||0);const o={scrap:Math.round((2+Math.min(3,g.r)*2)*w)};if(g.m&&['alloy','shell','fiber','brine','spore','circuit','ash','seal'].includes(g.m))o[g.m]=Math.max(1,Math.floor(RAR[Math.min(3,g.r)].mat/2*w));if(g.r>=2)o.marrow=1;return o;}

  askReset(){U.modal={title:'데이터 초기화',text:'저장된 모든 진행 상황(영구 강화, 도감, 장비, 시설)이 삭제됩니다.',ok:'doReset',okL:'초기화'};render();},
  doReset(){S=defState();refreshBoard();U.setup=Object.assign({},DEF_SETUP);U.modal=null;U.ov=null;U.craft=null;try{localStorage.removeItem(OLD_KEY);}catch(e){}commit();},
  modalClose(){U.modal=null;render();},
  toHQ(){if(S.screen!=='summary')return;S.summary=null;S.screen='hq';U.ov=null;commit();},
  /* 탐사 */
  choose(el){enterNode(el.dataset.id);commit();},
  withdraw(){const r=S.run;if(!r||r.sub!=='choose')return;const d=D(),R=REGIONS[r.region];
    const rate=d.fullWithdraw?1:R.env==='watch'?.5:CFG.reward.withdrawYeon;
    const y=Math.floor(r.loot.yeon*rate),c=Math.floor(r.loot.rec*rate);
    U.modal={title:'철수하시겠습니까?',text:'현재 확보한 보상: 연 '+r.loot.yeon+', 기록 '+r.loot.rec+', 장비 '+r.loot.gear.length+'점.\n철수하면 연 '+y+', 기록 '+c+'와 장비·잔해·소재 일부를 가지고 돌아갑니다. 완수하면 전부 가져오고 완수 보상을 받습니다. 쓰러지면 대부분 잃습니다.',ok:'doWithdraw',okL:'철수'};render();},
  doWithdraw(){const r=S.run;U.modal=null;if(!r||r.sub!=='choose'){render();return;}finishRun('withdraw');commit();},
  evChoice(el){resolveEvent(+el.dataset.i);commit();},
  cont(){const r=S.run;if(!r||r.sub!=='result')return;proceed();commit();},
  perkSel(el){const r=S.run;if(!r||r.sub!=='perk')return;r.perkSel=el.dataset.id;render();},
  perkOk(){const r=S.run;if(!r||r.sub!=='perk'||!r.perkSel||!r.perkOffer.includes(r.perkSel))return;
    const id=r.perkSel;r.perks.push(id);r.perkOffer=null;r.perkSel=null;
    if(PERKS[id].pick)PERKS[id].pick();
    r.hp=Math.min(r.hp,D().maxHP);r.result=null;proceed();commit();},
  perkSkip(){const r=S.run;if(!r||r.sub!=='perk')return;r.perkOffer=null;r.perkSel=null;addMat('scrap',2);r.loot.yeon+=10;proceed();commit();},
  relicSel(el){const r=S.run;if(!r||r.sub!=='relic')return;r.relicSel=el.dataset.id;render();},
  relicOk(){const r=S.run;if(!r||r.sub!=='relic'||!r.relicSel||!r.relicOffer.includes(r.relicSel))return;gainRelic(r.relicSel);r.relicOffer=null;r.relicSel=null;r.hp=Math.min(r.hp,D().maxHP);proceed();commit();},
  relicSkip(){const r=S.run;if(!r||r.sub!=='relic')return;r.relicOffer=null;r.relicSel=null;r.loot.yeon+=r.relicSrc==='start'?15:20;proceed();commit();},
  shopBuy(el){const r=S.run,n=curNode();if(!r||r.sub!=='shop'||!n||!n.shop)return;const sh=n.shop,k=el.dataset.k,i=+el.dataset.i;const key=k+i;if(sh.sold[key]&&k!=='vent'&&k!=='heal')return;
    const pay=p=>{if(r.loot.yeon<p)return false;r.loot.yeon-=p;return true;};
    if(k==='relic'){const it=sh.relics[i];if(!it||(r.relics[it.id]||0)>=RELICS[it.id].max||!pay(it.p))return;gainRelic(it.id);sh.sold[key]=1;}
    else if(k==='item'){const it=sh.items[i];if(!it||totalItems(r.inv)>=carryMax()||!pay(it.p))return;addRunItem(it.id);sh.sold[key]=1;}
    else if(k==='gear'){if(!pay(sh.gear.p))return;const g=mkGear(sh.gear.spec);r.loot.gear.push(g);sh.sold[key]=1;U.toast=g.n+' 구입 — 상태 화면에서 바로 장착할 수 있다.';}
    else if(k==='perk'){if(!sh.perk||r.perks.includes(sh.perk)||!pay(sh.perkP))return;r.perks.push(sh.perk);if(PERKS[sh.perk].pick)PERKS[sh.perk].pick();sh.sold[key]=1;}
    else if(k==='curse'){const c=Object.keys(r.relics).find(id=>RELICS[id].curse);if(!c||!pay(sh.curseP))return;delete r.relics[c];}
    else if(k==='vent'){if(r.burden<=0||!pay(sh.ventP))return;addBurden(-30,'x');}
    else if(k==='heal'){const d=D();if(r.hp>=d.maxHP||!pay(sh.healP))return;healRun(Math.round(d.maxHP*.3/d.healMul));}
    r.hp=Math.min(r.hp,D().maxHP);commit();},
  shopLeave(){const r=S.run;if(!r||r.sub!=='shop')return;advance();commit();},
  cAtk(){COMBAT.atk();commit();},cDef(){COMBAT.def();commit();},cRacial(){COMBAT.racial();commit();},cFlee(){COMBAT.flee();commit();},
  cItems(){U.itemSheet=!U.itemSheet;U.skillSheet=false;render();},
  cSkills(){U.skillSheet=!U.skillSheet;U.itemSheet=false;render();},
  cSkill(el){COMBAT.skill(el.dataset.id);commit();},
  cItem(el){COMBAT.item(el.dataset.id);commit();},
  useOut(el){const r=S.run;if(!r||r.sub!=='choose')return;const id=el.dataset.id,it=ITEMS[id];if(!it||!it.out||!(r.inv[id]>0))return;
    r.inv[id]--;if(!r.inv[id])delete r.inv[id];const d=D();const P=1+d.itemPow+(it.cap?d.capPow:0);
    if(id==='bandage')healRun(30*P);else if(id==='cap_heal'){healRun(25*P);addBurden(10,'cap');r.capsules++;}else if(id==='cap_purify')addBurden(-25*P*(REGIONS[r.region].env==='spore'?1.4:1),'x');
    r.cs.items++;commit();}
};
function commit(){save();render();}

const rarCls=r=>r===0&&false?'':'rar'+r;
function gradeChip(g){const need=REC_GRADE[g];return '<span class="chip r">'+g+'</span>'+(need?'<span class="chip">권장 '+need+' 이상</span>':'');}

function topbar(){
  const h=S.home;const r=S.run;

function footBars(){
  const r=S.run,d=D();

  return '<div><div class="lab"><span>체력</span><span>'+r.hp+' / '+d.maxHP+'</span></div>'+bar(r.hp,d.maxHP,'hp')+'</div>'+
    '<div><div class="lab"><span>발현 부담'+(r.burden>=d.recoilAt?' <span style="color:var(--red)">'+(r.burden>=100?'과부하':hot?'위험':'불안정')+'</span>':'')+'</span><span>'+r.burden+' / 100</span></div>'+bar(r.burden,100,'bu'+(hot?' hot':''))+'</div>';}
function relicChips(compact){const r=S.run,d=D();const ids=Object.keys(r.relics);
  const syn=synList(d);
  let h='';
  if(!ids.length&&!r.perks.length)return '<div class="xs dim">유물·임시 강화 없음</div>';
  h+='<div class="xs"><span class="dim">유물 '+relicCount(r)+' · 강화 '+r.perks.length+'</span>'+(syn.length?' · <span class="syn">'+syn.map(s=>'<b>'+s.n+(s.tier===2?' Ⅱ':' Ⅰ')+'</b>').join(' ')+'</span>':'')+'</div>';
  if(!compact)h+='<div style="margin-top:3px">'+ids.map(id=>'<span class="chip '+(RELICS[id].curse?'r':'b')+'">'+RELICS[id].n+(r.relics[id]>1?' ×'+r.relics[id]:'')+'</span>').join('')+'</div>';
  return h;}
function view(){
  let h=topbar();

function intentText(it,c){
  const e=c.e;
  const t=mcall(c,'itxt',it);if(t)return t;
  const dmg=()=>intentDmg(it);
  switch(it.t){
    case 'stall':return it.lab;
    case 'guard':return it.lab+' <span class="dim">(이번 턴 받는 피해 절반'+(e.ms&&ENEMIES[e.id].mech==='gardener'&&e.phase>=1?' · 때리면 25% 반사':'')+')</span>';
    case 'heal':return it.lab+' <span class="dim">(체력 약 '+Math.round((it.h||.1)*100)+'% 회복)</span>';
    case 'burden':return it.lab+' <span class="dim">(약 '+dmg()+' 피해 · 발현 부담 +'+it.b+(it.pierce?' · 방어 관통':'')+')</span>';
    case 'multi':return it.lab+' <span class="dim">('+dmg()+'×'+(it.n||2)+' 피해)</span>';
    case 'charge':{const nx=c.q[1];return it.lab+' <span class="dim">(힘을 모은다 · 다음 턴 '+(nx&&nx.t==='release'?nx.lab+' 약 '+intentDmg(nx):'강한 공격')+')</span>';}
    case 'release':return it.lab+' <span class="dim">(약 '+dmg()+' 피해 · 강한 공격)</span>';
    case 'hide':return it.lab+' <span class="dim">(다음 턴 은신 — 장창·총·조명탄 외 피해 70% 감소 · 이어서 기습)</span>';
    case 'ambush':return it.lab+' <span class="dim">(기습 약 '+dmg()+' 피해 · 방어하면 막고 약점 노출)</span>';
    case 'seal':return it.lab+' <span class="dim">(약 '+dmg()+' 피해 · 다음 턴 '+ACTN[it.block||'item']+' 봉인)</span>';
    case 'drain':return it.lab+' <span class="dim">(약 '+dmg()+' 피해 · 피해의 '+Math.round((it.h||.5)*100)+'% 흡수)</span>';
    case 'timeout':return it.lab;
    default:return it.lab+' <span class="dim">(약 '+dmg()+' 피해)</span>';
  }}

function vRelic(){
  const r=S.run,d=D();
  const src={start:'출발 준비 — 시작 유물',elite:'정예 처치 보상',vault:'보관함에서 찾은 유물',odd:'목소리가 건넨 것',quest:'의뢰 보상',cursed:'보물고의 유물',shop:'거래상'}[r.relicSrc]||'유물';
  const cards=r.relicOffer.map(id=>{const R=RELICS[id];const k=(r.relics[id]||0);const sel=r.relicSel===id;
    const synTxt=R.tags.map(t=>{const now=d.tags[t]||0;const need=SYN_NEED.map(n=>Math.max(2,n-d.synDiscount));const after=now+(k?0:1);
      const up=(after>=need[1]&&now<need[1])?'Ⅱ 발동!':(after>=need[0]&&now<need[0])?'Ⅰ 발동!':'';return '<span class="chip'+(up?' g':'')+'">'+SYN[t].n+' '+now+'→'+after+(up?' '+up:'')+'</span>';}).join('');
    return '<button class="card bd'+Math.min(4,R.r)+(sel?' sel':'')+'" data-act="relicSel" data-id="'+id+'"><div class="ch"><span class="rar'+Math.min(4,R.r)+'">'+R.n+'</span><span class="dim sm">'+RELIC_R[R.r]+(k?' · 보유 ×'+k+' → ×'+(k+1):'')+'</span></div>'+
      '<div class="cd" style="color:var(--tx)">'+R.d(k+1)+'</div><div style="margin-top:4px">'+synTxt+'</div></button>';}).join('');
  return '<div class="scr"><div><h2 style="margin:0">유물 선택</h2><p class="sm dim">'+src+'. 유물은 이번 탐사 동안 전투 규칙을 바꾼다. 같은 태그를 2·4개 모으면 시너지가 발동한다. 같은 유물을 다시 고르면 중첩 강화된다.'+TAG.o+'</p></div>'+
    cards+synPanel(d)+'</div>'+
    '<div class="foot">'+footBars()+'<div class="grid2"><button class="btn" data-act="relicSkip">건너뛰기<small>연 +'+(r.relicSrc==='start'?15:20)+'</small></button><button class="btn primary'+(r.relicSel?'':' off')+'" data-act="relicOk">선택 확정</button></div></div>';}
function vShop(){
  const r=S.run,n=curNode(),sh=n&&n.shop;if(!sh){r.sub='choose';return vChoose();}
  const y=r.loot.yeon;const d=D();
  const b=(k,i,label,small,p,dis)=>'<button class="btn'+(dis||y<p||sh.sold[k+i]?' off':'')+'" data-act="shopBuy" data-k="'+k+'" data-i="'+i+'">'+label+(sh.sold[k+i]?' <span class="chip g">구입</span>':'')+'<small>'+small+' · 연 '+p+'</small></button>';
  let h='<div class="scr"><div class="panel"><h2 style="margin:0 0 6px">거래상</h2><p class="sm">떠돌이 베티망이 좌판을 펼쳤다. "현장에서 번 돈으로만 받는다."'+TAG.o+'</p>'+(r.flags.medici_card||r.flags.medici?'<p class="xs syn">메디치 쪽 연줄로 할인받는다.</p>':'')+'<p class="sm" style="margin-top:4px">현장 연: <b style="color:var(--brass)">'+y+'</b></p></div>';
  h+='<h2>유물</h2>'+sh.relics.map((it,i)=>{const R=RELICS[it.id];const k=r.relics[it.id]||0;return b('relic',i,'<span class="rar'+Math.min(4,R.r)+'">'+R.n+'</span>'+(k?' ×'+k:''),R.d(k+1)+' · '+R.tags.map(t=>SYN[t].n).join('·'),it.p,k>=R.max);}).join('');
  h+='<h2>장비 · 강화</h2>'+b('gear',0,RAR[sh.gear.spec.r].n+' '+autoName(sh.gear.spec),SLOTS[FORMS[sh.gear.spec.f].s]+' · '+FORMS[sh.gear.spec.f].n+' · 구입 후 상태 화면에서 장착',sh.gear.p,false)+
    (sh.perk?b('perk',0,'임시 강화: '+PERKS[sh.perk].n,PERKS[sh.perk].pro+' / '+PERKS[sh.perk].con,sh.perkP,r.perks.includes(sh.perk)):'');
  h+='<h2>소모품</h2>'+sh.items.map((it,i)=>b('item',i,ITEMS[it.id].n,ITEMS[it.id].d,it.p,totalItems(r.inv)>=carryMax())).join('');
  const hasCurse=Object.keys(r.relics).some(id=>RELICS[id].curse);
  h+='<h2>서비스</h2>'+b('vent',0,'정화 처치','발현 부담 -30',sh.ventP,r.burden<=0)+b('heal',0,'응급 치료','체력 30% 회복',sh.healP,r.hp>=d.maxHP)+(hasCurse?b('curse',0,'저주 해제','저주 하나 제거',sh.curseP,false):'');
  h+='</div><div class="foot">'+footBars()+relicChips(true)+'<button class="btn primary" data-act="shopLeave">떠난다</button></div>';
  return h;}
function vSummary(){
  const s=S.summary;const cls=s.kind==='fail'?'red':s.kind==='clear'?'brass':'';

/* ---------- 렌더 / 이벤트 ---------- */
function render(){
  const app=document.getElementById('app');
  let html;try{html=view();}catch(err){console.error('render error',err);html='<div class="scr"><div class="panel red"><h2>화면 오류</h2><p class="sm">'+esc(err&&err.message||err)+'</p></div><button class="btn" data-act="recover">본부로 복구</button></div>';}
  app.innerHTML=html;
  const log=app.querySelector('.log');if(log)log.scrollTop=log.scrollHeight;
  U.fx={};if(U.toast){U.toastAge=(U.toastAge|0)+1;if(U.toastAge>1){U.toast=null;U.toastAge=0;}}else U.toastAge=0;
  window.scrollTo(0,0);}
A.recover=function(){if(S.run){S.run.sub='choose';S.run.combat=null;S.run.event=null;try{view();}catch(e){S.run=null;S.screen='hq';}}else{S.screen='hq';}U.ov=null;U.modal=null;commit();};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const fn=A[el.dataset.act];if(!fn)return;
  ev.preventDefault();
  try{fn(el);}catch(err){console.error('action error',el.dataset.act,err);window.__lastErr=err;try{render();}catch(e2){}}
});
document.addEventListener('input',ev=>{
  const t=ev.target;if(!t||!t.id)return;
  if(t.id==='s_name')U.setup.name=t.value;else if(t.id==='s_pers')U.setup.pers=t.value;else if(t.id==='s_past')U.setup.past=t.value;});
window.addEventListener('error',e=>{console.error('window error',e.message);window.__lastErr=e.message;});
